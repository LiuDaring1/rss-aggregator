schema_version: '1.0'
id: F22
topic: 平台经济创新不能以模糊用工责任为代价
source_name: 澎湃新闻·马上评
source_date: '2026-09-20'
source_url: https://m.thepaper.cn/detail/34108398
feed_url: http://127.0.0.1:1200/thepaper/channel/27224
context: 澎湃新闻深度调查报道揭露外卖骑手遭遇职业伤害后因层层转包导致维权受阻、陷入“找不到老板是谁”的尴尬。马上评随之发表评论，直指新就业形态中用工主体隐身与权益悬置的深层矛盾。
quote_paragraphs:
- 用工模式创新，固然是市场内生活力的重要体现，但劳动者权益和各类用工主体之间的权责边界必须清晰。各类模式创新，都应当把劳动者权益纳入考量，而不能以牺牲劳动者权益为目的。
- 一个规模上千万的就业群体在维护自身权益，容易被困在“老板是谁”里，无论如何都说不过去。外卖行业发展到今天，需要彻底正视这一现实了。它关系到这部分劳动者的切身权益，也事关行业的长远健康发展。法律、监管与平台方，都需要有更多的探索。问题越复杂，越需要及早行动。
analyze: 语段立论鲜明、逻辑周密。作者并未全盘否定商业模式创新，而是明确树立了“创新不能以牺牲劳动者权益为目的”的底线原则。通过“上千万就业群体被困在‘老板是谁’里”的直观反差，唤起对劳动尊严与行业可持续发展的深度思考。
memorize: 各类模式创新，都应当把劳动者权益纳入考量，而不能以牺牲劳动者权益为目的。
method: 肯定活力与划定红线法：先肯定商业创新的市场价值，随即用转折连词亮出不可逾越的权利底线，说理理性而有千钧之力。
demo_title: 示范｜谈新技术新模式与人的权益，可以这样说
demo_text: 任何技术革新和商业模式的探索，初衷都是为了激发社会活力、让生活更加便捷，但这一切的前提，绝不能以弱化对劳动者的基本保障为代价。倘若一种效率的提升是以模糊权责、转嫁风险为支撑，那它就失去了健康发展的伦理基石。真正的良性发展，应当在制度创新中始终将人的尊严与权益置于不可退让的位置。
demo_is_hypothetical: false
