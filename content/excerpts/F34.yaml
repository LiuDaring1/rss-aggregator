schema_version: '1.0'
id: F34
topic: 语文课要教会学生自己“捞鱼”
source_name: 南方周末·自由谈
source_date: '2026-09-23'
source_url: https://www.infzm.com/contents/330858
context: 高中语文名师黄德初反思应试刷题与思维培养，探讨在人工智能时代如何真正培养学生的自主探究与底层思维。
quote_paragraphs:
- 授人以鱼，只能应付一场考试；教会学生下水“捞鱼”，习得探究、辨析、求证的底层思维，才能支撑他们长期自主学习。
- 越是人工智能普及，我们越不能习惯于坐等现成答案。“捞鱼式”教学带给学生最重要的馈赠，就是学会主动求索，靠自己打捞属于自己的思考与认知。
analyze: 第一段活用传统古谚“授人以鱼不如授人以渔”，将其具象化为下水“捞鱼”，生动点出题海战术与自主学习能力的本质区别。 第二段直面人工智能时代的认知挑战，指出在答案唾手可得的技术背景下，人类自身的主动求索能力才是最无可替代的底层素养。
memorize: 探究、辨析、求证的底层思维（精准阐述学术思维与核心素养的严谨规范搭配）；坐等现成答案（形象描画算法依赖与思维惰性的生动口语表达）；打捞属于自己的思考与认知（充满文学意象与探索美感的精妙动宾搭配）
demo_title: 示范｜谈自主学习与人工智能，，可以这样说
demo_text: 今天面对AI，只要敲一下回车，各种现成答案就会源源不断地跳出来。但如果我们因此习惯了坐享其成，最终萎缩的将是我们自己的思考肌肉。学习不仅是为了拿一份分数，更是为了学会自己下水‘捞鱼’。唯有在真实的探究与辨析中打捞出来的认知，才能真正内化为支撑我们走完一生的底层力量。
demo_is_hypothetical: false
method: ……只能应付一时，唯有……才能支撑长远：将短期应急与终身发展对照，提升立论的格局与深度；越是……，我们越不能……：在时代剧变与技术冲击背景下，强化保持清醒警惕的论述力度
topic_key: inquiry-based-education
