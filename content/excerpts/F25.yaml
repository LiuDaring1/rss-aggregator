schema_version: '1.0'
id: F25
topic: 众包模式下的劳动责任认定与算法隐身
source_name: 澎湃·马上评
source_date: '2026-09-20'
source_url: https://www.thepaper.cn/newsDetail_forward_34108398
context: 外卖骑手送餐途中摔倒受伤，申请工伤赔付时发现自己勾选的是众包协议，合作公司层层转包，平台算法掌控派单却在责任面前隐身，引发关于新就业形态劳动权益保障的广泛讨论。
quote_paragraphs:
- 骑手王福民在一次送餐途中受伤，维权时遭冷遇，他提起诉讼，又牵出一系列突破他认知的问题：自己曾经随手点了“同意”的，是使他成为平台“众包骑手”的众包协议；为他提供薪水、投保的，则是平台层层转包的小企业，历经多次更换；平台的算法掌握着对他的奖惩权，但当他主张权益时，平台似乎隐身了……
- 澎湃新闻9月20日刊发的报道《谁是我的“老板”？求解骑手伤残赔付之困》，揭开了很多众包骑手面临的身份和权益困境。
- 对平台而言，通过加盟商、代理商层层分包配送业务，仅对合作方进行业绩考核，既能降低管理成本，实现轻资产运营，也放宽了行业准入门槛，给了灵活就业人群更多的选择。客观来看，这种灵活用工模式与外卖行业的特点相匹配，在通常情况下，可以说是平台、加盟商与骑手的共赢，有其现实合理性。
analyze: 作者从个案维权切入，层层剖析众包模式的运作机理。既承认轻资产外包在降低运营成本、吸纳灵活就业上的客观现实性，又敏锐指出算法控制与责任割裂之间的制度漏洞。论证客观克制，先立后破，具有极强的说服力。
memorize: 算法掌握着对劳动者的奖惩权，但在主张权益时却退居幕后；灵活用工不应演变成“用工无责”。
demo_title: 示范｜谈“算法时代的劳动权益”，可以这样说
demo_text: 平台经济带来了前所未有的灵活用工红利，但灵活性不能成为转嫁责任的避风港。当算法能够分秒不差地向劳动者派发订单、计算罚款时，它背后的平台就不能在劳动者受伤流血的时刻选择性隐身。保障新就业形态劳动者的基本权益，关键在于穿透层层外包的迷雾，让掌握实质管理权力的主体承担起不可推卸的法定兜底责任。
demo_is_hypothetical: false
method: 辩证分析法：先呈现个案困境唤起同理心，继而承认商业模式的合理性，最终切中痛点，指出制度规制的必要性。
