schema_version: '1.0'
id: F36
topic: 当算法无所不能，为什么仍要珍视双手的温度
source_name: 澎湃·马上评
source_date: '2026-09-23'
source_url: https://m.thepaper.cn/detail/34131995
context: 在世界技能大赛开幕与人工智能席卷各行业的时代背景下，探讨人类身体具身劳动与双手感知的不可替代价值。
quote_paragraphs:
- 但是，手所知道的远比我们通常承认的多。裁缝触摸布料便能预判其垂落形态，焊工根据焊缝变化调整角度与速度，维修者听见机器异响就开始寻找故障。身体通过与材料反复接触，形成了对力度、节奏和分寸的判断。这些都是知识和智慧，只是未必能被完整写成操作手册。
- 世界技能大赛让我们看见，我们的手在改造世界时，也能够与他人的手相握。人工智能时代，我们需要发展机器的能力，也需要让年轻人通过身体去制作、修理、照护、合作和真实地接触世界。正是在这些行动中，我们才能展现人之为人的能力，并重新意识到我们虽然来自世界各地，却原来如此相似。
analyze: 第一段用裁缝、焊工、维修工一组鲜活的工匠细节，生动论证了“身体的默会知识”同样是不可替代的智慧，有力批驳了唯符号计算论。 第二段从技能实操升华至人际关怀与人性的保全，呼唤青年人在算法时代走出虚拟数字空间，通过双手与物理世界建立真实有温度的连接。
memorize: 手所知道的远比我们承认的多（极富哲思与张力的开篇判断，引人入胜）；对力度、节奏和分寸的判断（精准概括工匠技能与身体实践智慧的核心词组）；真实地接触世界与展现人之为人的能力（充满人文温度与生命关怀的高级说理结尾）
demo_title: 示范｜谈人机协作与劳动价值，，可以这样说
demo_text: 在这个一键就能生成文字与图画的时代，很多人开始觉得亲手劳作已经过时。但我们常常忽略了，双手所拥有的智慧远比算法复杂得多——它包含了对材料的温度、分寸与力度的切身感知。越是身处数字化洪流，我们越需要用自己的双手去制作、去修缮、去触摸真实的现实。正是在这种切身的劳作中，我们才保全了自己作为人最宝贵的感知与尊严。
demo_is_hypothetical: false
method: 这些都是知识和智慧，只是未必能被完整写成……：拓宽传统认知的边界，肯定实践性与具身性经验的独特价值；我们既需要发展……，也需要让年轻人通过……去……：避免二元对立的偏激论调，兼顾科技进步与人文关怀的平衡
