id: F26
topic: 基层奉献的价值重估与打破职业偏见
source_name: 澎湃·马上评
source_date: '2026-09-13'
source_url: https://www.thepaper.cn/newsDetail_forward_34060459
context: 西南政法大学校长林维在开学典礼上肯定在防汛一线牺牲的25岁基层网格员校友龚宝冬为杰出校友，引发全网对名校生基层就业与青年人生价值选择的热烈讨论。
quote_paragraphs:
- 9月11日，西南政法大学校长林维在给2026级新生寄语时，提到了人工智能法学院2023届本科校友龚宝冬：“网上有人问，一个县城的网格员也是西政培养的精英吗？是的！西政培养了众多的知名学者、法律实务精英，但是龚宝冬和他们的师兄师姐一样，同样闪耀着西政人心系天下的使命担当。在龚宝冬心中，自己的职责、身边的居民就是‘天下’！”
- 今年7月17日，重庆彭水县汉葭街道发生一起山体崩塌，网格员龚宝冬在组织帮助群众转移途中，不幸牺牲，年仅25岁。面对网友的疑问，林校长的一句“是的”，简单、直接，也很有力量。
- 之所以有人发出这种疑问，可能是觉得堂堂西政毕业的大学生，应该去更大的平台，而不是在基层做一名网格员。这是一种典型的职业偏见。长期以来，社会对于名校毕业生，尤其是法学专业毕业生，似乎有着固化的想象：只有进入律所、公检法机关，或者去大企业、大平台做法务，才算学有所用。
analyze: 作者紧扣校长回答中的“是的”二字，直接反驳社会对名校毕业生的狭隘刻板印象。通过重塑“精英”与“天下”的内涵，将宏大的家国情怀具象化为基层岗位的恪尽职守。
memorize: 在他心中，自己的职责、身边的居民就是“天下”；真正的学有所用，不在于平台光鲜，而在于责任担当。
method: 释词升华法：抓取引申词“精英”与“天下”，赋予其质朴而坚实的现实含义，有力破解优绩主义偏见。
demo_title: 示范｜谈“青年的职业选择与人生价值”，可以这样说
demo_text: 评价一个年轻人的选择是否优秀，不应只看他走进了多高的写字楼、拿到了多少年薪，更要看他在自己的岗位上创造了多少真实的价值。大学的精神不仅在于仰望星空，更在于脚踏实地。当一名青年选择扎根基层，把守护百姓平安当作自己的责任时，他所展现出的担当，丝毫不逊色于任何光鲜的职业标签。
demo_is_hypothetical: false
