id: F06
topic: 青年成长 · 列举铺陈
source_name: 中青评论《一所大学、一座城市和一代青年的精神接力》2026-09-11
source_date: 近期评论
source_url: null
context: 2026“把青春华章写在祖国大地上”大思政课活动走进中国科大。这一段用三件物品讲一所大学的精神来历，是列举式写作的好样本。
quote_paragraphs:
- 中国科大自诞生之日起，命运便与国家和民族紧密相依。活动现场，校长常进院士用三件物品勾勒出一幅清晰的精神图谱：一枚“两弹一星功勋奖章”，镌刻着学校化学物理系首任系主任郭永怀，在生命最后一刻以血肉之躯护住绝密数据的壮烈；一块粗糙的红砖，沉淀着1970年南迁安徽合肥后，师生亲手烧砖建校的沧桑岁月；一组“大国重器”的照片——“悟空”“墨子”“九章”“祖冲之”，则将视线拉回当下前沿科研的主战场。时代不断向前，科研攻坚的疆域持续拓展，但“国家需要什么，我们就做什么”的信念，始终坚如磐石。
analyze: 作者借校长展示的三件物品，把一所大学几十年的历史讲成了三个画面：一枚奖章背后是护住数据而牺牲的教授，一块红砖背后是南迁后师生自己烧砖建校，一组照片里是今天的大科学装置。三件物品按时间排开，一件配一个细节，最后用一句话“国家需要什么，我们就做什么”收住。原来“精神”这种看不见的东西，可以这样落到具体的物件上。
memorize: 三连句式“一枚……；一块……；一组……”与“实物＋一个细节”的搭配——每件物品只讲一个最重的细节，不贪多。
method: 列举铺陈——选三件实物按时间或逻辑排开，一件配一个细节，末句用一句话收拢三者的共同指向。
demo_title: 示范｜换个话题，可以这样说
demo_text: 换个话题，可以这样说（设想讲自己的学校）：讲我们学校的历史，可以找三样东西：一张九十年代的老校牌，讲它怎么在两间平房里开学；一块翻修操场时挖出的旧石碑，讲几代人就在这块土地上奔跑；一张去年的校园航拍照，讲新楼和老树怎样站在同一个画面里。三样东西说完，学校的样子，自己就站出来了。
demo_is_hypothetical: true
