ref_retelling: 开学没多久，山东菏泽巨野县一所小学的新校区出了状况：家长反映教室里气味刺鼻，有孩子头晕、流鼻血，一个 56 人的班级，41 个孩子请了假。当地教体局回应说，甲醛检测是合格的；随后官方通报，已经把六年级全体学生迁回校本部。学生搬走了，疑问还没有散：检测合格，为什么孩子的身体反应这么多？刺鼻的气味到底是什么？家长想要的，是一个说得清的原因和一份让人放心的检测。
