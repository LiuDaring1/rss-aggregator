ref_retelling: 上周，广东吴川的一件事让很多人气愤：一名 5 岁的小女孩全身过敏，脸和眼睛肿得很明显，家人带她去看急诊，夜班医生却拒绝接诊；事后，这位医生还在孩子的电子病历里写下“刁蛮”这样的字眼。家长担心这个记录一直留着，影响孩子以后看病，上网维权，得到的回应却是“这是小事”“没造成身体伤害”，甚至有人说，维权是“对吴川整个地方的抹黑”。目前当地医疗部门承认，“刁蛮”两个字确实是医生写的。病历是看病用的，不是谁发泄情绪的地方。
