ref_retelling: 上周在广东吴川，一名 5 岁女童全身过敏、脸部和眼部明显肿胀，家属连夜带其就医时，急诊科夜班医生拒绝接诊；事后，该医生在医疗信息系统中，将女童的电子病历标注为“刁蛮”。家属因担忧记录留存影响日后就医而上网维权，相关部门负责人回应称“未造成身体伤害”“是小事情”，并将网上维权称为“对吴川抹黑”。目前，当地医疗部门已确认医生写下“刁蛮”属实，相关调查处理尚未公布。
