ref_retelling: 在山西盂县，38岁的小超市老板张慧军还有另一个身份——红十字星曜救援服务中心队长。9月17日晚，一位78岁的老人进山捡核桃走失，张慧军放下超市账本，带着队员连夜在密林搜寻了20多个小时，终于把老人安全背下山来。三年来，他和救援队队员自掏腰包承担油费与设备损耗，无偿完成了上千次寻人与拖车脱困救援，张慧军个人自费累计达五六十万元。9月22日，他的事迹经媒体报道后引发广泛关注，救援服务仍在山乡间继续。
mapkey: 接到进山寻人求助后，张慧军放下手头账本带队进山，经过一天一夜搜寻安全救回老人；三年里他个人自费五六十万元，带队完成上千次无偿民间救援。
