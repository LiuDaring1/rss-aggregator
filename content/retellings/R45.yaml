title: 3年上千次救援！山西盂县超市老板自掏几十万做公益
date_label: 9月下旬 · 凡人善举
source_label: 山西晚报 / 阿里公益天天正能量 2026-09-22
material_paragraphs:
- 38岁的张慧军是山西盂县一家小超市的老板，也是当地红十字星曜救援服务中心的队长。9月17日天黑时，他接到紧急求助：一名78岁的老人进山捡核桃一直未归。张慧军当即撂下超市账本，带领队员冒雨进山，经过20多个小时的连续搜寻，终于在次日密林深处安全救回走失老人。从2023年成立救援中心至今，张慧军带领队伍无偿参与了上千次寻人与车辆脱困救援。面对无工资、无经费的现状，他和队员自掏腰包承担油费与车辆损耗，张慧军个人已累计自费支出五六十万元。9月22日，阿里公益天天正能量联合山西晚报为他颁发了正能量奖励，向这位深山守护者致敬。
