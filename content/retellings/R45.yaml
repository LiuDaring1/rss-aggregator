ref_retelling: 在山西盂县，38岁的小超市老板张慧军还有另一个身份——红十字星曜救援服务中心队长。9月17日晚，一位78岁的老人进山捡核桃走失，张慧军放下超市账本，带着队员连夜在密林搜寻了20多个小时，终于把老人安全救出。三年来，他和队伍自掏腰包无偿完成了上千次救援，张慧军个人自费就达五六十万。9月22日，他荣获天天正能量奖励。这份凡人善举让我们看到，只要心怀热忱，普通的杂货铺也能成为照亮大山的温暖灯塔。
