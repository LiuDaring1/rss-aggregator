ref_retelling: 9月24日，93岁高龄的表演艺术家游本昌因病去世。他在话剧舞台上跑了整整30年龙套，直到52岁才凭借《济公》家喻户晓。80岁那年，他变卖房产创办剧团排演话剧；90岁高龄时，他在电视剧《繁花》中出演“爷叔”，甚至在拍摄期间摔伤骨折后仍坚持出镜。游本昌一生专注于表演本身，用70多年的舞台岁月留下了生动的艺术印记。
