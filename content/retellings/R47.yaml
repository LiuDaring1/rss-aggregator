title: 游本昌去世：蒲扇轻收，以戏渡人
date_label: 9月下旬 · 艺术人生
source_label: 新京报·快评 2026-09-24
material_paragraphs:
- 9月24日，著名表演艺术家、中国国家话剧院国家一级演员游本昌因病逝世，享年93岁。从话剧学院毕业后，游本昌在话剧舞台上演了整整30年龙套，很多角色只有几句台词甚至只有几秒出场。直到52岁那年，他才迎来电视剧《济公》，凭借破僧衣、脏蒲扇的形象演活了济公和尚，家喻户晓。80岁那年，他卖掉北京的房产创办剧团排演话剧《弘一法师》，剧团连亏多年依然咬牙坚持。90岁高龄时，他在电视剧《繁花》中塑造了运筹帷幄的“爷叔”，拍摄期间曾因摔伤骨折，但打上石膏后仍坚持按时到场拍摄。游本昌走完了他长达七十余年的演艺历程。
