ref_retelling: 9月24日，93岁高龄的中国国家话剧院表演艺术家游本昌因病去世。回望他的一生，他在舞台上跑了整整30年龙套，直到52岁才凭借《济公》红遍全国。80岁那年，他变卖房产创办剧团排演话剧；90岁高龄时，他在电视剧《繁花》中塑造了深入人心的“爷叔”，甚至在拍摄摔伤骨折后仍坚持登台。游本昌先生一生没有追名逐利，而是用漫长的等待与坚守证明了：只要心怀敬畏、择一事终一生，人生任何时候都能绽放出最绚烂的繁花。
