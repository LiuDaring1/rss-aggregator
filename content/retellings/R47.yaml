title: 游本昌去世：蒲扇轻收，以戏渡人
date_label: 9月下旬 · 艺术人生
source_label: 新京报·快评 2026-09-24
material_paragraphs:
- 9月24日，中国国家话剧院著名表演艺术家、一级演员游本昌因病在北京去世，享年93岁。从上海戏剧学院毕业后，游本昌曾在舞台上跑了整整三十年龙套，直到52岁才因主演电视剧《济公》红遍大江南北，将那个“鞋儿破、帽儿破”却济世扶危的活佛形象刻进几代人的记忆。80岁时，他甚至卖房变现创办剧团排演话剧《弘一大师》；年届90岁高龄时，他在电视剧《繁花》中饰演睿智干练的“爷叔”，即便在拍摄期间意外摔伤骨折，依然咬牙坚持登台。游本昌用一生的专注与澄澈回答了一个演员该如何敬畏舞台、面对观众，以戏渡人，终成一代宗师。
