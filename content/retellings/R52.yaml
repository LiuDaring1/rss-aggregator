      fact_refs:
      - 实实在在的生活掌控
ref_retelling: 在人工智能几秒钟就能生成图文的时代，城市里却出现了年轻人重拾手作的热潮。周末的木工工坊和陶艺馆里，许多习惯了敲键盘、滑手机的年轻人挽起袖子，用手抚摸木料纹理、在拉坯机上感受陶土的湿润与阻力。面对屏幕带来的数字倦怠，他们通过亲手握刀、下力气打磨器物，在与物理材料的真实接触中重新体验专注带来的踏实感。
mapkey: 在AI快速生成一切的背景下，年轻人自发走进木工与陶艺作坊亲手劳作，通过指尖触碰真实材料来摆脱屏幕疲惫、找回生活实感。
