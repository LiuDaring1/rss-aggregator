title: 尝试手作：青年在亲手劳作中体悟工匠精神与生活实感
date_label: 9月下旬 · 匠心实感
source_label: 中国青年报 2025-02-27
material_paragraphs:
- 中国青年报社社会调查中心联合问卷网对1335名受访者开展的专项调查显示，91.1%的受访者表示手作活动让自己感受到了精益求精的劳动乐趣，91.8%的受访者在尝试手作后更钦佩能工巧匠。调查案例中，甘肃兰州的高二学生邢梓涵花费近一周时间、每天三四个小时用木板拼接小型印刷机传动装置，为了调试开关位置与零件严丝合缝反复推敲；大学生聂小雅在亲手锻造戒指和雕刻花纹的过程中，体会到精细手工艺背后技术经验的积淀；美术教师任建华通过剪纸、扎染等传统非遗制作，在亲手劳动中发现美、创造美，深化了对劳动者的由衷敬意。
keywords:
- 1335名受访者专项调查
- 91.1%体会劳动乐趣
- 91.8%更钦佩能工巧匠
