title: AI时代，为什么越来越多的年轻人重拾手作与劳作？
date_label: 9月下旬 · 现实观察
source_label: 澎湃新闻 2026-09-23
material_paragraphs:
- 在人工智能只要几秒钟就能生成文本、修饰图像的当下，城市青年中却悄然兴起一股重拾“双手劳作”的风潮。从周末挤满年轻人的木工工坊、陶艺拉坯体验馆，到年轻人自发去学做传统竹编、皮具缝制，越来越多整天对着手机电脑屏幕的上班族和学生，选择把双手浸入泥土、木屑与材料之中。世界技能大赛开幕短片《我们的手》同样呈现了切割、焊接、编织等真实劳动的双手。不少参与者表示，看算法一键生成虽然快捷，但亲手用刻刀雕琢木纹、用手指感受陶土软硬的触感，带来了屏幕无法替代的踏实与专注。年轻人用亲手劳作对抗数字倦怠，在双手与物理世界的摩擦中找回了生活的实感。
keywords:
- 青年重拾手作工坊
- 木工雕刻与陶艺拉坯
- 对抗屏幕疲劳与算法依赖
- 指尖触摸泥土与木屑
- 世界技能大赛双手短片
- 具身劳作找回生活实感
