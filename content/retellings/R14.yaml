title: 柳州金沙角沙滩上有个“很凶的人”：德哥严守水域安全不退让
date_label: 报道 2026 年 8 月 25 日 · 广西柳州（9月本地精选）
source_label: 来源：南国今报 / 柳州融媒（ttzl-45328）
material_paragraphs:
- 在柳州金沙角沙滩，常年游泳的人都知道有个“很凶的人”——55 岁的袁德军（德哥）。他是一名游泳教练，也是柳州市江柏户外沙滩救援队队长。每年 5 到 11 月，他工作之余几乎天天守在岸边。凡是看到有游客没穿救生衣、不戴跟屁虫就往深水区走，他便拿起喇叭大声严厉喝止，甚至言辞激烈把人劝回浅滩。
- 有人背地里抱怨他态度粗鲁、不近人情，甚至有游客打热线投诉。面对不理解，德哥从不退让：“金沙角水流暗涌复杂，一旦溺水就是几秒钟的事。我宁可挨骂被投诉，也绝不容许一条生命在眼皮底下出事！”正是在他 11 年不讨好的严厉坚守下，救援队救回了上百条生命，用责任守住了水域安全防线。
