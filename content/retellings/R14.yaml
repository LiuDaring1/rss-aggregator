ref_retelling: 在柳州金沙角危险水域，55 岁的江柏户外沙滩救援队队长袁德军被称为“很凶的人”。只要看到游客没穿救生衣下水，他就大声喝斥劝返。尽管有人抱怨他言辞生硬甚至投诉，但他始终坚持：金沙角水下暗流凶险，宁可被游客记恨投诉，也绝不能放任生命冒险。正是这份不讨好、不退让的严厉执着，他 11 年间救回上百条生命，用责任筑起了水上安全防线。
