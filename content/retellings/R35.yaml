title: “吃作业”纸片糖走红校园周边：网红噱头背后的安全与引导
date_label: 9月中旬 · 校园消费
source_label: 中青评论 / 红网 2026-09-15
material_paragraphs:
- 9月中旬新学期开学后，一种外观印着“语文作业”“期末试卷”的纸片糖在多地小学校门口文具店热销。商家打出“吃掉作业消灭烦恼”“吃掉考卷不挨批”的标语，吸引了不少低年级小学生跟风购买。这一现象很快引起了家长和执法部门的注意。市场监管部门突击抽检发现，这些所谓的网红零食大多无生产许可证、无厂名厂址，属于典型的“三无”产品；实验室检测更显示其人工合成色素和甜味剂严重超标，存在明确的食品安全风险。目前，多地执法部门已开展专项清查，依法查扣下架违规零食，学校也通过主题班会引导学生认清噱头营销背后的危害，培养理性的消费意识与健康的学业心态。
keywords:
- “吃作业”纸片糖
- 校园周边文具店
- 营销噱头诱导学生
- 抽检确认为三无产品
- 添加剂与色素超标
- 专项整顿与健康引导
mindmap_tree:
  center: “吃作业”纸片糖整顿与引导
  branches:
  - name: 噱头走红与学生跟风
    leaves:
    - id: A1
      hint: 包装印制作业试卷
      answer: 外观模仿试卷课本，以“吃掉烦恼”为噱头吸引学生购买
      fact_refs:
      - 抓住儿童猎奇心理推销
    - id: A2
      hint: 校门口文具店热销
      answer: 在小学校园周边杂货铺流传，引发学生跟风模仿
      fact_refs:
      - 短时间内在低年级群体中迅速扩散
  - name: 抽检测试与安全隐患
    leaves:
    - id: B1
      hint: 典型三无伪劣产品
      answer: 无生产许可、无厂名厂址与保质期，来源不明
      fact_refs:
      - 执法部门现场查扣劣质产品
    - id: B2
      hint: 添加剂严重超标
      answer: 合成色素与甜味剂超标，威胁未成年人肠胃健康与身体发育
      fact_refs:
      - 化验结果证实存在卫生安全隐患
  - name: 执法查处与价值引导
    leaves:
    - id: C1
      hint: 专项清查下架追责
      answer: 监管部门开展联合执法，全量查扣违规产品并追查供货渠道
      fact_refs:
      - 净化校园周边的消费市场环境
    - id: C2
      hint: 引导理性学习心态
      answer: 学校开展食品安全与消费教育，引导孩子树立正确的学业观念
      fact_refs:
      - 警惕消费噱头消解求知责任
ref_retelling: 9月中旬开学后，很多小学门口的文具店出现了一种“吃作业”纸片糖，上面印着语文试卷、数学作业的字样，商家以“吃掉作业就不用写”为噱头，引来不少小学生掏钱购买。但这股风潮很快引起了监管部门的警惕。执法人员现场检查发现，这些零食大多没有生产厂家和卫生许可，是地道的三无产品；经过专业化验，里面的合成色素和甜味剂都严重超标，孩子吃多了容易伤害肠胃和身体。目前各地已经紧急下架查扣了这些伪劣零食。这件事提醒我们，不仅要用严格监管守住孩子“舌尖上的安全”，还要通过家校引导让孩子明白，学习中的压力要靠科学的方法去化解，而不是被不良商家的消费噱头带偏了方向。
mapkey: 顺着噱头走红、隐患曝光、监管与引导三个层面组织叙述。
