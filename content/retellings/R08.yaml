ref_retelling: 7 月 21 日凌晨，四川阆中，33 岁的聋哑青年魏治立骑摩托车回家，远远看见两公里外的社区方向起了大火。他立刻调头赶去，先按响喇叭、敲打路边的杂物，想用声响惊醒熟睡的村民——可是深夜里，回应的人很少。于是他停下摩托车，挨家挨户地砸门。有村民回忆：开门看见他站在门口，脸涨得通红，手一个劲地往起火的方向指。因为示警及时，9
  名群众安全撤离，这场大火没有造成人员伤亡。他的世界是无声的，可在那天夜里，他敲出了整座村庄最响亮的声音。
