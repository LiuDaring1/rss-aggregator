title: 不挖秦始皇陵，看懂2000多年前的“请勿打扰”
date_label: 9月下旬 · 历史文保
source_label: 新京报·快评 2026-09-21
material_paragraphs:
- 很多人好奇：现代探测与挖掘科技如此发达，为什么中国考古界至今不主动发掘秦始皇陵？其实，“不主动发掘”背后是对历史文明的高度克制与敬畏。秦陵名誉院长吴永琪多次解释：地下埋藏了两千多年的丝织品、彩绘木俑极其脆弱，一旦贸然打开接触到地表空气，密闭低氧的平衡瞬间被打破，珍贵文物会在短时间内迅速褪色、氧化甚至炭化。现代科学检测证实，封土上方的土壤汞含量高出周边数十倍，印证了地宫封存大量水银的记载。目前考古团队主要依靠遥感、物探等无损勘测技术进行外围监测与保护。不轻易打扰地宫安宁，是当代文物保护事业的科学坚守。
keywords:
- 秦始皇陵不主动发掘
- 两千年脆弱文物保护
