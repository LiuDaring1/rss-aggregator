title: 不挖秦始皇陵，看懂2000多年前的“请勿打扰”
date_label: 9月下旬 · 文化遗产
source_label: 新京报·快评 2026-09-21
material_paragraphs:
- 面对两千余年来司马迁笔下“以水银为百川江河、机相灌输”的神秘秦始皇陵，外界总有人好奇为什么中国考古界至今不主动开掘。近日新京报深度快评给出了解答：名誉院长吴永琪等几代考古学者始终坚持，地底文物极其脆弱，必须对天地自然和历史抱持深沉的敬畏之心。早在1981年和2002年，科研团队两次对封土核心区进行科学勘测，测得1.2万平方米范围土壤汞含量高出周边70余倍，证实了地下庞大水银系统的存在。在没有绝对把握实现文物无损保存前，不动铁铲、运用现代遥感与无损探测技术守护地下密闭低氧生态，恰恰是现代文明对古老遗产最崇高的“请勿打扰”。
keywords:
