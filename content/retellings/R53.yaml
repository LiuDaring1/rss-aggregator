ref_retelling: 面对规模庞大的秦始皇陵，中国考古界始终坚持不主动开挖的方针。专家解释，深埋两千多年的彩绘与丝织品一旦接触外部空气，就会迅速氧化损坏，以目前的保护技术很难完好保存。同时，科学探测也证实地宫封存着大量水银。如今团队采用遥感和物理勘测等无损方式进行日常监测，把地下文物的安宁完好留给未来。
