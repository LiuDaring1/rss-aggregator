  - name: 文明自觉与克制留白
    leaves:
    - id: C1
      hint: 对祖先与历史心存敬畏
      answer: 吴永琪等学者坚持不打扰古人，把最好的探索留给无损探测技术
      fact_refs:
      - 考古大家的人文情怀
    - id: C2
      hint: 留白是最高级的保护
      answer: 克制占有欲望守护文明尊严，彰显当代中国考古成熟深厚的大国气度
      fact_refs:
      - 现代文明的克制与担当
ref_retelling: 很多人好奇：科技这么发达，为什么我们至今不去发掘秦始皇陵？其实，不挖恰恰是对两千年前文明最大的敬畏。秦陵名誉院长吴永琪常说：地下的文物非常脆弱，我们要对天地和祖宗心怀敬畏，能不打扰就不去打扰。科学检测也证实，陵墓上方土壤汞含量比周围高出70多倍，说明地下确实封存着庞大的水银系统。一旦贸然打开，密闭低氧的环境被打破，珍贵的文物瞬间就会化为乌有。不挖不是无能为力，而是现代文明面对古老历史时的一种深情克制。真正的保护不是占有与窥探，而是让历史在安宁中守住它的尊严。
mapkey: 从民间好奇破题，以土壤汞超标实证立论，落脚于现代考古文明克制与留白的崇高价值。
