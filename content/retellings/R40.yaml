ref_retelling: 河南安徽多地秋收突遭阴雨，农户刚收割的粮食面临受潮霉变，可路边晒粮又存在很大交通安全隐患。当地派出所和乡镇大院主动拆掉门禁，把几千平米的院落停车坪腾出来给村民晒水稻和玉米。民警辅警还在巡逻间隙拿起木耙帮农户翻晒，并提供防雨篷布。金灿灿的粮食铺满大院，严肃的机关变成暖心的晒场。拆掉的是有形的院墙隔阂，收获的是百姓最真挚的信任，展现了基层公共治理最质朴的温度。
