title: 派出所主动腾空大院帮农民晒粮：“为民办实事”的温情注脚
date_label: 9月中旬 · 河南安徽
source_label: 澎湃新闻 / 新华网 2026-09-17
material_paragraphs:
- 金秋秋收季节，河南、安徽多地突遭阴雨天气，刚收割的水稻和玉米急需平整通风的硬化场地晾晒，否则极易发芽霉变。面对周边村民晒粮场地紧张的燃眉之急，当地乡镇派出所和政府大院主动敞开大门，拆除临时门禁隔离杆，将数千平方米平整开阔的停车坪全部腾空，热情邀请农户进院晒粮。金黄的稻谷铺满大院，民警辅警在执勤巡逻间隙主动拿起木耙帮农户翻晒看护，还设立便民服务点免费提供茶水与防雨油布。曾经威严安静的机关大院化身热气腾腾的金色晒场，赢得了群众由衷点赞。
keywords:
- 秋收突遇阴雨
- 水稻急需翻晒
- 派出所开门敞院
- 停车坪变金晒场
- 民警帮耙稻谷
- 便民温情实践
