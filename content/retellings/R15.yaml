id: R15
category: 正向社会生活
title: 事关长江源！杭州女教师发起求助，上百名工程师自发“接单”研发
date_label: 路演评审 2026 年 9 月 13 日 · 见报 9 月 15 日 · 青海格尔木/浙江杭州
source_label: 来源：潮新闻·钱江晚报（2026-09-15）/ 天天正能量（ttzl-45351）
material_paragraphs:
- 2026 年暑期，杭州云谷学校科学教师于淼淼前往青海海西州格尔木市唐古拉山镇沱沱河畔，在海拔 4540 米的长江源水生态环境保护站参加志愿服务。她发现保护站每天要手工记录和输入大量气温、水文、野生动物数据到 Excel 表格中，在高寒缺氧环境下耗时耗力且容易错漏。
- 回到杭州后，于淼淼在社交圈发帖求助能否开发自动化录入工具。信息迅速传开，阿里巴巴公益发起极客挑战赛，吸引上百名工程师主动“接单”组成 31 个攻坚小组。2026 年 9 月 13 日，工程师们在杭州举行公益路演评审，现场评选并融合出适配高原弱网环境的 AI 数据监测采集方案，用专业技能为雪原生态守护提供技术支撑。
