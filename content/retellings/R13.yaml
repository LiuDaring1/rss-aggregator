title: 大连79岁“巧克力大爷”考云德海边救人：推着翻扣摩托艇救回两人
date_label: 事发 2026 年 9 月 7 日 · 辽宁大连
source_label: 来源：大连晚报（2026-09-09）/ 新闻大连（ttzl-45354）
material_paragraphs:
- 9 月 7 日傍晚近 5 时，大连东港港东八街海边风急浪大，两人骑摩托艇出海意外翻扣，被大浪冲至距离岸边百米开外的深水区。落水女子不会游泳，抓着翻扣的艇在巨浪中苦苦挣扎呼救，岸上行人和接警赶来的民警焦急联系专业水上救援。
- 此时，79 岁的退休冬泳爱好者考云德刚游完泳骑车路过。听到呼救，他迅速评估自身体能后果断脱衣跳入汹涌海浪中。游到两人身边后，考大爷大声叮嘱受伤惊慌的女子“千万不要拽我，一定把住摩托艇”，随后凭借近 30 年冬泳经验顺着风浪奋力推艇，将两人一点点推向岸边。最终，考大爷在岸上消防与民警接力下成功将两人救起，落水者脱险，大爷仅腿部轻度擦伤。
