ref_retelling: 9 月 7 日傍晚，大连东港海边风浪大作，两人骑摩托艇翻扣在距离岸边百米的深水区挣扎呼救。79 岁的冬泳老人考云德刚游完泳路过，见状果断脱衣入海。游到身边后，他冷静叮嘱落水者抓紧艇身、切勿抓拽施救者，随后顺着风浪奋力推着翻扣的摩托艇游向岸边。在消防和民警的合力接应下，两人成功获救上岸。近八旬老人凭借勇气与经验勇救两人，诠释了平凡人最硬核的担当。
