ref_retelling: 2026 年秋季开学，多项调查显示青少年向往当网红、做主播的比例明显升高，甚至出现读书不如做网红的论调。主流媒体就此展开理性引导：聚光灯只照亮了极少数头部网红，忽视了背后沉没的幸存者偏差。流量潮起潮落，单纯的博眼球难以长久；唯有在校园里踏踏实实学好真本领，打牢专业与文化底子，才能拥有穿越周期、创造长期价值的真正底气。
