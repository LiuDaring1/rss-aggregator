ref_retelling: 外卖骑手王福民在送餐途中摔倒导致颅内血肿，在申请工伤维权时，却陷入了找不到用工主体的怪圈。原来他注册时签的是众包协议，实际发薪与投保企业是平台层层转包给各地的小企业，前后涉及七八家公司。平时平台算法精准控制着派单与罚款，可一旦出事，平台和合作公司却互相推诿。这一事件深刻反映出新就业形态下的权益困局，呼吁司法与监管坚持穿透式审查，依法压实平台的实质用工责任，绝不能让算法成为企业逃避兜底义务的隐身衣。
