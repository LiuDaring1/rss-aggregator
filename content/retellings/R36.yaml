title: 众包骑手送餐受伤后陷“找老板”困境：新就业形态下的权益与劳动归属
date_label: 9月下旬 · 劳动法治
source_label: 澎湃新闻 / 新京报 2026-09-20
material_paragraphs:
- 入行12年的外卖骑手王福民在送餐途中不幸摔倒，确诊颅内血肿，术后记忆力与劳动能力严重受损。在申请工伤认定和劳动仲裁时，却遭遇了层层阻碍。他发现自己注册时随手勾选同意的，是成为平台“众包骑手”的协议；而为他发放薪水、购买保险的，则是平台层层转包给各地的外包信息科技公司，平均两三个月便更换发薪主体，前后涉及七八家企业。在日常工作中，平台的算法系统精准控制着路线派单与考核罚款，但在骑手维权时平台却退居幕后，合作公司相互推诿，致使骑手陷入“不知道谁是真正老板”的尴尬窘境。这一事件引发了社会各界对新就业形态劳动权益保障与穿透式用工监管的深刻关注。
keywords:
- 众包骑手王福民
