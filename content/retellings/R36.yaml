      fact_refs:
      - 压实平台主体责任
ref_retelling: 外卖骑手王福民在送餐途中遭遇车祸骨折，在申请工伤维权时，却陷入了找不到用工主体的怪圈。原来他注册时签的是众包协议，实际发薪与投保企业是平台层层转包的外包公司，半年内甚至更换了多次。平时平台算法精准控制着派单与罚款，可一旦出事，平台和合作公司却互相推诿。这一事件深刻反映出新就业形态下的制度短板，呼吁建立穿透式监管与法定兜底责任，绝不能让算法成为企业逃避用工责任的隐身衣。
