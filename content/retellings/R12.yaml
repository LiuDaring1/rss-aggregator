category: 社会热点
title: 山东巨野南关小学新校区异味事件：41人请假，学生全部迁回本部
date_label: 事发 2026 年 9 月 1 日~3 日 · 山东菏泽
source_label: 来源：新华网 / 巨野县联合调查组 2026-09-03
material_paragraphs:
- 2026 年 9 月 1 日秋季开学，山东菏泽巨野县南关小学因本校教室紧张，将六年级学生安排至附近临时教学点。开学第一天，多名家长反映教室内有刺鼻气味，孩子出现头晕、咳嗽、流鼻血等身体不适，一班级
  56 名学生中有 41 人因担忧空气安全请假。
- 9 月 3 日晚，由教体、住建、卫健等部门组成的巨野县联合调查组发布情况通报：已将六年级全体学生紧急迁回南关小学本部复课；经排查刺激性气味主要来自新安装的油漆门，已将相关涉气设施全部拆除并强化通风。官方表示后续将由权威机构再次公开检测空气，确保校园环境安全透明。
