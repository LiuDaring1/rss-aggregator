ref_retelling: 2026 年 9 月 1 日开学，巨野县南关小学六年级迁入临时教学点，教室内出现明显刺鼻异味，致多名学生咳嗽不适，某班甚至有 41 人请假，引发家长对空气质量的强烈忧虑。9
  月 3 日晚，当地联合调查组通报，立即将全体六年级学生迁回校本部复课，排查发现异味源自新装油漆门并予以拆除，后续将安排公开专业检测，及时阻断了安全风险。
