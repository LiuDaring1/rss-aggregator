ref_retelling: 2026 年 9 月开学季，景德镇学院因新生中男生人数增加、床位紧张，统筹要求部分大四女生腾迁宿舍。由于大四学生正处在考研、写论文和求职的关键期，加之缺乏充分沟通，个别现场人员方法简单粗暴，引发了学生抗议与舆论热议。9
  月 10 日晚，校方发布通报诚恳道歉，对粗暴人员进行处理，并表示将充分吸取教训、吸纳学生意见，优化方案保障平稳过渡。
