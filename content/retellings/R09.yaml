id: R09
category: 社会热点
title: 景德镇学院开学腾退大四宿舍争议：校方致歉并调整方案
date_label: 事发 2026 年 9 月上旬 · 江西景德镇
source_label: 来源：澎湃新闻 / 校方通报 2026-09-11
material_paragraphs:
- 2026 年 9 月开学季，景德镇学院部分大四女生在社交平台发帖，反映学校为了给新入学的男生腾出宿舍，在未充分沟通的情况下要求她们搬离原宿舍。由于大四学生面临考研复习、毕业论文及求职实习，仓促搬迁引起不少学生的情绪抵抗，个别现场管理人员工作方式简单生硬，激化了矛盾。
- 事件引发关注后，景德镇学院于 9 月 10 日晚发布情况通报：因新生中男生人数超出预期，现有男生床位紧张，统筹决定调整宿舍；对过程中个别工作人员方法简单粗暴予以处理，并向学生诚恳致歉。校方表示将充分听取学生意见，做好后续服务与平稳过渡。
