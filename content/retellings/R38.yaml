title: 高校倡导“过紧日子”：严控行政排场，把经费用在教学科研刀刃上
date_label: 9月中旬 · 全国高校
source_label: 新京报 / 光明网 2026-09-19
material_paragraphs:
- 新学期伊始，北京大学、北京林业大学、安徽建筑大学等多所高校密集出台细化规定，带头落实“过紧日子”要求。在各校发布的管理细则中，明确规定禁止前往风景名胜区开会、办会不摆花草不提供水果、严禁报销烟酒与高档消费。这些硬性规定因具体严厉迅速引发全网热议，甚至招致“高校是不是没钱了”的舆论疑虑。对此，主流媒体快评指出，高校过紧日子是主动的作风校正，紧的是形式主义的排场与虚耗，绝非办学投入；专家一致倡导，将砍掉公务浮华所节省下的宝贵资金，建议优先倾斜用于更新老旧实验设备、资助困难学生以及支持基础研究，让有限的公共资源真正花在育人“刀刃”上。
keywords:
- 高校过紧日子
- 严控会议出访
- 不摆花果不报烟酒
- 破除没钱误解
- 倡导倾斜科研助学
- 回归育人本位
mindmap_tree:
  center: 高校过紧日子严控排场
  branches:
