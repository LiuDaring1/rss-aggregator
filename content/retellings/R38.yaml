    leaves:
    - id: A1
      hint: 严控公务出访消费
      answer: 北大禁赴风景区开会，安建大严禁报销烟酒与高档菜肴
      fact_refs:
      - 细化行政开支禁令
    - id: A2
      hint: 压缩日常办会排场
      answer: 北林大明确会场不摆花草不供水果，坚决杜绝形式主义
      fact_refs:
      - 严控会务消耗开销
  - name: 破除没钱误解质疑
    leaves:
    - id: B1
      hint: 引发社会舆论热议
      answer: 严格规定引来全网围观，部分公众猜测高校是否经费吃紧
      fact_refs:
      - 舆论关注高校预算
    - id: B2
      hint: 澄清节俭核心初衷
      answer: 强调紧的是奢靡排场与铺张浪费，不是降低立德树人标准
      fact_refs:
      - 区分排场与必要投入
  - name: 倡导倾斜育人刀刃
    leaves:
    - id: C1
      hint: 优先保障师生急需
      answer: 建议省下资金重点投向困难学子资助与基础研究支持
      fact_refs:
      - 优化公共资源价值排序
    - id: C2
      hint: 花在教学科研关键处
      answer: 呼吁加速更新教学实验设备，实现公共资源配置效益最大化
      fact_refs:
      - 守住教书育人核心本位
ref_retelling: 新学期北京大学、北京林业大学、安徽建筑大学等多所高校出台严规落实“过紧日子”，明确禁止赴风景名胜区开会、取消会议摆花水果、严禁报销烟酒高档消费。面对外界关于“高校是否没钱”的误解，主流评论澄清，高校紧的是浮华排场与形式主义虚耗，而不是办学质量。媒体与专家倡导，把砍掉奢华排场所省下的宝贵资金，建议优先投在更新实验设备、资助困难学生和支持基础研究等“刀刃”上，这远比会场上的虚礼更有价值。这种精打细算的务实作风，促使公共教育资源真正回归立德树人的本位。
