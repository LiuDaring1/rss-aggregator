ref_retelling: 8 月 6 日傍晚，在广东惠州惠东县的海里，14 岁的初中生王植兴听到一百多米外传来呼救——一家三口体力不支，被困在海里。他带着自己的双人救生圈游了过去，把圈交给三人，拖着他们往岸边游。拖出二十多米，他实在没有力气了。这时候他没有硬拼，而是让三人抱紧救生圈在原地等待，自己松开手，独自游回岸上，找专业救援人员帮忙。救援队的摩托艇往返三次，把三个人全部救了回来。8
  月 20 日，当地评定委员会认定：这是见义勇为。这个平时“胆子不大”的孩子，完成了一次冷静又聪明的救援。
