title: 三甲医院女医生离职送外卖：重新寻找生活的节奏
date_label: 9月中旬 · 广东珠海
source_label: 扬子晚报 / 新京报 2026-09-19
material_paragraphs:
- 在广东珠海的街头，31岁的医学女博士刘子涵换上骑手服，骑着电动车穿梭在夜色中送外卖。此前，她一路从重点中学、华西临床医学院本科读到澳门大学博士，并顺利进入一家三甲医院担任精神科医生。但在长期高强度与高度内耗的工作节奏下，她意识到体面的标签未必适合自己的身心状态。7个月前，她主动辞去医院工作，选择在珠海靠送外卖和街头驻唱生活，同时利用空余时间为迷茫的医学生提供公益咨询。面对外界“名校博士送外卖是否浪费”的关切，刘子涵坦然表示，这不是永久的固定职业，只是想走出既定轨道，亲手去探索生活的不同可能。
keywords:
- 珠海街头
- 医学女博士
- 辞去三甲职位
- 全职送外卖与驻唱
- 寻找身心自洽
- 探索生活可能
