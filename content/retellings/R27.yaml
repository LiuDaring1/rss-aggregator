      answer: 沿着优绩主义轨道前行，拥有外界眼中光鲜体面的稳定身份
      fact_refs:
      - 拥有博士学位与高门槛职业标签
  - name: 做出改变的缘由
    leaves:
    - id: B1
      hint: 身心内耗与反思
      answer: 长期高强度高压工作带来精神重负，体面并不等于适合自己的生活
      fact_refs:
      - 意识到被学历与外界期待标签绑架
    - id: B2
      hint: 辞职后的心态
      answer: 勇敢从既定轨道中停下脚步，渴望自由支配时间并掌握生活主动权
      fact_refs:
      - 7个月前主动辞去三甲医院职位
  - name: 当下的生活状态
    leaves:
    - id: C1
      hint: 街头送外卖与驻唱
      answer: 靠双手从事平凡劳动，在具体踏实的小目标中重建内心的秩序
      fact_refs:
      - 骑车取餐送达带来即时回馈
    - id: C2
      hint: 对未来的坦然理解
      answer: 不是永久职业而是一次生活探索，兼做咨询帮助他人，活在自洽时区里
      fact_refs:
      - 利用空余时间为医学生答疑解惑
ref_retelling: 31岁的医学女博士刘子涵，曾一路考入华西医学院、读完澳大博士，并进入三甲医院担任精神科医生。但在长期高压的工作节奏下，她感到身心俱疲，意识到外界羡慕的体面并不等于适合自己的生活。7个月前，她辞职来到珠海，当起了外卖骑手，并在街头兼职驻唱。面对外界对高学历送外卖的质疑，刘子涵表示这并非长久固定工作，而是想离开既定轨道，看看人生还有多少可能。她一边送外卖体验具体踏实的生活，一边利用专业知识为困惑的医学生提供咨询，在属于自己的节奏里重新找回了内心的从容。
