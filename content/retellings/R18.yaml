category: 正向社会生活
title: 长春爱心小两口医院门口免费发餐：每天上百人排队，家属主动当义工
date_label: 事发 2026 年 8~9 月 · 吉林长春
source_label: 来源：城市晚报 2026-09-02 / 天天正能量 2026-09-03
material_paragraphs:
- 2026 年 8 月中旬起，吉林松原的个体户苗洪月（大月，35岁）与丈夫带上 13 万元积蓄来到长春，在吉林省肿瘤医院西门摆起爱心餐摊，每天中午免费为肿瘤患者及家属发放上百份热乎午餐。大月因家中曾有三位老人患癌去世、丈夫亦突发心梗，深知癌症家庭承受的经济与心理重压，决定把上半年做轮胎批发生意赚来的钱用于公益。他们还在医院对面小区租下一楼改造成“大月爱心屋”，为患者家属提供做饭、歇脚的免费落脚点。
- 每天上午发餐前，大月夫妇提前一小时到场与候餐的患者和家属聊天唠嗑、鼓劲打气，还送出保暖发套等贴心小礼物；身体尚可的家属们则主动化身义工，自发协助搬运菜桶、拆摆牛奶水果、分发餐盒并维持现场秩序。面对网络上关于“作秀牟利”的个别质疑，大月回应称不设团队、不搞直播带货，“自己淋过雨就想给别人撑把伞”，带的钱花完了就回家继续做轮胎生意赚钱再来。
