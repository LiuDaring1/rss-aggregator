ref_retelling: 2026年8月中旬起，来自吉林松原的苗洪月夫妇带上13万元积蓄来到长春，在吉林省肿瘤医院门口设立爱心摊位，每天免费为上百位肿瘤患者及家属发放热气腾腾的午餐，并在医院附近租下一楼开办“爱心屋”供家属歇脚。发餐前，大月总是提前一小时到场，陪病患家属聊天打气、赠送发套；不少患者家属感动之余，主动化身帮工搬运餐桶、分发物资。面对网络牟利质疑，大月坦言自己深知患癌家庭的不易，不直播不带货，钱花完了就回家继续做轮胎生意再来，只想在最沉重的地方给绝境中的人们带去一束光。
