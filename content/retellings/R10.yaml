category: 社会热点
title: 昆明22岁外卖骑手蒋明昊扶摔倒老人：老人当场主动澄清“是他好心”
date_label: 事发 2026 年 9 月 8 日 · 云南昆明
source_label: 来源：新华社 / 人民日报 2026-09-10
material_paragraphs:
- 9 月 8 日中午，云南昆明广福路口，22 岁的外卖骑手蒋明昊送餐途中，看见一名 85 岁的老人面朝下摔倒在斑马线上，鼻子流血。在人车繁忙的送餐高峰期，蒋明昊坦言内心闪过“会不会被讹”的顾虑，但良心让他停下车，果断取消配送订单，上前扶起老人并护送就医。
- 到了医院，面对医护人员例行询问“是他撞的还是你自己摔的”，老人毫不犹豫连连摆手澄清：“没有没有，他是好心，是我自己摔的。”经查老人鼻骨骨折、肋骨骨裂，幸因及时送医脱离危险。事后家属向蒋明昊送锦旗致谢，外卖平台撤销了其超时违规判罚，并为其申报了“先锋骑手”荣誉与奖励。
