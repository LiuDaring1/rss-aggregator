ref_retelling: 9 月 8 日中午，昆明 22 岁外卖骑手蒋明昊在送餐途中，见一位 85 岁老人摔倒在斑马线上鼻部出血。尽管担心超时和“被讹”，他还是取消订单将老人送到医院。在急诊室，老人主动对护士讲明“是他好心，我自己摔的”，彻底打消了骑手的后顾之忧。随后老人脱险，家属送来锦旗，外卖平台也撤销了超时判罚并给予表彰奖励，让善意得到了温暖回响。
