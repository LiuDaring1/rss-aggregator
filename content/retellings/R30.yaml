material_paragraphs:
- 湖南益阳的郭佳云出生时因脑部缺氧导致脑瘫，双手严重畸形，双脚行动困难，被评定为肢体二级残疾。面对身体局限，她自学文化知识，练习用双脚代替双手操作电脑。刚开始练习时脚趾经常磨破肿痛，几年下来她用坏了40多个鼠标，不仅能熟练用脚打字，还自学掌握了多款平面设计软件。2019年，郭佳云成为一名电商客服，随后创办“佳云设计”团队，主动招收并培训了多名重度残疾青年，带领大家通过网络承接美工设计与店铺客服业务。如今团队年营收超过20万元，8位残障伙伴不仅实现了自食其力，更用专业劳动赢得了社会的尊重。
