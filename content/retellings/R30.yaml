ref_retelling: 湖南益阳的郭佳云因出生脑瘫导致双手严重畸形，生活极度不便。但她没有认输，而是坐在矮椅上练习用双脚操作电脑。为了掌握打字和设计技能，她几年里用坏了40多个鼠标，脚趾经常磨破起茧，硬是凭着一股韧劲学会了熟练打字和专业平面设计。后来，郭佳云不仅成为一名电商客服，还创办了自己的设计团队，带领另外7位重度残疾青年一起通过互联网承接美工与客服业务。现在，这个8人团队年营收超过20万元。郭佳云和伙伴们没有等待被动施舍，而是靠着实打实的劳动和技能，为自己赢得了生活的主动权与沉甸甸的职业尊严。
