title: 00后大学生送外卖打工攒钱：吃泡面奔赴偏远大山支教
date_label: 9月上旬 · 云南
source_label: 天天正能量 / 云南网 2026-09-04
material_paragraphs:
- 云南00后大学生李文义一直梦想前往偏远山区小学支教。为了不给家里增加负担，并为山区学生筹集助学用具，他在假期选择靠双手打工挣钱。整个暑期，他白天在建筑工地做小工搬砖，晚上骑电动车穿街走巷送外卖；为了节省开销，他常常连续吃泡面填饱肚子。凭借辛勤劳作，他不仅攒齐了去山区全职支教一年的生活费，还自筹节约了10多万元物资和助学款，资助了14名困难孩子重返课堂。秋季开学后，李文义背上行囊走进大山小学，不仅承担基础教学，还自费添置画笔与科学器材给孩子们上兴趣课。李文义平静地表示，趁着年轻多吃点苦，能帮大山的孩子看到更大的世界，这样的青春很有分量。
