ref_retelling: 云南00后大学生李文义，为了实现去偏远大山支教的愿望，决定完全靠自己的双手来解决费用。整个暑假，他白天在工地上搬砖打小工，晚上又骑着电动车送外卖；为了多攒下一点钱，他连续吃泡面省吃俭用。几个月下来，李文义不仅攒足了自己一整年支教的开销，还自筹资金帮助了14名困难孩子重返学堂。今年秋季开学，他如愿走进了大山深处的小学，除了上好基础课，还自费买了画笔和教具，带孩子们做实验、唱歌。面对网上的点赞，李文义觉得没什么了不起，他说趁年轻靠劳动吃点苦，能帮山里的孩子推开看世界的窗户，这种付出就特别值得。
