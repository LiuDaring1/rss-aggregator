ref_retelling: 9月19日，大连枫叶职业技术学院的大三学生沈道任在望鱼山遇到惊险一幕：一名环卫工人大叔失足悬在陡峭崖壁上，命悬一线。千钧一发之际，沈道任攀上悬崖，蹬着岩石用双手死死拉住绳索，在众人帮助下成功把大叔救了上来。救人后他默默离开回校上课，网友凭借视频里他脚上的一双醒目黄鞋，全网接力寻找，亲切称他为“黄鞋侠”。9月22日，他荣获天天正能量颁发的5000元奖金。危难时刻敢于出手，事了拂衣不居功，这位00后大学生用行动诠释了新时代青年的勇敢与担当。
