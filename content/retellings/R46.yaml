title: 大连“黄鞋侠”：悬崖边拉紧救命绳的大学生
date_label: 9月下旬 · 青年担当
source_label: 大连晚报 2026-09-22
material_paragraphs:
- 9月19日，大连枫叶职业技术学院大三学生沈道任在望鱼山游玩时遇到险情：一名环卫工人大叔失足滑落，身体悬在陡峭崖壁上，双手抓住软草双腿发抖，随时可能坠下深崖。危急时刻，沈道任没有犹豫，顺着陡坡攀爬到接近崖边的石台上，在路人协助下死死拉住抛下的救命安全绳。经过十多分钟的合力拉拽，终于把受惊的大叔稳稳拉回安全路面。救完人后，沈道任悄悄离开现场回校上课。现场目击者拍下视频并在网上全网寻找这位穿亮眼黄鞋的救人小伙，亲切称他为“黄鞋侠”。9月22日，校方与当地媒体确认了他的身份。
keywords:
- 大连大学生沈道任
- 望鱼山陡峭悬崖
- 环卫工人失足命悬一线
- 脚蹬岩石紧拉救命绳
- 事后默默离开回校
- 全网寻找黄鞋侠
mindmap_tree:
  center: 大连悬崖拉绳救险情
  branches:
  - name: 险峰惊魂与紧急出手
    leaves:
    - id: A1
      hint: 环卫工失足悬挂崖壁
      answer: 大叔半空悬挂崖边进退不得，随时面临坠崖危险
      fact_refs:
      - 命悬一线双腿发抖
    - id: A2
      hint: 攀爬险峰死死拉紧绳索
      answer: 沈道任攀至石台踩稳支撑点，双手死拉绳索拉回大叔
      fact_refs:
      - 合力脱困转危为安
  - name: 默默返校与全网寻人
    leaves:
    - id: B1
      hint: 救人后悄然离开
      answer: 脱险后沈道任没有留下姓名，拍拍泥土直接返回学校上课
      fact_refs:
      - 不事张扬从容返校
    - id: B2
      hint: 黄鞋印记全网寻获
      answer: 目击视频中亮眼的黄鞋成为关键线索，学校老师确认其身份
      fact_refs:
      - 全网接力寻找到人
ref_retelling: 9月19日，大连枫叶职业技术学院大三学生沈道任在望鱼山遇到惊险一幕：一名环卫工人大叔失足滑落陡坡，双手抓着枯草悬在崖壁上，命悬一线。千钧一发之际，沈道任攀上悬崖附近的石台，蹬着岩石用双手死死拉住救援绳索，在众人帮助下成功把大叔拉了上来。救人后他没有留名，默默离开回校上课。随后网友根据视频里他脚上的一双醒目黄鞋全网寻人，9月22日，学校核实了他的身份并通报表扬。
mapkey: 环卫大叔悬在望鱼山崖壁命悬一线，大学生沈道任攀上石台紧拉救命绳将人救起，事后默默返校上课，凭着脚上的黄鞋被全网找到。
