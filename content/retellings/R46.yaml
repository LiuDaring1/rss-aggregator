title: 奖励5000元！大连“黄鞋侠”，终于找到你了！
date_label: 9月下旬 · 见义勇为
source_label: 大连晚报 / 新闻大连 / 阿里公益天天正能量 2026-09-22
material_paragraphs:
- 9月19日下午，大连枫叶职业技术学院大三学生沈道任在望鱼山散步时，突然听到游客呼救。走近一看，一名环卫工人大叔失足悬挂在几十米高的险峻崖壁上，双腿剧烈发抖，绳索救援迟迟未至，命悬一线。危急关头，沈道任毫不犹豫攀爬悬崖，脚蹬陡峭岩壁，用双手死死拉住救命绳索全力向上拉拽，在众人协助下最终将老人安全拖回平地。救完人后，沈道任悄悄离开现场回校上课。现场视频中他脚上穿的一双亮眼黄鞋被全网记住，网友亲切称他为“黄鞋侠”。9月22日，媒体经过接力寻找终于找到沈道任，阿里公益天天正能量联合新闻大连为他颁发5000元正能量特别奖。
