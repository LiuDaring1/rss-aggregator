ref_retelling: 北京的一家寿司郎门店里，发生了让人皱眉的一幕：一名家长带孩子在餐位就餐时，孩子在座位上想小便，家长顺手拿起一个塑料饮料杯，就在座位上给孩子接住了。这一幕被人拍下来传到网上，批评声很快涌来——餐厅是大家吃饭的地方，这不是小事。涉事门店回应说，已经全面消杀，孩子接触过的餐具全部废弃；家长也公开道歉，表示愿意赔偿。带孩子出门，大人要提前想好应急的办法；公共场所的规矩，要靠每一个用餐的人一起守。
