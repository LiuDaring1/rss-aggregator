title: 柳州龙美村77岁老人定下乡规，全村集资给好学孩子奖学接力39年
date_label: 事发 2026 年 8 月底开学前夕 · 广西柳州
source_label: 来源：南国今报（ttzl-45337）
material_paragraphs:
- 在广西柳州市柳城县古砦仫佬族乡龙美村，有一条全村共同恪守的规矩：每年秋季开学前，全村在村口大榕树下举行仪式，给所有学习成绩优异、获得奖状的孩子发放奖学金。哪怕是幼儿园领到“好孩子”奖状的娃娃，也能登上台领奖。
- 这项规矩是 77 岁的村民覃记安在 1987 年提议发起的，由村民自愿众筹集资，至今已连续接力了整整 39 年。今年开学前夕，全村共有 200 多名孩子登上领奖台，共发放奖学金
  1.3 万余元。39 年间，这个曾经偏僻的小山村走出了上百名大中专毕业生与研究生，一条质朴的乡约改变了几代人的精神气质。
