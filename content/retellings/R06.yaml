ref_retelling: 浙江绍兴的一个老院子里，75 岁的陈金敖爷爷种出了一根藤上七个大葫芦——像极了动画里的“爷爷和七个葫芦娃”。台风过后，藤上恰好留下七颗果实，全国游客都来打卡。老人不收钱，也没有商业拍摄，只立了块牌子，提醒大家：别大声，别把爷爷累着。他的一句话让很多人心头一热：我的小孩没有了，我就把这七个葫芦当成自己的小孩；游客走这么远来，我就把他们当成自己的亲人。没有剧本，没有门票——最动人的风景，是风景里那个温暖的人。
