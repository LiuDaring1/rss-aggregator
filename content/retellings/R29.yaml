title: 求职面试方案遭企业抄袭：青年拿起法律武器成功维权
date_label: 9月中旬 · 职场权益
source_label: 红网 / 扬子晚报 2026-09-19
material_paragraphs:
- 9月中旬，青年求职者小林应聘某文创公司的策划岗位，在复试时按要求提交了一份包含动线设计、商户招募与预算规划的数千字线下市集完整方案。然而提交后，公司人事以“经验不够”为由回绝了录用。半个月后，小林却在该公司公开举办的商业市集现场，发现其主题创意、展位布局甚至互动文案几乎原样照搬了自己的方案。面对劳动成果被侵害，小林没有选择沉默，而是调取了带有时间戳的原创方案文件、邮件记录和沟通对话，在版权保护与法务部门指导下向企业递交交涉函。面对完整证据链，涉事公司公开道歉并按市场标准全额支付了版权报酬。这一维权案例引发了社会对求职者智力成果保护的关注。
keywords:
- 青年求职者
- 面试提交策划案
- 未录用却遭抄袭
- 保留时间戳证据
