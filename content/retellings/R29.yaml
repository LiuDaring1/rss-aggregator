      fact_refs:
      - 仅收到简单通知未被录用
  - name: 侵权发现与取证
    leaves:
    - id: B1
      hint: 现实侵权撞车
      answer: 半个月后发现该公司商业市集照搬其原案，部分文案一字未改
      fact_refs:
      - 在商圈现场发现活动创意与自己作业完全一致
    - id: B2
      hint: 证据链留存梳理
      answer: 迅速梳理带时间戳的原稿、提交邮件及微信聊天记录
      fact_refs:
      - 在专业部门指导下固定完整客观证据
  - name: 维权交涉与结果
    leaves:
    - id: C1
      hint: 依法正式交涉
      answer: 向涉事公司发出正式知识产权侵权交涉函与事实对照表
      fact_refs:
      - 拒绝吃哑巴亏，理性合法主张权益
    - id: C2
      hint: 获得致歉与赔偿
      answer: 企业负责人公开承认侵权并致歉，按行业标准全额支付版权费
      fact_refs:
      - 成功捍卫青年求职者的劳动成果与合法权益
ref_retelling: 9月中旬，求职者小林在应聘一家文创公司的策划岗位时，按要求提交了一份数千字的市集策划案，但随后被公司以“经验不足”拒绝。没想到半个月后，小林发现该公司举办的商业市集，从创意构想、摊位动线到互动文案，几乎完全照搬了自己的方案。面对求职劳动成果被侵占，小林没有选择沉默自认倒霉，而是迅速收集带有时间戳的原稿、往来邮件和聊天记录，在专业部门指导下正式向公司交涉。在确凿的证据链面前，涉事公司公开道歉，并全额支付了方案版权报酬。这次维权不仅保护了自己的合法权益，也提醒用人单位必须尊重求职者的智力成果。
