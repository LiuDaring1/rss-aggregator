material_paragraphs:
- 最近在海外社交媒体上，“China Haul”（中国购物开箱）成为风靡全球的热门话题。在江苏昆山的大渔湾商业街，来自美国的音乐经纪人詹姆斯兴奋地面对镜头，逐一拆开自己在当地采购的便携麦克风、云台相机和无人机设备，并在社媒上详细介绍其优良性能与实惠价格。以往外国游客来华主要是游览名胜古迹，如今不少外籍创作者专程携带空行李箱来到中国各大城市，开启“反向海淘”扫货之旅。从无人机、电动滑板车到智能小家电，海外博主们的自发开箱与测评视频获得了数以百万计的播放量，展现出中国制造在海外年轻群体中不断上升的关注度。
