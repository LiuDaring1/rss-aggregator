ref_retelling: 最近在海外社交平台上，“China Haul”——也就是中国购物开箱成为热门现象。在江苏昆山，来自美国的音乐经纪人詹姆斯向镜头展示了刚买的无人机、云台和收音麦克风，称赞设备做工精良且价格公道。如今不少外籍创作者专程带空行李箱来中国采购数码装备和智能硬件，通过自发开箱测评在海外平台持续分享，展示了中国产品在国际市场上的实际吸引力。
