ref_retelling: 最近在海外社交平台上，“China Haul”——也就是“中国购物开箱”彻底火了！在江苏昆山的大渔湾，美国音乐经纪人詹姆斯兴奋地向镜头展示刚买的无人机、云台和收音麦，称赞中国设备性价比极高，同行都在互相种草。以前外国朋友来中国主要是逛故宫看长城，现在很多人专门带大号空行李箱来中国“反向海淘”。这种热潮背后，是中国制造撕掉了过去低端代工的旧标签，用硬核的科技、极致的设计和亲民的价格赢得了世界消费者的真心喜爱。被世界开箱的，不仅是中国商品，更是中国开放自信的底气。
