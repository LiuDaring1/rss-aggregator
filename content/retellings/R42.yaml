title: 景区“3000万招NPC”引发热议：莫让高薪画饼透支文旅诚信
date_label: 9月下旬 · 文旅观察
source_label: 红网 / 青椒快评 2026-09-22
material_paragraphs:
- 近日，山西晋城司徒小镇景区宣布投入3000万元，面向全国高薪招聘100名NPC（非玩家角色），宣称头部演员可谈千万年薪，素人也有百万年薪机会。消息一出，招聘后台简历迅速爆满，引发舆论对文旅“情绪价值”变现的高度关注。然而，不少媒体与公众随即提出质疑：该景区一个多月前曾宣称“500万元现金悬赏拍短视频”，至今仍未兑现；眼下再抛出千万年薪，难免让人担忧是否又是一场博眼球的流量画饼。主流媒体评论指出，为创意与互动买单体现了市场活力，高薪不是原罪，画饼才是；承诺一旦出口就关乎劳动者权益与地方公信力，必须拿出明晰的考核标准与契约兜底，更不能以单一薪酬标尺窄化劳动者的职业价值。
