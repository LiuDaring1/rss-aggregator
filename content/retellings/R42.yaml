ref_retelling: 山西晋城司徒小镇景区宣布投入3000万元面向全国招聘100名NPC，开出百万甚至千万年薪，迅速登上热搜。然而热闹背后，媒体指出该景区前不久曾承诺的500万元短视频悬赏至今未兑现，引发公众对流量画饼与透支信用的普遍质疑。主流评论强调，为情绪价值付费无可厚非，但高薪不是原罪，画饼才是。景区不能把求职者的期待当成免费的广告噱头，每一份承诺都必须拿出明确的考核机制与契约兜底；社会各界也应保持清醒，不被单一高薪叙事绑架，真正尊重默默奉献的劳动者。
