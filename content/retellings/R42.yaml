ref_retelling: 国庆节前夕，多地景区斥巨资高薪招募真人NPC制造互动打卡热潮，引发社会广泛关注。许多景区内，游客排长队只为与古装NPC对暗号拍短视频，原本充满历史厚重感的古建与文物展馆反而无人问津。甚至有景区互动剧本低俗肤浅，脱离了真实历史背景。沉浸式体验本该是让传统文化生动活化的好手段，但若本末倒置沦为流量噱头，就会患上NPC依赖症。景区只有深耕自身文化底蕴、做好服务，才能实现真正的可持续发展。
