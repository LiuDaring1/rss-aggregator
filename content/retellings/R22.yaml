ref_retelling: 2026年9月3日清晨，杭州萧山一位老人在街头摔倒、后脑流血。上学途中的17岁技校女生周子歆目睹后，虽闪过对假摔的顾虑，但看到老人摔得极重，仍果断上前将老人托扶至路边。她拨打120并在指导下脱下校服垫在老人脑后止血。买早饭路过的朱女士主动接力联系老人家属，并在老人送医后，主动把女孩染血的校服带回家清洗。周子歆单衣赶去学校迟到，随后朱女士联系学校公开表扬了女孩。这场街头救助既有青年的赤诚挺身，更有身旁普通人的贴心托举。
