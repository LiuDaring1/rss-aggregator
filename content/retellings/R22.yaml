title: 萧山17岁女生脱校服为摔倒老人止血：路人主动带回血衣清洗
date_label: 事发 2026 年 9 月 3 日 · 浙江杭州萧山（W37历史复用检验）
source_label: '来源：潮新闻·钱江晚报 2026-09-11 / 人民日报 2026-09-10（来源ID: ttzl-45353）'
material_paragraphs:
- 2026 年 9 月 3 日清晨 7 点多，杭州市萧山区育才路学士桥附近马路边，一位白发老奶奶在晨练途中突然毫无征兆地向后栽倒，后脑着地血流不止。正赶着过马路上学的萧山技师学院 17 岁学生周子歆目睹险情。那一刻她心里闪过一丝“会不会是假摔”的担忧，但看到老人重重摔在地上看着就疼，便没再犹豫快步跑上前去。周子歆双手托住老人腋下，挪到路边小店旁坐下，并立刻拨打 120 急救电话。
- 按照急救接线员的指导，需要找干净物品压迫止血。周子歆随即脱下早上刚换的长袖校服外套，叠好垫在老人脑后伤口上。路过买早饭的朱女士主动上前帮忙，接过电话协助联系了老人家属。7 点 20 分急救车赶到将老人送医。见女孩校服沾满血迹无法穿戴，朱女士主动提出把衣服带回家清洗并择日送还。周子歆穿着里层单薄衣物赶往学校，到校迟到但未对老师夸耀救人之事。经治疗老人当天安全出院，朱女士洗净校服后联系学校表扬女孩。
