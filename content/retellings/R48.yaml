ref_retelling: 一张用过的火车票能干什么？在北京，它现在能当打折优惠券使！今年中秋前夕，北京市重点站区管委会统筹“八站两场”，推出了创新的“票根经济”。旅客拿着进出京火车票，就能在周边商圈享受餐饮、住宿和景区的真金白银优惠；候车大厅里还摆起了非遗剪纸、传出了悠扬的民乐。原本大家去火车站只顾着行色匆匆赶路，如今却能在抵京第一站感受浓浓的文化温度。这一招巧思，不仅盘活了客流消费，更让城市服务展现出了满满的暖意。
