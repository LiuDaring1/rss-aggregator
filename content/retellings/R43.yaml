ref_retelling: 湖南溆浦中都乡学校开设了少年摄影班，山里的孩子们用二手单反相机记录下自己生活的土地。在他们的镜头里，既没有苦情悲叹，也没有浮夸的田园滤镜，而是爷爷劳作的厚重老茧、晨曦中发亮的青石板以及同伴们无忧无虑的灿烂笑容。这些纯粹而有力量的照片登上了《人民日报》专题展播。这门摄影课不仅教给孩子们观察世界的技能，更让乡村摆脱了被注视、被逃离的刻板形象，在孩子们心中播下了对故乡真实而深沉的热爱与自尊。
mapkey: 顺着发起摄影课、打破审美滤镜与主流展播重塑故乡自信展开复述。
