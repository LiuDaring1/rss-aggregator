title: 乡村摄影课打破滤镜偏见：在真实乡土中培育青少年的审美表达
date_label: 9月下旬 · 湖南怀化
source_label: 人民日报 / 新京报 2026-09-23
material_paragraphs:
- 在湖南省怀化市溆浦县中都乡学校，一门名为“我的眼睛”的公益少年摄影课，彻底改变了山里留守儿童看待家乡的方式。青年教师刘垒带领孩子们拿起捐赠的二手单反相机，在田间地头学习对焦与构图。孩子们拍下的作品没有外界刻板印象中的破败苦难，也没有短视频滤镜里的虚假田园，而是爷爷手上厚重的老茧、晨光下青石板上晶莹的水滴、同伴嬉戏时烂漫的笑容。这批洋溢着纯粹生命力的摄影作品登上《人民日报》新媒体专题展播，打动了无数网民，生动诠释了在真实土地中培育青少年审美与自尊的美育力量。
