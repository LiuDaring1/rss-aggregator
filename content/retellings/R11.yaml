schema_version: '1.0'
id: R11
category: 社会热点
title: “低保家庭能否装空调”引发讨论：民政与媒体明确不搞“一票否决”
date_label: 讨论 2026 年 9 月上旬 · 全国关注
source_label: 来源：新京报 / 央视网 2026-09-11
material_paragraphs:
- 2026 年 9 月上旬，“低保户家中装空调是否应取消低保资格”的话题登上网络热搜。起因是部分地方在基层低保核查时，仍有工作人员把空调当作“高档耐用消费品”，一旦发现有安装便质疑其贫困真实性，引发公众对救助认定标准的激烈讨论。
- 对此，多地民政部门及主流媒体明确回应：低保审核是以家庭总收入、财产状况为核心的综合评估，绝不以是否拥有单一家电作为一票否决项。在极端高温天气频发的今天，空调已成为防暑度夏的基础生活配套；社会救助要保障的是困难群体的基本生存尊严，认定标准须随社会发展与时俱进，重点防范虚假骗保，而不应让贫困变成苦行。
keywords:
- 低保家庭装空调
