ref_retelling: 2026 年 9 月上旬，网络上围绕“低保家庭装空调该不该取消资格”展开热议。过去部分地区曾把空调视作奢侈消费品，导致基层核查出现争议。民政部门与媒体随后明确澄清：低保审核是对家庭收入和财产的全面综合评估，绝不以单一家电搞一票否决。随着高温常态化，空调已成为保障健康的基础生活设施。社会救助既要精准防范骗保，也要保障困难群众有尊严地生活。
