title: 听障青年在无声店里月入过万：靠专业手艺赢得职业尊严
date_label: 9月上旬 · 河北石家庄
source_label: 天天正能量 / 河北新闻网 2026-09-02
material_paragraphs:
- 在河北石家庄的一家无声咖啡馆里，几名年轻的听障咖啡师正专注于咖啡萃取与拉花。他们通过手语、微笑和桌上的点单卡与顾客顺畅交流。这家店的发起人苏长奎在过去5年里，坚持为残障青年提供免费专业技能培训，先后培训了60多名听障青年，帮助其中30多人走上稳定工作岗位。初到店里时，很多年轻人因自身缺陷性格自卑怯懦；苏长奎手把手带教，利用他们视觉敏锐、心无杂念的特点，苦练咖啡冲调与拉花技巧。凭借出色的专业出品，该店赢得大量回头客，多名骨干咖啡师月收入突破万元。顾客纷纷评价“大家来这里不是因为同情，而是他们的手艺真的无可挑剔”。
