ref_retelling: 在河北石家庄的一家无声咖啡馆里，一群听障年轻人用双手打拼出了属于自己的精彩人生。这家店由苏长奎发起创办，5年来培训了60多名听障青年，帮他们掌握一技之长。这些年轻人一开始因为听不见，性格内向胆怯；但在带教老师指导下，他们发挥视觉专注的优势，反复打磨冲泡与拉花手艺。现在，他们通过手语和定制卡片为顾客提供细致服务，做出的咖啡品质出众，店里的业务越来越红火，多位咖啡师月收入超过了一万元。很多常客说，自己常来光顾绝不是出于同情，而是因为他们的专业出品确实无可挑剔。靠着过硬的本领，这些听障青年赢得了社会的真诚尊重。
