title: 第48届世界技能大赛在沪开幕：一技之长也能点亮世界
date_label: 9月下旬 · 技能筑梦
source_label: 光明网评论员 2026-09-22
material_paragraphs:
- 9月22日晚，第48届世界技能大赛在上海隆重开幕。在未来的6天赛期里，来自全球68个国家和地区的1385名青年技能高手齐聚申城，在几十个技能项目中展开技艺切磋。大赛的项目设置紧贴现实生产生活需求，既有木工、花艺、烹饪等体现深厚匠心传统的经典工艺，也涵盖了无人机系统、云计算、智慧安防等前沿现代技术。开幕式上，以《我们的手》为主题的短片呈现了青年技工专注切割、焊接与编织的特写镜头，生动展现了劳动者的专注与创造力。世界技能大赛的举办，让全社会目光再次聚焦于青年技能人才的培养与成长。
