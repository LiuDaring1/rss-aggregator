ref_retelling: 2026年暑期，山东师大大二学生赵敏以支教队长身份，连续第二年走进湖南娄底山区，为乡村女童开设专属生理科普课。因为自己年少时深感生理知识匮乏，赵敏下决心补齐这一课，并联系公益组织妥帖发放卫生巾。在课堂上，赵敏发现当地女孩基础认知较好，“不害羞、很配合”，但仍普遍存在把内裤放进洗衣机混洗等具体误区。面对伤害提问，有大女孩清醒回答“这不是我的错，要报警”；大家还在黑板上写下“变胖也没关系”。赵敏深知十多天支教难以立竿见影，但她愿做播种人，把了解身体、捍卫自尊的种子留在孩子心底。
