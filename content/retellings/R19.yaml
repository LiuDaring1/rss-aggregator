title: 山东大二女生赵敏连续两年进山：给乡村女童开设专属生理科普课
date_label: 事发 2026 年 7~8 月 · 湖南娄底
source_label: 来源：三湘都市报 2026-09-06 / 天天正能量 2026-09-06
material_paragraphs:
- 2026 年暑期，山东师范大学大二学生赵敏以支教队队长身份，带着打磨成熟的青春期生理科普课走进湖南娄底乡村。这是赵敏连续第二年进山支教。源于自己年少时对生理知识的匮乏与困惑，她从大一开始便在社团中发起女童生理课倡议，并自主联系公益组织筹措卫生巾物资。为了照顾青春期女孩的自尊心，团队在发放物资时采取妥帖方式，把这门自己小时候缺失的课程带进大山。
- 课程涵盖基础生理常识与卫生用品使用、自我保护与防性骚扰、女性力量三部分。在娄底支教时，赵敏发现这批孩子的基础认知较好，表现得“不害羞、很配合”，但也存在将贴身内裤放进洗衣机混洗等日常卫生误区；在自我保护课堂上，面对“遭遇伤害不被理解怎么办”的提问，有年纪较长的女孩脱口而出“这不是我的错，要报警”；在“女性力量”环节，孩子们在黑板上的成长树写下“变胖也没关系”。赵敏认为短短十多天的支教难以立竿见影改变一切，但就像埋下一颗让女孩了解身体、学会自护的种子。9 月 6 日，阿里公益联合三湘都市报为赵敏颁发了小微公益专项奖。
