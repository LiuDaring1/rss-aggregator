title: 省城闲置公车乡镇“上岗”，这个改革作业可以抄
date_label: 9月下旬 · 基层治理
source_label: 新京报·快评 2026-09-20
material_paragraphs:
- 一直以来，“省级机关公车闲置停放，偏远基层乡镇运力紧缺”是许多地方普遍面临的资源错配难题。近日，山东启动公务用车“公物仓”创新试点，首批从省城直属单位遴选出20台因机构改革或业务调整而闲置的公车，打破层级壁垒直接跨区域调拨至5个县市区的偏远乡镇使用。这些车辆全部下沉到基层一线，专门保障山区农技服务下乡和应急值守巡查。这场不花财政一分冤枉钱的改革，通过盘活沉睡存量精准匹配供需，既扎实践行了党政机关“过紧日子”的勤俭要求，又切实解决了基层干部跋山涉水跑业务的燃眉之急。
