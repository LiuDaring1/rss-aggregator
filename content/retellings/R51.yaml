ref_retelling: 38岁的柳智宇曾是国际数学奥林匹克竞赛金牌得主并保送北大，但在大学毕业后，他放弃了麻省理工学院全额奖学金，选择上山出家。在修行十多年后，他于2022年还俗重返社会，如今创办了心理工作室，成为一名心理咨询从业者。柳智宇表示，自己过去曾把弦绷得太紧，过度活在别人的期待中；如今通过在现实中倾听和帮助他人，他建立了生活的安稳感。
