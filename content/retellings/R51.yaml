ref_retelling: 在不少地方，常能看到“省城大院公车闲置停放，偏远乡镇干部下乡没车用”的尴尬现象。近日，山东启动了一场聪明的公车改革：建立全省“公物仓”，首批把省城闲置的20台公车直接跨层级调拨给偏远乡镇，用来保障农技服务和应急值守。过去公车按部门私有确权，谁也借不动谁；如今打破壁垒建起周转仓，不花一分财政新钱，就让沉睡的公车在田间地头重新跑了起来。把省机关的排场缩减下来，把基层实干的保障托举上去，这样务实的紧日子，才真正过到了百姓心坎里。
