title: 走出“神童”光环：数学天才柳智宇的人生求索
date_label: 9月下旬 · 人生抉择
source_label: 南方周末 2026-09-23
material_paragraphs:
- 38岁的柳智宇曾是备受瞩目的数学天才：18岁斩获国际数学奥林匹克竞赛金牌并保送北京大学数学系。然而在世人期待他向菲尔兹奖发起冲击时，大学毕业后的柳智宇却做出了出人意料的抉择——放弃麻省理工学院全额奖学金，上山出家修行。经历十余年的静思沉淀后，他于2022年选择还俗，重新走入现代社会。如今，已结婚成家的柳智宇创办了一家心理咨询工作室，同时作为内容创作者在线上分享人生体悟。回望过往数次重大抉择，他坦言自己曾经的问题是把自己逼得太急、活在外在评价里，如今在现实中倾听他人、提供心理支持，让他找到了内心的平静与真正的归属。
