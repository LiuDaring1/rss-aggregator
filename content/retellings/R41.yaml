ref_retelling: 安徽大学开学典礼上，患有先天脊柱肌萎缩症的轮椅少年程东作为新生代表发言。面对母亲与师生，他动情地说：那些咬牙难熬的日子，今天都值了！自幼无法行走的程东，在母亲十几年的背送陪伴下，在特制斜板上奋力苦读，终于以优异成绩考入计算机专业。学校特意为他们改造了无障碍宿舍。程东的故事里没有自怨自艾，只有自强不息的坚毅与感恩。他立志深耕无障碍科技，帮助更多残障人士打破生活的壁垒。
