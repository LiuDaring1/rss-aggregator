title: 轮椅少年大学报到真情发言：“那些难熬的日子，今天都值了！”
date_label: 9月中旬 · 四川成都
source_label: 合肥晚报 / 天天正能量 2026-09-14
material_paragraphs:
- 9月12日，在四川师范大学地理与资源科学学院开学典礼上，身患罕见病的19岁安徽“轮椅少年”汪洋作为新生代表发言。面对台下师生与含泪聆听的母亲，他动情地说：“以前总觉得上大学很遥远，如今坐在这里，才觉得以前那些难熬的日子，都值了！”汪洋10岁确诊进行性肌营养不良症，初中起无法独立行走、脖子后仰无法平视，多年来趴在大号抱枕上服止痛药苦读，今年以534分考入川师大。今年7月他在北京完成两次矫正手术后已能平视前方，父母亦随他到成都租房陪护。汪洋在发言中坦言大学容错性很高，期待哪怕遇挫也能拍拍灰尘继续前行。天天正能量联合合新闻为他颁发特别奖与助学金。
