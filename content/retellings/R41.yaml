title: 轮椅少年大学报到真情发言：“那些咬牙难熬的日子，今天都值了！”
date_label: 9月中旬 · 安徽合肥
source_label: 合肥晚报 / 天天正能量 2026-09-14
material_paragraphs:
- 在安徽大学2026级新生开学典礼上，身患重度进行性脊柱肌萎缩症的合肥少年程东，坐在特制轮椅上作为新生代表发言。面对台下上千名师生与默默守护在身旁的母亲，他眼含热泪动情地说：“那些咬牙坚持、无数次想要放弃却挺过来的难熬日子，今天都值了！”程东自幼四肢无力无法站立，求学十几年间母亲每天背他爬楼梯上课，他在特制斜板上苦读，以优异成绩考入计算机系。学校特意为他和母亲改造了无障碍爱心宿舍，天天正能量也颁发奖金鼓励。程东立志攻读无障碍软件，用科技帮助更多身处黑暗中的人。
