ref_retelling: 9 月 3 日清晨，萧山技师学院 17 岁女生周子歆在上学途中，见一位老奶奶跌倒在人行道上，后脑磕破出血。四周没有其他人，她立即上前扶起老人，并在拨打 120 遵从指导后，毫不犹豫脱下自己刚换的干净长袖校服外套，折叠后紧垫在老人伤口处止血，一直守护到救护车抵达。路过的市民朱女士见她赶着去上课且外套满是血迹，主动带走衣服洗净烘干，专程送到学校归还。女孩救人的果断善良与市民体谅的温情接力，汇聚成了最真挚的街头暖流。
