ref_retelling: 9 月 3 日清晨，萧山技师学院 17 岁女生周子歆在上学途中，见一位老奶奶跌倒在人行道上后脑磕破出血。四周没有其他人，她立即上前扶起老人，并遵从 120 指导脱下自己刚换的干净长袖校服折叠垫住伤口压迫止血。路过的热心市民朱女士见状主动上前协助按压，并接过手机协助联系老人家属。约 5 分钟后急救车将老人接走，周子歆急着赶去上课将染血外套遗留在现场，朱女士主动把校服带回家洗净烘干，专程送还学校。年轻人的果断施救与市民的体贴相助，汇聚成了街头最真挚的暖流。
