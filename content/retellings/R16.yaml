category: 暖文
title: 萧山17岁技校生周子歆脱校服为摔倒老人止血，路人主动帮洗校服
date_label: 事发 2026 年 9 月 3 日 · 浙江杭州萧山
source_label: 来源：潮新闻·钱江晚报 / 萧山融媒（ttzl-45353）
material_paragraphs:
- 9 月 3 日清晨 7 点左右，杭州萧山区育才路学士桥附近，一位白发老奶奶过马路时不慎仰面摔倒，后脑勺磕破地面血流不止。就在路人短暂迟疑的瞬间，17 岁的萧山技师学院高三学生周子歆骑车路过，毫不犹豫快步上前扶起老人。
- 由于现场找不到毛巾，在拨打 120 按照接线员指导止血时，周子歆果断脱下自己当天刚换的干净长袖校服外套，折叠后垫在老人伤口处紧紧压迫止血，一直守护到急救车抵达。见学生赶着上课且校服染上大片血迹，路过的热心市民朱女士主动拿走沾血校服，仔细手洗烘干后送到学校归还，全网赞誉这场同龄青年救人与市民托底的爱心闭环。
