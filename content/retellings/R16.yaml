ref_retelling: 9 月 3 日清晨，萧山 17 岁技校学生周子歆在上学途中，见一位白发老奶奶摔倒后脑出血。情急之下，他毫不犹豫脱下自己干净的校服外套，叠好垫在老人脑后止血，并守护至急救人员赶来。路过的热心市民朱女士深被感动，主动带走染血的校服，洗得干干净净送到学校归还。少年救人的果敢与路人洗衣的接力，构成了最动人的人间温暖。
