category: 暖文
title: 萧山17岁女职校生周子歆脱校服为摔倒老人止血，路人主动帮洗校服送还
date_label: 事发 2026 年 9 月 3 日 · 浙江杭州萧山
source_label: 来源：人民日报（2026-09-10）/ 潮新闻·钱江晚报 / 萧山融媒（ttzl-45353）
material_paragraphs:
- 9 月 3 日清晨 7 点左右，杭州萧山区育才路学士桥附近，一位白发老奶奶过马路时不慎仰面摔倒，后脑勺磕破地面、鲜血直流。当时周边恰好没有其他行人，17 岁的萧山技师学院中德智能制造学院班长周子歆骑车路过，见状立即停下车，快步跑上前将老人扶起查看伤情。
- 由于清晨现场找不到毛巾与纱布，在拨打 120 按照急救人员指导止血时，周子歆果断脱下自己当天刚换的干净长袖校服外套，折叠后紧紧垫在老人后脑伤口处压迫止血。路过的热心市民朱女士见状主动上前协助按压止血，并接过手机协助联系老人家属。约 5 分钟后救护车赶到接走老人，周子歆急着赶回学校上课将染血外套遗留在现场，朱女士主动将衣服带回家手洗烘干，并于次日专程送到学校归还。
