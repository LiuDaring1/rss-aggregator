ref_retelling: 西南政法大学开学典礼上，校长林维深情致敬了在防汛一线牺牲的25岁基层网格员校友龚宝冬。龚宝冬毕业后回到老家做网格员，在突发山体崩塌时冒雨转移群众不幸牺牲。面对网络上关于网格员算不算高校精英的疑问，校长斩钉截铁地回答：是的！在他心中，身边的居民就是天下。这声回答打破了唯名利的狭隘偏见，让人们看到真正的杰出不仅在于庙堂之高，更在于脚踏实地守护一方平安的质朴担当。
