title: 基层网格员获评母校“杰出校友”：破除名利标签的朴素荣光
date_label: 9月中旬 · 重庆
source_label: 澎湃新闻 / 西南政法大学 2026-09-13
material_paragraphs:
- 在西南政法大学2026级新生开学典礼上，校长林维深情致敬了该校2023届本科毕业生龚宝冬。龚宝冬毕业后主动放弃大城市优渥机会，回到家乡重庆彭水县汉葭街道担任一名普通的基层网格员，常年奔走在街巷排查隐患、调解纠纷、服务群众。今年7月，彭水县遭遇极端暴雨引发山体崩塌，龚宝冬在冒雨转移群众途中英勇牺牲，年仅25岁。面对网上部分人关于“县城网格员算不算西政精英”的疑问，林校长在开学典礼上坚定回应：“是的！在龚宝冬心中，身边的居民就是天下！”全场师生起立鼓掌，盛赞平凡坚守中的家国担当。
keywords:
