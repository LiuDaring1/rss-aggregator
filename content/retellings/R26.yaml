ref_retelling: 济南仲宫钱家村退伍军人贺磊，目睹村中留守老人做饭难与独居风险，于2025年10月创办“舍力行”爱心小院，为80余位高龄老人免费提供一日三餐。小院依靠村民自种蔬菜与爱心捐助朴素运转，不仅让老人集中就餐互诉家常，贺磊更坚持为46位80岁以上行动不便的老人送餐上门，借机排查居家安全。面对不解，他以“对得起良心”默默坚守，村委会亦主动承担水电费并扩建活动场地。贺磊用一碗碗热饭填补了乡村养老缝隙，展现了退伍军人扎根泥土、守护桑榆晚景的真挚情怀。
