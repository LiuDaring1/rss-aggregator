title: 济南退伍军人贺磊回村建“爱心小院”：守着80余位乡村老人的一日三餐
date_label: 创办小院 2025 年 10 月 · 报道表彰 2026 年 9 月 10 日 · 山东济南仲宫
source_label: '来源：闪电新闻·山东广电 2026-09-10 / 天天正能量 2026-09-10（来源ID: ttzl-45355）'
material_paragraphs:
- 济南市南部山区仲宫街道钱家村常住500多人，其中一半以上都是60岁以上的老人，不少高龄独居老人吃饭很不规律，“做一顿热饭吃几天、吃口热乎饭困难”。2013年退伍回村的军人贺磊，在照顾患病爷爷离世后，深刻体味到农村孤寡老人的晚年不易，尤其是村里一位独居老人摔倒多日险些丧命的险情，触动了他规避空巢风险的决心。2025年10月，贺磊和7位朋友凑齐启动资金，在村里创办了名为“舍力行”的爱心小院，为全村及周边80余位70岁以上老人、残疾人常态化提供免费营养餐食。
- 小院的运营主要依靠村民自发捐赠自家种的蔬菜以及爱心人士捐献的米面油，贺磊自己种地贴补，父亲起初嫌丢人不支持，贺磊坚持“只要对得起良心就行”。在服务方式上，75岁至80岁老人结伴来小院集中就餐，而对于80岁以上高龄及行动不便的46位老人，贺磊与志愿者每天骑车送餐上门，风雨无阻，借送餐契机排查老人安危。贺磊每餐吃剩菜拌饭，习惯用热水涮碗喝掉“惜福水”。村委会主动承担了小院的水电费用并扩建了老年运动中心，小院不仅填补了乡村助老的缝隙，更成为留守老人们温暖的精神港湾。
