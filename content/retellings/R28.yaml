title: 萧山学生脱下校服止血：清晨街头的热忱与守护
date_label: 9月3日 · 浙江杭州
source_label: 潮新闻 / 天天正能量 2026-09-03
material_paragraphs:
- 9月3日清晨，在浙江杭州萧山区学士桥附近，一位白发老奶奶突然仰面摔倒在路面，后脑着地流血不止。路人尚在迟疑之际，17岁的萧山技师学院学生周子歆毫不犹豫快步跑上前去。看到老人头部伤情严重，她双手将老人抱起靠在自己身上，随即脱下早上刚换上的干净长袖白校服，叠好垫在老人脑后压迫止血，并迅速拨打120急救电话全程守护。路过买早餐的朱女士见状主动协助联系老人家属；待救护车接走老人后，朱女士见女生校服沾满血迹无法穿着，主动将衣服带回家洗净并联系学校表扬。而赶回学校迟到的周子歆，面对老师询问却未主动声张自己的救人义举。
keywords:
