ref_retelling: 9月3日早上，在杭州萧山街头，一位白发老奶奶突然意外摔倒，后脑着地血流不止。赶着去上课的17岁技校女生周子歆见状，立刻跑上前将老人扶起靠在自己怀里。为了尽快止血，她毫不犹豫脱下身上刚换的白校服外套，叠好垫在老人脑后按压，并拨打120守护至急救车赶到。路过的一位阿姨主动协助联系家属，并在事后把染血的校服带回家清洗干净，还专门联系学校表扬她。这名中专女生回校后虽然迟到了，却对救人的事只字不提，展现了纯粹可贵的善良本色。
