schema_version: '1.0'
id: C11
retelling_ref: R16
title: 脱下校服与洗净送还：让善良在体谅与接力中流动
learning:
  recap_facts:
  - 17岁职校女生周子歆清晨见老人摔倒后脑流血，四周无人，立即上前扶起并按120指导脱下刚换的长袖校服压迫止血；
  - 路过市民朱女士见状主动上前协助按压止血并联络家属，急救车接走老人后，朱女士见周子歆急着上课将染血外套留在现场，主动带回家手洗烘干并专程送还学校；
  - 周子歆表示“衣服脏了没关系，如果出事了没去帮心里难受”。
  questions:
  - 面对受伤的老人，一个年轻学生脱下自己刚换的干净外套去压迫止血，她当时可能在想什么？
  - 朱女士不仅上前协助按压止血，还主动把染血的衣服带回家洗净送还学校，这展现了怎样的体谅与担当？
  - 从“脱下校服”到“洗净送还”，这两位普通人之间的自然协作，对我们理解身边的相互关照有什么启发？
  baseline_diagnostic: 很多同学在谈这件事时，只停留在赞美中学生救人不怕脏，容易忽略现场协同救助以及事后主动分担麻烦的暖意接力。
  viewpoints:
  - id: v1
    claim: 顾不上刚换的干净衣物果断压迫止血，体现了生命至上的纯粹同理心。
    evidence: 周子歆在缺少急救包扎工具时，脱下校服折叠垫在老人脑后，直言“衣服脏了没关系，没去帮心里难受”。
    explanation: 在危急关头把救人摆在爱惜衣物之前，展现了年轻人朴素赤诚的关切本能。
  - id: v2
    claim: 市民上前协助按压并洗净送还校服，是对挺身而出者最及时的体谅与分担。
    evidence: 朱女士主动上前协助按压止血、联络家属，见周子歆着急赶去上课将染血校服留在现场，主动带回家手洗烘干并送回学校。
    explanation: 见义勇为需要挺身而出的勇气，而身边人主动上前搭手并化解后续麻烦，让善意得到了及时的抚慰与回馈。
  - id: v3
    claim: 普通人之间的温情流动，往往就体现在这种“你迈出一步、我帮你分担”的默契之中。
    evidence: 一人率先上前救护，一人协助止血善后，素不相识的两人在街头完成了善意的自然接棒。
    explanation: 美好的社会氛围不是抽象的概念，而是由这样彼此体贴、不让好人独自面对困窘的日常细节支撑起来的。
  reasoning_lessons:
  - title: 怎么想到的：为什么要把“脱校服”和“洗衣服”放在一起看
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: '看到这则新闻，如果只说“女孩很勇敢、不怕脏”，内容就会显得单薄。这则材料之所以被广泛传播，最动人的地方在于它不仅记录了突发关头的勇敢施救，更展现了陌生人之间温暖而细致的协作接力。


      先看女孩脱校服：上学路上衣服沾了血，不仅意味着身上冷、可能迟到，还要面对衣物难以清洗的麻烦。但在危急关头，她说“没去帮心里难受”。这种生命至上的同理心是本能而赤诚的。


      再看市民朱女士：她不仅在急救人员赶到前主动上前协助按压止血、联络家属，更在女孩赶回学校上课后，默默把染血的校服带回家清洗烘干、送还学校。这一按、一洗、一送，不仅替救人女孩化解了现实麻烦，更向所有人传递出一种温度：当你选择善良时，身边会有人理解你、体谅你，并愿意用自己的双手帮你分担。把现场施救与事后关照串联起来，整个表达就有了层次。'
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 17岁职校女生脱下校服为摔倒老人止血，热心市民上前协助并洗净送还。女孩救人的纯粹让人感动，而市民贴心的分担同样温暖。这种彼此照应与温情接棒，构成了街头最动人的善意回响。
  body:
  - id: b1
    claim: 首先，顾不上刚换的干净外套果断施救，展现了生命至上的纯粹同理心。
    paragraphs:
    - 面对满头鲜血的跌倒老人，在缺少纱布的紧急关头，周子歆没有心疼刚换上的长袖外套，果断脱下来压迫止血，一直守护到救护车赶来。正如她事后所说，衣服脏了没关系，出事没去帮心里才难受。在突发危险面前把别人的安危摆在个人得失之前，这份发自本能的善良，展现了年轻人最纯粹的担当。
  - id: b2
    claim: 其次，市民上前协助并洗净送还校服，是对挺身而出者最温暖的体谅与分担。
    paragraphs:
    - 救助现场，路过的朱女士不仅主动上前协助按压止血、联络家属，更在老人送医、周子歆赶去上课后，主动把留在现场的染血校服带回家洗净烘干，专程送还学校。见义勇为需要有人伸手，但善后也往往伴随弄脏衣服等现实尴尬。朱女士不仅在关键时刻搭了把手，更用细致的方式替救人女孩化解了后续麻烦。当身边的普通人能够主动分担这份善后的琐碎时，行善者就不会感到孤单。
  closing: 一个人的勇敢伸手让生命转危为安，另一个人的体贴善后让爱心免于尴尬。多一些这样彼此照应的默契，身边就会多一份踏实而恒久的暖意。
teaching:
  spine: 开头（并列两件事：脱下校服与协作送还）→ 主体一（立足救人瞬间，讲清青年纯粹的同理心）→ 主体二（立足市民协助与善后，论述彼此体谅与分担的社会价值）→ 结尾（总结街头默契对善意氛围的守护）。
  deconstruction:
  - target: 开头对照引入
    instruction: 紧扣“脱下校服”与“洗净送还”两个具体动作，直接切入核心话题。
  - target: 主体一抓取原话
    instruction: 借用“衣服脏了没关系”的质朴表达，展开对同理心和本能善良的推演。
  - target: 主体二分析协作与洗衣细节
    instruction: 讲透朱女士“上前搭手协助并化解现实麻烦”的分担意义，让论证更有生活烟火气。
  editor_notes: 依据《人民日报》2026-09-10 13版及潮新闻报道，全面核实当事人身份与协作细节，语言温和自然，符合口语演说规范。
