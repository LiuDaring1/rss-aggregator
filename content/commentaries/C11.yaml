schema_version: '1.0'
id: C11
retelling_ref: R16
title: 脱下校服与洗净衣服：善意生态需要彼此托底
learning:
  recap_facts:
  - 17岁技校生周子歆上学路上遇老人摔倒后脑出血，果断脱下刚换的干净校服压迫止血并守护送医；
  - 现场路人朱女士被感动，主动将带血校服带走洗净送还学校；
  - 周子歆表示“衣服脏了没关系，如果出事人没帮心里难受”。
  questions:
  - 一个17岁的中学生在路人迟疑的瞬间脱下校服救人，这份果断来自于什么？
  - 路人主动帮忙洗净带血的校服，为什么这个小小的举动会让全网感到格外温暖？
  - 从“脱下校服”到“洗净衣服”，这起普通事件对我们理解良善的社会环境有何启示？
  baseline_diagnostic: 很多学生只看到学生救人很勇敢，没有讲清“路人洗校服”在整个善意闭环中的核心价值。
  viewpoints:
  - id: v1
    claim: 不顾惜刚换的干净衣物脱服止血，体现了生命至上的纯粹同理心。
    evidence: 周子歆直言“衣服脏了没关系，如果出事人没帮心里难受”，毫不犹豫压迫止血。
    explanation: 在关键的一瞬间，把救护他人置于个人利益得失之上，展现了年轻人朴素赤诚的善意本能。
  - id: v2
    claim: 路人主动洗净送还校服，是对挺身而出者最贴心的托底与善待。
    evidence: 市民朱女士主动带走染血的衣服，仔细清洗烘干后专程送到学校归还。
    explanation: 见义勇为需要有人上前，而围观者能用自己的方式主动分担后果，消除了好人的后顾之忧。
  - id: v3
    claim: 良善的社会风气不仅在于有人勇敢迈出第一步，更在于身边人能否完成第二步接力。
    evidence: 一人现场急救止血，一人协助联系送医洗衣服，善举在普通人之间自然接棒。
    explanation: 不让行善者独自承担弄脏衣物或被误解的代价，周围人的温暖回馈才能守护更多人心中的善念。
  - id: v4
    claim: 以平凡的善意回应非凡的勇气，构成了平凡人之间最坚固的情感纽带。
    evidence: 事件在网络传播后，大家感动的不只是救人本身，更是路人与学生之间那份无言的体谅。
    explanation: 彼此支撑、相互成全，让社会的温度体现在街头巷尾每一个细微的举动中。
  reasoning_lessons:
  - title: 怎么想到的：为什么“洗衣服”和“救人”同样重要
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: '看到萧山技校学生脱校服救老人的故事，很多人第一反应是赞美少年的见义勇为。但如果只讲“学生多勇敢、不怕脏”，这篇表达就流于表面了。这则材料最动人的地方，恰恰是后半段那个看似不起眼的细节：路人主动帮他把染血的校服洗干净送还。


      先看少年脱校服：上学路上衣服染了血，意味着他要面临上课迟到、洗不掉污渍、甚至被家里人追问的麻烦。但在危急关头，他说“如果出事人没帮心里难受”。这种同理心是纯粹的、本能的。


      再看路人洗校服：这位阿姨没有直接参与心肺复苏，但她看到了少年的困境，默默把这份麻烦接了过来。这一洗一送，不仅让少年穿着干净的衣服回家，更向所有人传递了一个信号：只要你敢挺身而出，身边就有人愿意替你收拾残局、为你托底。把救人的第一步和托底的第二步结合起来，我们看到的就不再是一个孤独的英雄，而是一个相互善待的温暖社会。'
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 17岁技校生脱下校服为摔倒老人止血，热心路人主动洗净送还。少年救人的果决让人动容，而路人洗衣服的接力同样温暖。美好的善意生态，正是由敢于伸手的第一步与彼此托底的第二步共同筑成的。
  body:
  - id: b1
    claim: 首先，毫不迟疑脱下刚换的校服救人，体现了生命至上的纯粹同情心。
    paragraphs:
    - 面对满头是血的老人，在缺少急救包扎工具的情急之下，周子歆没有在乎刚换上的干净外套，而是果断用自己的衣服紧紧压住伤口。正如他朴素的心声所言，衣服脏了没关系，只要老人能平安。这种在危急时刻不计个人琐碎得失的善良本能，展现了当代青年最可贵的赤子情怀。
  - id: b2
    claim: 其次，路人主动洗净送还校服，是对见义勇为者最体贴的托底与回馈。
    paragraphs:
    - 路过的市民朱女士没有当冷漠的看客，她默默带走染血的校服，洗净烘干送回学校，替救人少年解决了后顾之忧。好人不该既流血又费心，当有人勇敢迈出第一步时，身边人能主动用细致的善意接力托底，善意就不会变成沉重的负担，更多人也会在需要时敢于挺身而出。
  closing: 一人勇敢伸手，众人温暖相随。多一些这样彼此支撑的细微接力，社会的善意生态就会更加踏实宽广。
teaching:
  spine: 开头（并列两件事：脱下校服与洗净衣服）→ 主体一（讲清青年纯粹的同理心）→ 主体二（论述路人托底对守护善意生态的意义）→ 结尾（收束到全社会互助共赢）。
  deconstruction:
  - target: 开头对照引入
    instruction: 用“少年的第一步”与“路人的第二步”精准破题，突出互助闭环的主线。
  - target: 主体一紧扣细节
    instruction: 抓住“衣服脏了没关系”的当事人原话，刻画不计较小利得失的少年情怀。
  - target: 主体二阐述托底机制
    instruction: 深刻剖析“帮好人洗衣服”所蕴含的社会意义：消除行善成本，鼓励更多善意。
  editor_notes: 参考潮新闻·钱江晚报 2026-09-11 报道，注重发掘身边同龄人的动人力量，语言温和有画面感。
