schema_version: '1.0'
id: C08
retelling_ref: R10
title: 点赞“敢扶”，也要让更多人不“怕扶”
learning:
  recap_facts:
  - 昆明22岁外卖骑手蒋明昊送餐时见老人面部摔伤流血，克服被讹顾虑取消订单救人送医；
  - 在医院面对护士询问，老人主动摆手澄清“是他好心，是我自己摔的”；
  - 老人脱险后家属送锦旗，平台撤销超时处罚并给骑手评优奖励。
  questions:
  - 骑手蒋明昊救人前闪过“会不会被讹”的真实顾虑，这个细节为什么格外打动人？
  - 老人到医院面对询问毫不犹豫主动澄清，对社会的善意互信起到了怎样的作用？
  - 从个人的善良出手到平台的免罚激励，怎样才能让更多人在遇到险情时敢于上前？
  baseline_diagnostic: 学生常容易一味高赞“舍己为人”，忽略了人在现实顾虑中做出勇敢抉择的真实分量。
  viewpoints:
  - id: v1
    claim: 在真实的顾虑中依然选择伸手救助，展现了难能可贵的良心底色。
    evidence: 蒋明昊坦言送餐高峰期曾担心被讹和订单超时，但依然取消订单送老人去医院。
    explanation: 承认顾虑并不是怯懦，正视真实的社会心理反而让战胜顾虑的善举更加真实可敬。
  - id: v2
    claim: 被帮助者当场的坦荡澄清，是对施救者最大的善待与保护。
    evidence: 老人在急诊室明确表示“是他好心，我自己摔的”，消除了所有可能纠缠的疑虑。
    explanation: 及时讲清事实，没有让救人者承担不白之冤，促成了善意之间最珍贵的双向奔赴。
  - id: v3
    claim: 平台的制度免罚与正向嘉奖，为平民善行提供了实实在在的安全感。
    evidence: 外卖平台核实后撤销了超时违规处罚，并为骑手颁发荣誉与奖励。
    explanation: 好人不能既流汗又流泪，规则制度在关键时刻主动兜底，才能打消公众“做好事吃亏”的顾虑。
  - id: v4
    claim: 构建敢于伸手的互助社会，需要个体良知、当事人坦诚与制度保障同频共振。
    evidence: 从骑手救人、老人澄清到家属送锦旗、平台奖励，每一个环节都在传递正向力量。
    explanation: 社会互信的重建不是靠口号，而是靠一个又一个好人得到好报的真实案例积累起来的。
  reasoning_lessons:
  - title: 怎么想到的：为什么必须把“顾虑”和“澄清”放在一起看
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: '评价外卖小哥救人的举动，很多人只会泛泛称赞他“见义勇为、道德高尚”。但深入材料会发现两个最具力量的细节：第一个是小哥承认自己当时第一反应是“会不会讹我”，第二个是老人到了医院主动说“是他好心，是我自己摔的”。怎样把这两个细节串成深刻的表达？


      先看小哥的顾虑：他不是不害怕，但“如果不去帮心里又难受，良心也难受”。正是这种普通人的顾虑与挣扎，证明他不是虚构的超级英雄，而是战胜了现实恐惧的真实青年。这份真实，比空洞的勇敢更有说服力。


      再看老人的反应：面对医生的例行询问，老人没有含糊其辞，而是斩钉截铁讲清事实。这一句话，把小哥救人时心头所有的顾虑瞬间化解了。看清了这两个细节的前后对照，就能明白：一个让人敢于伸手的社会，不仅需要有人跨出勇敢的第一步，更需要被帮助者坦荡回馈、规则制度坚决兜底。'
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 外卖骑手救助摔倒老人，老人当场向医生澄清“是他好心”。这一场善意的双向奔赴告诉我们：点赞敢于伸手的勇气，更要用坦诚的回应与有力的制度，让更多人放下顾虑、不再怕扶。
  body:
  - id: b1
    claim: 首先，克服现实顾虑依然选择伸手救人，展现了难能可贵的良心底色。
    paragraphs:
    - 面对摔倒受伤的老人，年轻骑手内心闪过被讹的担忧，更背负着订单超时的压力。但他没有转身离开，而是遵从良心选择救人送医。承认顾虑并不是胆怯，克服了真实的担忧依然伸手，这样的勇敢才格外真切，值得我们由衷敬佩。
  - id: b2
    claim: 其次，被救助者的当场澄清与平台的免罚托底，形成了守护善意的良性互动。
    paragraphs:
    - 老人一到医院就主动澄清“是他好心”，不让恩人受委屈；平台也及时撤销了超时处罚，给善举撑腰。这份及时的澄清化解了当下的尴尬，而制度的保障则分担了现实的成本。当善意得到了应有的体谅与回馈，下一次面对险情时，人们心里才能更有底气。
  closing: 多一份坦诚的说明，多一些制度的护航，人与人之间的互信就会更加坚实，温暖的善意也会自然传递开来。
teaching:
  spine: 开头（立意：点赞敢扶更要让人不怕扶）→ 主体一（讲透克服顾虑的良心底色）→ 主体二（讲清老人澄清与平台兜底的良性生态）→ 结尾（收束到社会互信与机制守护）。
  deconstruction:
  - target: 开头双向引入
    instruction: 将“外卖骑手救人”与“老人当场澄清”并置，明确引出“敢扶与不怕扶”的核心主线。
  - target: 主体一关注真实心理
    instruction: 抓住骑手原话中的顾虑，说明直面现实担忧的善举更具人性光辉。
  - target: 主体二论述生态闭环
    instruction: 把老人说话和平台撤罚结合，论证“好人有好报”不仅是道德期盼，更需制度落实。
  editor_notes: 参考澎湃新闻 2026-09-11《马上评｜点赞“敢扶”，也要让更多人不“怕扶”》，契合艺考生关注社会焦点与真实人性的表达风格。
