schema_version: '1.0'
id: C17
retelling_ref: R24
title: 归来亦是向阳行：从大山少年的坚韧奋斗看青春担当
learning:
  recap_facts:
  - 云南边境村寨少年岩新在高考前夕遭遇父亲与奶奶相继离世的重大变故，依然顽强求学，以班级第一名成绩考入四川师范大学英语专业；
  - 暑假期间他穿着沾满泥巴的旧校服在田间种咖啡劳作攒学费，在艰苦环境中自学瘦金体书法，并在毕业前用毛笔为自己的任课老师们手写祝福卡；
  - 首次走出县城的岩新所有高考志愿均填报师范类专业，面对未来坚定表达“离开大山是为了回到大山”，立志毕业后回边境家乡教书育人。
  questions:
  - 在高考前接连遭遇至亲离世的沉重打击下，岩新为什么能把生活的磨砺转化为向阳而生的动力？
  - 许多青年通过苦读走出大山改变家庭命运，岩新选择立志毕业后回乡当老师，这体现了怎样的个人追求？
  - 从岩新自学书法手写谢师卡到决心从教，师长关爱与感恩之心对青年的成长选择产生了怎样的深层影响？
  baseline_diagnostic: 初读这则新闻，容易停留在对少年身处困境的同情，或是把视线单纯落在“逆境考高分”的励志表层。展开口语评述时，需要把思考进一步延伸到他人生选择背后的精神内核：不仅要看到他面对失去至亲的重创时自立自强的韧性，更要看到他毕业前手写谢师卡、全填师范志愿立志回乡从教所展现的感恩情怀与反哺担当。
  viewpoints:
  - id: v1
    claim: 通过读书奋斗改变个人与家庭命运，是正当且值得尊重的奋斗追求。
    evidence: 岩新在极其艰苦的环境中刻苦攻读，以第一名考上师范大学，靠知识打开广阔天地。
    explanation: 每一份走出大山、改善生活的努力都具有平等的尊严，奋斗的价值首先在于让个体具备自立自强的能力。
  - id: v2
    claim: 在自立的基础上自主选择回乡从教，展现了心怀感恩、反哺乡土的真挚情怀。
    evidence: 岩新所有高考志愿均填报师范专业，立志学成后回到边境村寨担任教师托举后辈。
    explanation: 这一选择源于对故土的深厚眷恋与对教育的认同，让知识的获取超越了个体自立，多了一份照亮他人的温度。
  - id: v3
    claim: 真正支撑青年战胜家庭重创的，不仅是不屈的韧性，更是心怀感念的心灵自觉。
    evidence: 面对考前至亲离世与清贫家境，岩新田间劳作攒学费，毕业写谢师卡致谢恩师。
    explanation: 师长的关爱为逆境中的少年注入了向阳生长的光亮，感恩的心态让磨砺转化为从教助人的内生动力。
  - id: v4
    claim: 将个人的奋斗初心与故土基层的急需相联结，赋予了青春成长更加沉稳厚重的意义。
    evidence: 第一次走出边境县城的岩新，求学初心始终与家乡教育事业紧密相连。
    explanation: 当青年的理想与乡土现实相互关照，人生的每一步前行都会具备更为笃定的精神定力。
  - id: v5
    claim: 艰苦环境中依然葆有对精神美好的追求，展现了青年人不被物质困顿所定义的内心丰盈。
    evidence: 在简陋木板房中，岩新从未上补习班，依靠自学练就一手苍劲工整的瘦金体书法。
    explanation: 物质的匮乏无法阻挡对知识与美的向往，精神的自重与充盈赋予人在风雨中不卑不亢的自强底色。
  reasoning_lessons:
  - title: 怎么想到的：分层理解青年逆境自立与感恩反哺的内在逻辑
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: '评述这则新闻，思考的关键在于分层理解少年逆境奋斗与立志从教的内在逻辑。

      一方面，面对高考前夕至亲相继离世与清贫家境，岩新没有消沉自怜，而是刻苦求学并考取第一名，暑期劳作自立筹措学费，展现出面对人生风雨不屈不挠的坚韧风骨。

      另一方面，他在毕业时手写谢师卡致谢师恩，在志愿填报时全填师范专业，这一选择源于求学路上师长关爱给予他的温暖力量，让他渴望在学成之后回到边寨，像昔日老师帮助自己那样去托举更多大山深处的孩子。理顺自强与感恩这两层脉络，评述便能真诚展现当代青年向上奋斗与向善利他的精神成色。'
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 云南边境少年岩新考前痛失至亲，暑期劳作攒学费，以第一名考入川师大并立志毕业回乡任教。求学为青年打开了广阔天地，而岩新选择回到家乡，展现了青年在逆境中坚韧自立、在成长中心怀感恩的真诚追求。
  body:
  - id: b1
    claim: 一方面，求学赋予青年改变命运的本领，而回乡任教是用所学反哺故土的自主选择。
    paragraphs:
    - 通过读书奋斗改善个人与家庭生活，本就是正当且可敬的追求。岩新在此之外全填师范志愿，立志学成后回到家乡当老师。这种选择不是被动绑定的义务，而是源于对乡土的真挚情感，让汲取知识的努力多了一份反哺家乡、照亮后辈的温度。
  - id: b2
    claim: 另一方面，真正支撑青年走过风雨的，不仅是不屈的韧性，更是心怀感念的精神自觉。
    paragraphs:
    - 面对至亲离世与清贫家境，岩新没有消沉自怜，而是自力更生补贴学费、勤勉自强刻苦攻读。求学路上师长给予的温暖关怀，让他将生活的磨砺转化为向善的动力，渴望像昔日老师帮助自己一样，去托举更多大山深处的孩子。
  closing: 青年面对挫折自立自强，面对善意心怀感念，脚踏实地走好人生的每一步，展现出当代青年昂扬而温暖的担当。
teaching:
  spine: 开头（提炼立意：自立奋斗与感恩担当相得益彰）→ 主体一（肯定改变家庭命运的正当性，阐述自主回乡从教的反哺情怀）→ 主体二（直面家庭重创，剖析师长关爱与感恩之心对志向的塑造）→ 结尾（升华到自立自强与心怀感念的人生境界）。
  deconstruction:
  - target: 开头立意提炼
    instruction: 肯定自强求学与回乡志向，确立逆境坚韧与心怀感恩的评述主线。
  - target: 主体一论证展开
    instruction: 阐明改变命运的努力值得尊重，分析回乡从教是源于乡土情怀的自主选择。
  - target: 主体二论证展开
    instruction: 结合手写谢师卡与面对重创自强的细节，剖析师恩关爱如何转化为从教动力。
  - target: 结尾价值收束
    instruction: 收束到自立自强、心怀感念的人生厚度，语调真挚而庄重。
