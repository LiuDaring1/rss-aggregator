schema_version: "1.0"
id: C05
retelling_ref: R07
packet_ref: pkt-legacy-r07
title: 海中救人：心愿让人下水，调整让人上岸
learning:
  recap_facts:
    - 广东惠东海域，一家三口被困在离岸一百多米的海中呼救；
    - 14 岁初中生王植兴带着双人救生圈游过去交给三人，拖拽二十多米后体力耗尽；
    - 他冷静决定：让三人抱紧救生圈在原地等待，自己松开手游回岸上向专业救援人员求援；
    - 救援队摩托艇往返三次将三人全部救回；8 月 20 日他被评定为见义勇为。
  questions:
    - 面对百米外的呼救，王植兴为什么带上双人救生圈才下水？这个动作说明了什么？
    - 拖拽二十多米体力耗尽时，如果他选择继续硬拖，可能会面临什么危险？
    - 让被困者原地抱圈等待、自己回岸求援，为什么在当时是最理智的抉择？
    - 他平时胆子并不大，却在危急时刻做到了“见义智为”，这给青少年安全互救带来了什么启示？
  baseline_diagnostic: 初步感受：少年英雄，胆识过人。（如果只赞美勇敢，容易将未成年人下海救险浪漫化，必须讲透量力而行、善用专业力量的重要性。）
  viewpoints:
    - id: v1
      claim: 听到呼救带工具下水，这份把他人安危放在心上的救人之心是行动的起点。
      evidence: 14岁少年携带双人救生圈游向百米外的被困家庭，并将救生圈先交给对方。
      explanation: 善良与同情心促使他在危难时刻挺身而出，展现了年轻一代的责任担当。
    - id: v2
      claim: 力竭时不盲目硬撑、果断寻求专业力量，是避免更大悲剧发生的关键智慧。
      evidence: 拖拽二十多米后体力透支，他没有强行拖拽，而是迅速松手回岸向专业救援队求助。
      explanation: 救人不是逞强冒险，清醒认识自身体能极限并主动借助社会救援，是最高效的脱险路径。
    - id: v3
      claim: 先给被困者提供漂浮支点再脱手求援，体现了沉着应对险情的清醒思路。
      evidence: 将双人救生圈留给一家三口抱紧，确保了他们在等待专业救援时不会持续下沉。
      explanation: 每一项救助举措都紧扣现实生存条件，而非凭冲动行事。
    - id: v4
      claim: 对未成年人的见义勇为，应倡导“见义智为”，坚决反对脱离安全底线的盲目牺牲。
      evidence: 王植兴提到学校游泳课教过自救互救常识，知道遇险不能盲目冒险。
      explanation: 弘扬正气的同时必须守牢生命至上的底线，安全教育是培育健康善意的前提。
  reasoning_lessons:
    - title: 怎么想到的：在险境中看选择的分量
      target_viewpoint_ids:
        - v1
        - v2
        - v4
      deduction_text: 复盘这次海中救援，最惊心动魄的时刻不是他游向深水，而是拖拽二十多米后体力耗尽的瞬间。在那一刻，一个14岁的孩子面临着极艰难的选择：是咬牙继续拖，还是松手游回岸？如果凭着血气方刚硬撑，湍急的海浪和四个人的重量，极可能把所有人都推进万劫不复的深渊。他做出的决定是：把唯一的救生圈留给三个人作为求生支点，自己抽身游回岸上找专业搜救队。这个选择之所以可贵，是因为他战胜了盲目逞强的冲动，把生的希望交给了更可靠的专业摩托艇。评这则材料，绝不能把它讲成个人英雄主义的赞歌，而要讲清楚：只有敬畏生命、承认自身局限、懂得借助社会专业力量，善意才能真正换回平安。
speech:
  selected_viewpoint_ids:
    - v1
    - v2
  main_claim: 14岁少年王植兴海中救人的故事之所以让人敬佩，不仅在于他危难时敢于伸手，更在于他在体力透支的关头，做出了冷静清醒的选择。救人的热忱值得赞美，而量力而行、善用专业力量，才让善意真正平安落地。
  body:
    - id: b1
      claim: 首先，面对危急险情敢于挺身而出，展现了少年可贵的善良与担当。
      paragraphs:
        - 听到离岸百米外传来的呼救声，王植兴没有犹豫，带着自己的双人救生圈游向狂浪中的一家三口，并把救生圈先交到了对方手里。在他人生命受到威胁的紧急时刻，一个平时胆子并不大的初中生能毫不退缩地下海救人，这份把别人安危放在心上的质朴勇敢，是整场救援能够化险为夷的起点。
    - id: b2
      claim: 其次，在能力边界前懂得理智止步，是避免次生悲剧的最高智慧。
      paragraphs:
        - 拖拽二十多米后力气用尽，他没有盲目硬撑到底，而是果断让三人抱紧救生圈原地等待，自己松开手游回岸边寻求专业救援。他清醒地认识到了自己的体能极限，没有让救人变成四个人的险境。正是这份把专业的事交给专业人员的冷静，才换回了救援队摩托艇三次往返的全部脱险。
  closing: 救人需要热血，更需要清醒的头脑。懂得保护自己、善用社会专业力量，才能让每一次善良都不被辜负，让“见义智为”成为生命最坚实的盾牌。
teaching:
  spine: 开头（热忱让人伸手，理性让善意落地）→ 主体一（面对危急挺身而出是善意起点）→ 主体二（认清边界寻求专业救援是最高智慧）→ 结尾（见义智为守护生命）。
  deconstruction:
    - target: 【立意定调】
      instruction: 开头迅速避开对未成年人冒险的单向盲目赞扬，确立“热忱与理性并重”的理性价值基调。
    - target: 【主体推进逻辑】
      instruction: 主体一肯定救人心愿，主体二深刻剖析“放弃硬拖、回岸求援”的理性抉择，层次层层深入。
    - target: 【安全导向】
      instruction: 全篇严格遵循生命教育导向，不输出未成年人危险施救教程，强调借助专业力量的重要性。
  editor_notes: S2 阶段重构，观点池扩展为 4 条，纠正行动顺序分论点，字数严格控制在 378 汉字。
legacy_unreviewed: false
