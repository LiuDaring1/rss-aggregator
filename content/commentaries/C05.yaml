schema_version: '1.0'
id: C05
retelling_ref: R07
packet_ref: pkt-legacy-r07
title: 海中救人：心愿让人下水，调整让人上岸
learning:
  recap_facts:
  - 广东惠东海域，一家三口被困在离岸一百多米的海中呼救；
  - 14 岁初中生王植兴带着双人救生圈游过去交给三人，拖拽二十多米后体力耗尽；
  - 他做出冷静决定：让三人抱紧救生圈在原地等待，自己松开手游回岸上向专业救援人员求助；
  - 救援队摩托艇往返三次将三人全部救回；8 月 20 日他被评定为见义勇为。
  questions:
  - 面对百米外的呼救，王植兴为什么带上双人救生圈才下水？这个动作说明了什么？
  - 拖拽二十多米体力耗尽时，如果他选择继续强撑硬拖，可能会面临什么危险？
  - 让被困者原地抱圈等待、自己回岸求援，为什么在当时是一个关键且清醒的抉择？
  - 他平时胆子并不大，危急关头却能做到量力而行，这给青少年的安全互助带来了什么启发？
  baseline_diagnostic: 初步感受：少年英雄，胆识过人。（如果只赞美勇敢，容易将未成年人下海施救浪漫化甚至误导为冒险榜样，必须讲透敬畏生命、量力而行以及善用专业救援力量的重要性。）
  viewpoints:
  - id: v1
    claim: 听到呼救带工具下水，这份把他人安危放在心上的热忱是行动的起点。
    evidence: 14岁少年携带双人救生圈游向百米外的被困家庭，并将救生圈先交给对方。
    explanation: 危难时刻挺身而出的同理心与担当，展现了青少年可贵的善良品质。
  - id: v2
    claim: 力竭时不再盲目硬撑、果断寻求专业力量，是避免次生险情发生的关键抉择。
    evidence: 拖拽二十多米后体力不支，他没有强行硬拖，而是迅速松手回岸向专业搜救人员求援。
    explanation: 施救不是逞能弄险，清醒认识自身体能极限并主动对接专业力量，才能让救助回到安全轨道。
  - id: v3
    claim: 先给被困者留下漂浮工具再抽身求援，体现了临危不乱的自救互救意识。
    evidence: 将双人救生圈留给一家三口抱紧，为他们在原地等待专业救援提供了浮力支撑。
    explanation: 每一项具体的救助举措都紧扣现实条件，体现了在慌乱情境中难能可贵的沉着。
  - id: v4
    claim: 对未成年人的见义勇为，应大力倡导“见义智为”，坚守生命至上的安全底线。
    evidence: 王植兴提到学校游泳课教过自救互救常识，知道盲目硬拼的危险。
    explanation: 肯定救人热忱的同时，必须引导青少年把自身安全放在第一位，不盲目提倡超越能力的牺牲。
  reasoning_lessons:
  - title: 怎么想到的：在险境中看选择的分量
    target_viewpoint_ids:
    - v1
    - v2
    - v4
    deduction_text: 复盘这次海中救援，最值得思考的时刻不是他游向深水，而是拖拽二十多米后体力耗尽的瞬间。在那一刻，一个14岁的少年面临着艰难的选择：是咬牙继续硬拖，还是松手游回岸？如果凭着血气硬撑，一旦自身体力彻底透支，不仅救不了人，自己也会深陷险境。他做出的决定是：把救生圈留给三个人作为浮力支撑，自己抽身游回岸上向专业救援人员求援。这个选择之所以难能可贵，在于他没有把救人当成逞强弄险，而是清醒正视自身极限，把最终脱险的希望交给了更具保障的专业力量。评这则材料，绝不能把它简单讲成盲目冒险的壮举，而要讲清楚：敬畏生命、量力而行，善意才能平安落地。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 14岁少年王植兴海中救人的故事之所以让人敬佩，不仅在于他危急时敢于伸手，更在于他在体力透支的关头做出了清醒抉择。挺身而出的热忱值得赞美，而量力而行、善用专业力量，才让这份善意真正平安落地。
  body:
  - id: b1
    claim: 首先，面对危急险情敢于挺身而出，展现了少年可贵的担当。
    paragraphs:
    - 听到离岸百米外传来的呼救声，王植兴带着双人救生圈游向被困的一家三口，并把救生圈先交到了对方手里。在他人生命受到威胁的紧急时刻，一个平时胆子并不大的初中生能毫不退缩地下水救人，这份把别人安危放在心上的质朴热忱，是整场救援能够化险为夷的起点。
  - id: b2
    claim: 其次，在能力边界前懂得理智止步，是避免陷入更大险境的关键选择。
    paragraphs:
    - 拖拽二十多米后力气用尽，他没有强行硬拖，而是让三人抱紧救生圈在原地等待，自己松开手游回岸边向专业救援人员求助。他清醒地面对了自己的体能极限，没有让救人变成所有人的危机。正是这一决定赢得了时间，让专业救援队的摩托艇能够及时赶到，最终把三个人平安接回。
  closing: 救人需要热血，更需要清醒的头脑。懂得保护自己、善用社会专业力量，才能让每一次善良都不被辜负，让“见义智为”真正护航生命安全。
teaching:
  spine: 开头（热忱让人伸手，理性让善意落地）→ 主体一（面对危难挺身而出是善意起点）→ 主体二（认清体能边界、寻求专业力量是关键抉择）→ 结尾（见义智为护航生命安全）。
  deconstruction:
  - target: 【立意定调】
    instruction: 开门见山确立“热忱与理性并重”的基调，既肯定少年的勇敢，又牢牢守住未成年人安全教育的底线。
  - target: 【主体递进】
    instruction: 主体一段肯定挺身而出的道德勇气，主体二段深入剖析“放弃硬拖、回岸求援”的理智抉择，逻辑层层深入。
  - target: 【结尾收拢】
    instruction: 将个案经验提炼为“见义智为”的安全互助常识，完成符合青少年认知特点的口语表达闭环。
  editor_notes: 本稿已按 Reviewer 审阅清单补正：删除了“最理智/最高智慧/最高效路径/确保不会下沉”等绝对化词汇；剔除补写的夸张险情与冲动心理；不把成功个案包装为通用施救教程，强化量力而行与专业接力。
legacy_unreviewed: false
