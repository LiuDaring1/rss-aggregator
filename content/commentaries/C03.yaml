schema_version: '1.0'
id: C03
retelling_ref: R04
packet_ref: pkt-legacy-r04
title: “100% 椰子水”被指掺水：把账算清楚，标签才守得住
learning:
  recap_facts:
  - 椰子水热销，不少品牌主打“100%纯椰子水”的品质标签；
  - 调查发现部分产品配料表只写椰子水、实际却暗中兑水稀释；
  - 广东排查发现 23 家生产企业存在相关问题，已对 5 家立案查处。
  questions:
  - 消费者挑选椰子水时依赖配料表，“100%”代表了怎样的品质承诺？
  - 配料表只写椰子水却暗中加水，为什么容易让老实做产品的厂家吃亏？
  - 监管部门开展排查并立案查处，释放了怎样的治理信号？
  baseline_diagnostic: 买饮料平时都看配料表，如果标着 100% 还能掺水，以后不知道该信什么了。
  viewpoints:
  - id: v1
    claim: 食品标签是买卖双方信任的重要依据，隐瞒掺水破坏了诚实透明的交易基础。
    evidence: 消费者无法在货架前化验成分，配料表是判断品质与价格的关键依据。
    explanation: 现代消费建立在真实透明的标签之上，破坏标签真实性等于透支消费信任。
  - id: v2
    claim: 掺水产品压低了原料成本，容易通过价格优势或超额利润，让守规矩的厂家处于不利位置。
    evidence: 掺水降低了生产成本却同样标示100%；若降价抢占市场或维持售价多获利，坚持纯正原料的厂家就会在竞争中吃亏。
    explanation: 当消费者难以现场分辨真伪时，投机取巧者往往获利，认真做产品的人反而承受竞争压力。
  - id: v3
    claim: 守住标签真实底线，关键在提高查处力度，不能让掺水比认真做产品更划算。
    evidence: 监管部门对排查发现问题的 23 家企业开展整治，并对 5 家立案查处。
    explanation: 只有打破“违规成本低、老实人吃亏”的侥幸，才能真正促使从业者敬畏规则。
  - id: v4
    claim: 守护食品品质，离不开监管排查、媒体监督与社会公众的共同关注。
    evidence: 媒体调查与监管排查形成合力，推动了隐蔽问题的曝光与整治。
    explanation: 增强抽检透明度并及时通报，有助于帮助消费者看清真相，倒逼生产端规范生产。
  reasoning_lessons:
  - title: 怎么想到的：从看不见原料到想清竞争影响
    target_viewpoint_ids:
    - v1
    - v2
    - v3
    deduction_text: 这则材料的核心在于：消费者在货架前选购椰子水，很难当场分辨成分，通常只能根据包装上的配料表作判断。标签写着“100%”，大家就把它当作品质承诺。但如果个别厂家暗中兑水，原料成本就明显降了下来。这时候，掺水者既可以通过压低售价来吸引顾客抢占市场，也可以维持原价赚取更多的利润。而在不知情的顾客眼里，它们标示相同，就会误当成同品质产品去比价。这样一来，坚持纯正原料、承担更高成本的合规企业，反而容易在竞争中吃亏。正因如此，监管部门排查并立案查处，核心目的就在于打破这种投机侥幸：严肃查处违规行为，不能让掺水比认真做产品更划算，才能保护诚实经营者，让大家买得安心。
speech:
  selected_viewpoint_ids:
  - v1
  - v3
  main_claim: 一瓶标着“100%”的椰子水暗中掺水，破坏的不仅是饮料品质，更是大家对配料表的信任。守住货架上的标签，既要看清掺水如何让诚实经营者吃亏，也需要监管严格查处，不能让弄虚作假比认真做产品更划算。看清这两点，才能保护公平放心的消费环境。
  body:
  - id: b1
    claim: 首先，消费者在货架前很难检验成分，隐瞒掺水容易让守规矩的厂家吃亏。
    paragraphs:
    - 在货架前挑选饮料，消费者无法现场化验，配料表就是判断品质的关键依据。标着“100%”，大家就默认是纯正原料。一旦暗中兑水，原料成本降低了，掺水者既能靠低价吸引顾客，也能按原价售卖多赚利润。不知情的消费者只看价格，坚持真材实料的合规厂家就会处于不利地位。这不仅打破了交易透明，也伤害了诚实经营的环境。
  - id: b2
    claim: 其次，守住配料表底线，必须严肃查处违规，不能让弄虚作假比认真做产品更划算。
    paragraphs:
    - 监管部门排查发现二十三家企业存在问题，并对其中五家立案查处。执法的关键，在于打消企业的侥幸心理。只有让违法违规真正付出代价，让行业看到投机取巧行不通，认真做产品的人才能挺直腰杆，包装上的“100%”才能真正成为靠得住的承诺。
  closing: 消费者可以接受优质高价，但不能接受弄虚作假。只有让守规矩的人不吃亏、让投机取巧者承担相应代价，货架上的标签才能真正让人放心。
teaching:
  spine: 开头（标签信任与公平环境）→ 主体一（无法现场检验，兑水导致合规厂家吃亏）→ 主体二（监管严肃查处，不能让弄虚作假比认真做产品更划算）→ 结尾（不接受弄虚作假，让守规矩者不吃亏）。
  deconstruction:
  - target: 【开头确立总观点】
    instruction: 开篇从消费者对配料表的信任切入，点出“影响诚实经营”与“不能让作假比认真做更划算”两个维度，为后续两个主体段指明方向。
  - target: 【主体一段：推导竞争影响】
    instruction: 先说明货架前无法检验成分的事实，再分析掺水降低成本给诚实厂家带来的价格与利润劣势，层层说明为何隐瞒掺水伤害了公平环境。
  - target: 【主体二段：讲明查处作用】
    instruction: 结合排查和立案事实，讲清楚执法的核心在于严肃惩戒违规、打消侥幸心理，不能让弄虚作假比认真做产品更划算。
  - target: 【结尾鲜明收束】
    instruction: 用“接受优质高价，不接受弄虚作假”表达态度，回到让守规矩者不吃亏、让标签让人放心的落脚点。
  editor_notes: 备课参考：本题教学不要停留在泛泛声讨商家的道德层面，重点引导学生理解货架前的信息差和价格竞争机制。通过“低成本带来降价优势或更多利润”这一条件性推导，让学生明白为什么瞒报成分会让老实做产品的合规厂家吃亏，进而理解监管立案查处打消侥幸、维护公平竞争的制度价值。语言力求通俗平实。
legacy_unreviewed: false
