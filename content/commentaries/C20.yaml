title: 在危难时挺身而出，在善意中双向奔赴
learning:
  recap_facts:
  - 17岁中专女生周子歆清晨在萧山街头遇到白发老人摔倒破头流血，毫不犹豫上前脱下干净白校服按压止血。
  - 买早餐路过的市民朱女士主动协助联系家属，见校服染血，将衣服带回家洗净并专程联系学校表扬女孩。
  - 女孩回校迟到后，面对老师的询问未主动声张救人义举，展现了内敛质朴的心性。
  questions:
  - 在许多人面对突发倒地事故容易犹豫迟疑时，17岁女孩“毫不犹豫脱下新换的白校服”说明了什么？
  - 路人阿姨不仅帮忙联系家属，还主动说“衣服阿姨带回家给你洗干净”，这句朴素的话为什么格外打动人心？
  - 女孩回校迟到了却对救人的壮举只字不提，这种“做了好事不张扬”的细节体现了怎样的处事气度？
  baseline_diagnostic: 学生思考容易只停留在“要向雷锋学习”或“尊老爱幼传统美德”等口号式概括上；教学诊断应引导学生关注“脱校服救人”这一动作的果断舍得，以及路人帮洗衣服背后的“不让好人受委屈”的社会共情机制。
  viewpoints:
  - id: v1
    claim: 面对突如其来的危急关头，不计得失、本能救人的赤诚最见年轻一代的纯粹良知。
    evidence: 看到老人瘦小身躯倒地流血，周子歆没有利弊权衡，脱下刚换的白校服压迫止血。
    explanation: 真正的勇敢不是毫不害怕，而是在看到他人遭遇剧痛危险时，同理心战胜了个人顾虑。
  - id: v2
    claim: 陌生人主动为善行托底的接力，构成了全社会呵护善意最温暖的护栏。
    evidence: 路人朱女士主动把染血校服带回家洗净，并专程联系学校表扬，避免行善者面临尴尬。
    explanation: 善意需要回响；当旁观者愿意为行善者分担成本与不便，善意才能在人与人之间安心流淌。
  - id: v3
    claim: 行善之后的低调淡然，展现了青年内心深处对善良最本色的理解。
    evidence: 赶回学校迟到，面对老师询问原因，女孩神色如常只字不提救人。
    explanation: 不为图虚名而行善，把伸出援手视作理所应当的日常，这种质朴让行为本身更具力量。
  - id: v4
    claim: 微小的突发事件是城市温情的镜子，普通人的彼此守护筑牢了社区的信任基石。
    evidence: 从学生扶人、路人联络洗衣，到急救车迅速赶赴，多方普通人在几十分钟内自然协同。
    explanation: 社会公序良俗的维系，不只靠严密的制度规范，更靠无数普通人骨子里的善良本能。
  reasoning_lessons:
  - title: 剖析“脱下白校服”到“阿姨帮洗衣”的善意闭环
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: 读这则新闻，最动人的不是抽象的口号，而是两组具体的细节互动：一组是女孩的动作——她脱下的是早上刚换上的干净长袖白校服，那是学生身上最醒目的标志；另一组是路人的回应——阿姨看到孩子满身血污，想的不是看热闹，而是“不能让孩子穿着带血的校服回学校”。一个用衣服救命，一个用手心洗净衣服。这种陌生人之间毫无保留的体贴与接力，打破了人与人之间的冷漠防线，形成了一个守护善意的完美闭环。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 读到17岁中专女生周子歆脱下校服救助摔倒老人的故事，最打动我的不仅是危急关头她挺身而出的热忱，更是陌生人之间心照不宣、彼此托举的世间温情。面对眼前的伤痛，她用赤诚护住生命；面对少年的善举，路人以质朴行动呵护善良。
  body:
  - id: b1
    claim: <b>一方面，面对突如其来的危难，最动人的是不计得失、本能救人的纯粹担当。</b>
    paragraphs:
    - <b>一方面，面对突如其来的危难，最动人的是不计得失、本能救人的纯粹担当。</b>面对突发倒地、后脑流血的老人，周子歆心里只有“她看起来太疼了”的质朴念头。她毫不犹豫上前将老人抱在怀里，脱下身上刚换的白校服按压止血。没有利弊权衡，没有多余顾虑，在他人身处险境时用最直接的行动伸出援手，展现了当代青年内心最纯粹的道德良知。
  - id: b2
    claim: <b>另一方面，陌生路人主动帮忙洗净校服的托举，展现了社会善意双向奔赴的暖流。</b>
    paragraphs:
    - <b>另一方面，陌生路人主动帮忙洗净校服的托举，展现了社会善意双向奔赴的暖流。</b>救护车赶到后，路过的朱女士看到女孩满身血迹，主动把校服带回家清洗，并专程联系学校表扬女孩。一个人在街头用热忱温暖了他人，周围的人便站出来为她遮风挡雨，不让行善者遭遇尴尬。这种体贴与共情，不仅呵护了少年的赤子之心，更让善良的力量在城市角落持续流淌。
  closing: 以赤诚守护生命，以温情回应善良。周子歆的故事让我们看到，社会的温度从来不是抽象的概念，它就写在年轻人毫不犹豫伸出的双手里，写在普通人彼此呵护的温情细节之中。
teaching:
  spine: 全篇采用“破题亮明危难赤诚与双向奔赴主线 → 主体一论述少年不计得失本能施救的纯粹良知 → 主体二论述路人主动托举呵护善意的社会暖流 → 结尾提炼以赤诚守护生命温情回应善良”的双主体结构。
  deconstruction:
  - target: 【破题开场】快速亮出核心判断
    instruction: 不做大段叙事铺陈，直接对比“面对伤痛以热忱护住生命”与“面对善举以质朴行动呵护善良”两条主线，迅速统领全文。
  - target: 【主体一论述】抓住动作细节谈良知本能
    instruction: 首句加粗亮明论点，紧扣“脱下刚换上的干净白校服按压止血”的具体行动，剖析“见他人之痛而起同理心”的纯粹品质。
  - target: 【主体二论述】抓住路人互动谈善意回响
    instruction: 首句加粗亮明论点，分析路人朱女士主动帮洗衣服、联系学校表扬的用意，阐明“不让好人受委屈、为善良托底”的社会共情价值。
  - target: 【结尾收束】升华城市文明底色
    instruction: 以对仗句“以赤诚守护生命，以温情回应善良”明快收束，落脚到普通人具体微小的守护，富有感染力。
  editor_notes: 本单元严格遵循双主体段规范，观点池提供4个明确方向，范本主线集中，语言自然可说。
legacy_unreviewed: false
