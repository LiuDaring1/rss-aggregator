schema_version: '1.0'
id: C21
retelling_ref: R29
packet_ref: null
title: 尊重智力成果，职场考核不该以“试题”之名侵害劳动权益
learning:
  recap_facts:
  - 青年求职者小林应聘文创策划岗，按复试要求提交数千字详细市集策划案后未获录用。
  - 两周后小林发现涉事公司公开落地的商业市集活动，原样照搬了其方案的构想、动线与文案。
  - 小林留存带时间戳原稿与沟通记录依法交涉，最终获得企业公开道歉及全额版权报酬。
  questions:
  - 企业在招聘考核中要求求职者提供具体方案，合理考查业务能力与涉嫌“白嫖创意”的边界在哪里？
  - 面对未被录用却被抄袭成果的遭遇，青年小林没有自认倒霉而是主动固定证据维权，体现了什么素养？
  - 规范企业招聘行为与保护青年求职者的智力成果，对于构建健康的就业生态有什么长远意义？
  baseline_diagnostic: 初步思考容易只停留在情绪化指责“黑心公司欺负求职者”或抱怨“职场套路防不胜防”；教学诊断应引导学生立足法治意识与契约精神，从劳动权益保护、智力成果尊重以及就业市场规范的建设性视角展开理性分析。
  viewpoints:
  - id: v1
    claim: 招聘考核应当划定合理边界，不能以“考察业务”为由无偿占有求职者的智力成果。
    evidence: 企业要求提交可直接商用的整套执行案却未录用，转身无偿用于自身商业变现。
    explanation: 考核测试旨在评估候选人专业潜质，一旦直接商用便已构成智力劳动侵害，违背公平准则。
  - id: v2
    claim: 面对职场侵权敢于依法维权，展现了当代青年清醒的权利意识与法治素养。
    evidence: 小林主动保留带时间戳证据、邮件沟通链条，并在专业机构指导下成功交涉维权。
    explanation: 拒绝吃哑巴亏并不等于鲁莽对抗，用完整的客观证据链捍卫尊严，是理性的法治力量。
  - id: v3
    claim: 企业的长远发展基于契约与诚信，靠投机套利侵犯劳动者终将反噬自身声誉。
    evidence: 涉事公司最终被确凿证据坐实侵权，不得不公开致歉并承担赔偿责任。
    explanation: 失去求职者与市场的信赖，企业便失去了吸引优秀人才与健康立足的根本基石。
  - id: v4
    claim: 净化求职环境需要完善制度兜底，建立起对招聘环节智力成果的常态化防护机制。
    evidence: 类似求职“白嫖作业”现象频发，仅靠个体求职者事后艰难取证往往成本高昂。
    explanation: 行业协会与监管部门应明确试题边界与版权备案，从源头上遏制不规范的用工侵害。
  reasoning_lessons:
  - title: 辨析“业务考核”与“变相剥夺”的本质区别
    target_viewpoint_ids:
    - v1
    - v2
    - v3
    - v4
    deduction_text: 在招聘过程中，用人单位了解应聘者的业务能力完全正当，但“考查能力”与“占有方案”有着本质不同。考查能力看的是思路框架与专业逻辑，而要求提供细节完备、拿来即用的商用执行方案，往往就越过了正常考核的底线。小林的成功维权之所以具有广泛的社会示范效应，是因为他没有止于网上的委屈倾诉，而是用时间戳、往来邮件等扎实的法律事实，击碎了某些企业“白嫖试题概不负责”的侥幸心理。这也启示我们，健康的职场生态不仅需要企业恪守诚信底线，更需要每一位劳动者在权益受损时拥有拿起法律武器的底气与清醒。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 面对求职面试中方案被抄袭的遭遇，最值得我们深思的是，企业考核决不能以“试题”之名侵害劳动成果，而青年求职者用扎实证据依法维权的清醒与底气，正是法治社会最需要的坚定力量。
  body:
  - id: b1
    claim: 一方面，招聘考核应当守住权利边界，不能将考查潜质异化为对青年智力成果的无偿索取。
    paragraphs:
    - 一方面，招聘考核应当守住权利边界，不能将考查潜质异化为对青年智力成果的无偿索取。考核的本意是检验专业素养与岗位匹配度，要求求职者提供整体创意甚至拿来即用的商用方案，本身就容易滑向滥用优势地位的泥潭。把未录用青年的心血原样搬上商业舞台，不仅侵犯了他人的智力劳动成果，更践踏了职场最基本的契约信任。
  - id: b2
    claim: 另一方面，面对侵权不忍气吞声而主动固定证据，展现了当代青年清醒而理性的法治力量。
    paragraphs:
    - 另一方面，面对侵权不忍气吞声而主动固定证据，展现了当代青年清醒而理性的法治力量。发现方案被挪用后，小林没有自认倒霉，也没有情绪化宣泄，而是迅速调取带时间戳的文稿、邮件和沟通记录，依法提出严正交涉，最终赢得道歉与补偿。这种善于用法律事实说话、敢于捍卫劳动尊严的行动，为所有青年求职者树立了维权的示范。
  closing: 尊重劳动方能聚拢英才，恪守诚信才能行稳致远。让每一次考核都透明公正，让每一份付出都受到应有的尊重，我们的就业环境才会更加开阔、更有朝气。
teaching:
  spine: 全篇采用“破题亮明考核边界与维权力量核心主张 → 主体一剖析企业试题考核越界占有创意的本质 → 主体二赞扬求职者理性取证依法捍卫尊严的法治素养 → 结尾呼应升华职场诚信与尊重劳动”的双主体结构。
  deconstruction:
  - target: 【开头破题】迅速直击问题核心
    instruction: 不堆砌求职细节，直接点破“试题考核不能变相侵权”与“青年依法理性维权”两大核心判断，开门见山，立意明确。
  - target: 【主体一论述】结合试题考核辨析侵权本质
    instruction: 首句加粗亮出分论点，抓住“考查专业潜质”与“索取商用成果”的本质冲突，深入剖析企业滥用招聘优势地位侵害契约信任的错误。
  - target: 【主体二论述】结合取证交涉细节赞扬法治素养
    instruction: 首句加粗亮出分论点，列举时间戳、邮件、对话等取证环节，阐明青年不忍气吞声、用事实和法律捍卫尊严的示范价值。
  - target: 【结尾收束】升华职场生态与诚信价值
    instruction: 以“尊重劳动方能聚拢英才，恪守诚信才能行稳致远”对仗收束，把个体维权提升至全社会营造公平健康就业生态的广度。
  editor_notes: 本单元严格执行双主体段规范，正文无裸露HTML标签，观点池提供4个明确思考向度，范本说理透彻，语言生动自然。
