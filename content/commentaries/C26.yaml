title: 走出名利的狭隘标尺，让平凡的坚守获得平等的敬意
learning:
  recap_facts:
  - 西南政法大学2023届本科毕业生龚宝冬回到家乡担任普通网格员，在防汛一线组织群众转移时牺牲。
  - 网络上曾出现关于“县城网格员究竟算不算西政精英”的功利性质疑。
  - 西政校长林维在万人新生开学典礼上郑重回答“是的”，盛赞其把身边的百姓当作天下。
  questions:
  - 为什么名校毕业生到基层当网格员，会引发部分人“大材小用”或“算不算精英”的议论？
  - 西政校长在开学典礼上那句掷地有声的“是的”，究竟在肯定什么样的大学精神？
  - 在当今多元社会中，我们该如何跳出世俗名利的单一评价标尺，去理解普通劳动的崇高价值？
  baseline_diagnostic: 初学者容易只停留在悲情歌颂或空洞表扬上；教学应引导学生深入辨析“精英”概念的内涵演变，从优绩主义反思、青年人生价值与扎根基层的奉献维度展开有力论证。
  viewpoints:
  - id: v1
    claim: 真正的杰出在于对社会的真实贡献与奉献，而非取决于外部头衔的光鲜与否。
    evidence: 龚宝冬在基层一线排查险情、守护邻里，危难关头用年轻生命托举了人民群众的安全。
    explanation: 职业本无高低之别，在平凡的岗位上做到极致并承担起生死重托，展现了最高尚的人格力量。
  - id: v2
    claim: 大学不仅要培养仰望星空的学者领袖，更应为脚踏实地的基层守望者感到自豪。
    evidence: 西政校长在新生典礼上将基层殉职校友列为典范，明确指出身边的居民就是天下。
    explanation: 办学宗旨的崇高不在于校友聚拢了多少财富，而在于能否培育出胸怀大爱、甘于奉献的社会栋梁。
  - id: v3
    claim: 破除唯学历、唯收入的狭隘成功学，是青年一代确立精神坐标的必修一课。
    evidence: 面对部分网友的精英偏见，公众普遍对网格员的英勇牺牲致以由衷敬意与赞誉。
    explanation: 只有打破单一赛道的内卷焦虑，尊重每一种脚踏实地的奉献，年轻人的未来才能更加广阔从容。
  - id: v4
    claim: 基层是一切公共治理的根基，需要并值得优秀青年倾注专业智慧与热忱青春。
    evidence: 基层治理面临大量复杂的社情民意与应急考验，高素质法治人才在其中大有可为。
    explanation: 把书本所学化作服务社区的具体行动，是对教育价值最生动、最接地气的实践诠释。
  reasoning_lessons:
  - title: 重构“精英”内涵：从世俗标签到责任担当
    target_viewpoint_ids:
    - v1
    - v2
    - v3
    deduction_text: 社会的刻板偏见常常把法学院的精英画地为牢在红圈律所或跨国大厦，仿佛不穿笔挺西装就不算学有所成。但龚宝冬的故事彻底打破了这种狭隘想象。他在防汛一线顶风冒雨护送群众，用25岁的生命践行了守护一方的誓言。西政校长的“是的”，正是对世俗名利标尺的有力纠偏。能够将一己之长奉献给脚下的土地，把百姓的安危冷暖时刻装在心里，这才是真正顶天立地的时代精英。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 听到西政校长在开学典礼上郑重宣告基层网格员校友是真正的精英，我深受震撼。这句话打破了唯世俗名利的狭隘偏见，彰显了大学精神最深沉的底色：杰出的标准不在于职位有多光鲜，而在于肩头扛起了多少真实的担当。
  body:
  - id: b1
    claim: 一方面，真正的精英品格，从来都根植于对社会的具体奉献，而非取决于浮华的外在标签。
    paragraphs:
    - 一方面，真正的精英品格，从来都根植于对社会的具体奉献，而非取决于浮华的外在标签。放弃大城市的繁华回到县城，扎根网格排查隐患、调解纠纷，在山体崩塌的危急关头把生的希望留给群众，龚宝冬用生命诠释了奉献的真谛。衡量一个人是否优秀，绝不仅看他获得了多高薪水，更要看他在自己的岗位上为他人带来了多少安宁与托举。
  - id: b2
    claim: 另一方面，大学教育的崇高追求，在于培育脚踏实地的守望者，让青春在基层一线绽放光彩。
    paragraphs:
    - 另一方面，大学教育的崇高追求，在于培育脚踏实地的守望者，让青春在基层一线绽放光彩。校长那句有力的“是的”，向万千学子传递了清晰的价值导向：身边的居民就是天下，守护一方百姓同样是无比崇高的使命。走出功利化的优绩主义枷锁，让默默奉献的劳动者获得应有的尊严与荣光，整个社会才能葆有持久前行的温情与力量。
  closing: 平沙无言，走过方知其广阔；微光成炬，汇聚方见其璀璨。龚宝冬的选择启示我们，不被虚名所惑，在属于自己的土地上认真耕耘、全力担当，每一种平凡而坚韧的人生，都是对青春最响亮的回答。
teaching:
  spine: 全篇采用“破题引用校长发问直击精英内涵 → 主体一论述真实奉献打破浮华标签 → 主体二论述大学育人回归基层担当与价值重塑 → 结尾对仗收束升华青年人生定力”的双主体结构。
  deconstruction:
  - target: 【开头破题】借助校长答问点明价值主线
    instruction: 直接引用开学典礼上震撼人心的回答，迅速摆脱常规说教，确立以责任担当重估杰出标准的论题主旨。
  - target: 【主体一论述】结合救灾壮举重塑精英品格
    instruction: 首句加粗亮明观点，将年轻网格员日常走访与舍己救人的真实行动相融，有力驳斥了唯收入、唯光鲜的功利评价。
  - target: 【主体二论述】立足育人使命剖析社会导向
    instruction: 首句加粗亮明观点，从校长的价值肯定延伸到教育使命与优绩主义反思，逻辑逐层递进，发人深省。
  - target: 【结尾收束】化用微光意象收束全文
    instruction: 以微光成炬为喻，呼应开头，引导青年学生在脚踏实地的奋斗中寻找生命坚守的意义，富有语言美感。
  editor_notes: 本单元立意高远，直面青年就业与价值选择痛点，双主体段逻辑紧密，字数精炼合规。
legacy_unreviewed: false
