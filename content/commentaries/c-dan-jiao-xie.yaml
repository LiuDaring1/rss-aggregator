schema_version: "1.0"
id: "c-dan-jiao-xie"
retelling_ref: "R-dan-jiao-xie"
packet_ref: "pkt-dan-jiao-xie"
title: "“单脚鞋银行”：解开被忽视的真实需求"
learning:
  recap_facts:
    - 市场上的鞋成双售卖，单脚截肢人士买一双必须扔一只；而在鞋都温州，鞋企每年展示后会销毁约40万只单只样品鞋。
    - 2017年温州大学师生发起“单脚鞋银行”，对接鞋企与各地残联，9年里免费寄出2万多只单脚鞋。
    - 团队最初每人发一两只，回访发现单脚走路三个月就磨坏鞋底，改为一次发四到六只；有受助者在农村务农不能穿皮鞋，团队特意挑选防滑耐磨的运动鞋。
    - 随着生活改善与假肢普及，单脚鞋年需求降至30只；团队继续留守的同时，教残障人士制作手工艺品义卖，并尝试用编程开发生活助手。
  questions:
    - 鞋企每年销毁大量单只样品鞋，单脚人士却长年买一双扔一只，这种错位说明了什么？
    - 为什么把寄鞋数量增加到四至六只？为什么把皮鞋换成防滑运动鞋？
    - 当年寄送量减少到三十只时，有人觉得可以结束了，团队为什么坚持开下去？
    - 组织义卖手工艺品和开发生活助手，给受助者带来了哪些送鞋之外的改变？
  baseline_diagnostic: "初步感受：大学生很有爱心，善于利用身边的资源做好事。（如果只讲爱心和奉献，就容易落入套话，忽略了这件事情里最见功力的观察与调整。）"
  viewpoints:
    - id: "v1"
      claim: 常规市场往往只考虑大多数人的通用规则，公益首先要看见被忽略的少数人。
      evidence: 鞋企按双售卖并销毁单只样品鞋，单脚群体买一双扔一只；团队将两端对接，让闲置资源对准了真实困难。
      explanation: 问题的根源往往不是物资绝对短缺，而是通行的交易规则难以照顾到特殊的少数需求。
    - id: "v2"
      claim: 真正的帮助不是给得体面，而是给得合用。
      evidence: 受助者在农村要下地劳作，皮鞋不仅容易摔倒还不耐磨，换成防滑运动鞋才能真正解决生活难题。
      explanation: 坐在教室里想象的帮助容易流于表面，只有贴近对方真实的生活处境，善意才能真正用得上。
    - id: "v3"
      claim: 帮扶数量的下降反映了社会的整体改善，而公益的坚守在于不让剩下的少数人掉队。
      evidence: 假肢普及让单只鞋年需求从数千只降至三十只；团队坚持“只要还有一个人需要就做下去”。
      explanation: 某种帮扶形式的缩减是社会保障提升的好事，但不能把数字变小当成放弃留守的理由。
    - id: "v4"
      claim: 参与劳动所带来的充实感和被需要的感觉，能让受助者获得平等的尊严。
      evidence: 团队组织残障人士制作永生花和手工艺品，十六岁女孩通过义卖劳动第一次获得几十元劳动报酬。
      explanation: 人的尊严并非金钱赋予，但通过双手付出劳动、被社会认可，能够带来深切的自信与价值感。
    - id: "v5"
      claim: 把青年学生的专业所长融入日常帮扶，能让善意走得更远、更扎实。
      evidence: 电气与计算机专业学生尝试将编程、在线平台和语音助手应用到日常帮扶中。
      explanation: 志愿服务不仅靠一时的热情，更需要用专业知识解决具体问题。
  reasoning_lessons:
    - title: "怎么想到的：从两处细节看善意的分寸"
      target_viewpoint_ids:
        - "v1"
        - "v2"
      deduction_text: "读这则材料，最值得留意的不是“送了多少只鞋”，而是两次具体的调整。第一次是调整数量：凭直觉给一两只，回访发现单脚行走磨损极快，三个月就坏，于是改送四到六只；第二次是调整鞋型：给皮鞋虽然看起来光鲜，但受助大叔在乡下要下地干活，皮鞋既不经磨还容易滑倒，于是特意挑出防滑运动鞋。把这两处细节放在一起想：为什么做好事不能光凭一腔热情？因为如果只满足于“我已经送出去了”，就看不见对方到底能不能穿、穿得好不好。只有顺着受助者的日子往深处看，善意才不会变成对方的累赘，而是实实在在的支撑。"
speech:
  selected_viewpoint_ids:
    - "v1"
    - "v2"
  main_claim: "温州大学的“单脚鞋银行”之所以打动人，不仅在于它帮单脚残疾人找到了鞋，更在于九年里，志愿者始终顺着受助者的真实生活去调整办法。落到实处的善意，既要看见被忽略的痛点，更要在柴米油盐的细节里懂得体贴。"
  body:
    - id: "b1"
      claim: "首先，发现痛点需要打破常规眼光，看见少数人的真实难处。"
      paragraphs:
        - "市场上鞋子总是成双出售，单脚残障人士不得不买一双扔一只；而在鞋都温州，每年有数十万只单只样品鞋被销毁。大学生们没有把这当成理所当然，而是把闲置的样品鞋和被忽略的需求连在了一起。很多时候，帮助别人的第一步，就是打破大多数人的惯性，看到那些被遗忘的日常难处。"
    - id: "b2"
      claim: "其次，落到实处的善意，要在真实处境里不断调整，给得合用。"
      paragraphs:
        - "送鞋听起来简单，做起来却满是细节。听说有受助者在农村要下地干活，志愿者就特意挑出防滑耐磨的运动鞋；发现单脚走路磨损快，他们就主动把每次寄送增加到四至六只。这提醒我们，好的心意不能只图给得体面，更要给得合用。只有贴近别人的真实处境，善意才能真正接得住、用得上。"
  closing: "从找鞋到换鞋，“单脚鞋银行”告诉我们：做好一件小事，不仅需要善意，更需要把他人放在心上的细致与耐心。"
teaching:
  spine: "开头（明确总观点：不仅看见痛点，更顺着真实生活不断调整）→ 主体一（打破常规，看见被忽略的少数人难处）→ 主体二（贴近处境，在生活细节中把善意给得合用）→ 结尾（收束到做好事的细致与耐心）。"
  deconstruction:
    - target: "【开头段】"
      instruction: "用两句话立住总判断，直接点出这件事情的两个关键侧面——既看见被忽略的痛点，又在细节中不断调整，为后文两个主体段搭建清晰的统领骨架。"
    - target: "【主体一段】"
      instruction: "首句明确提出分论点，抓住“市场上成双卖”与“鞋企销毁单只鞋”的错位事实展开，论证为什么发现痛点需要打破惯性眼光。"
    - target: "【主体二段】"
      instruction: "推进到行动的深处，从小观点“给得合用”切入，用下地干活换运动鞋、单脚磨损增配鞋量两处事实支持，阐明善意如何才能真正落到实处。"
    - target: "【结尾段】"
      instruction: "用简短两句话收拢“找鞋”与“换鞋”的论述，将思考落脚在善意需要细致与耐心上，自然完成两分钟表达闭环。"
  editor_notes: "本稿为 Reviewer 审阅评估后的重构候选稿，字数控制在约380汉字，纠正了原稿中的事实杂糅与概念化词汇。"
legacy_unreviewed: false
