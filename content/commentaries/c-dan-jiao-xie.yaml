schema_version: '1.0'
id: c-dan-jiao-xie
retelling_ref: R-dan-jiao-xie
packet_ref: pkt-dan-jiao-xie
title: “单脚鞋银行”：解开被忽视的真实需求
learning:
  recap_facts:
  - 市场上的鞋成双售卖，单脚残疾人士买一双往往只能扔一只；而在鞋都温州，鞋企每年展示后会销毁约40万只单只样品鞋。
  - 2017年温州大学师生发起“单脚鞋银行”，对接鞋企与各地残联，9年间累计免费寄出超2万只单脚鞋，辐射13个省份。
  - 团队最初每人发一两只，回访发现单脚走路三个月就磨坏鞋底，改为一次发四到六只；有受助者在农村务农不能穿皮鞋，团队特意挑选防滑耐磨的运动鞋。
  - 随着假肢普及与生活改善，2025年单脚鞋年需求降至30只；团队继续留守的同时，教残障人士制作手工艺品义卖，并尝试用编程开发生活助手。
  questions:
  - 鞋企每年销毁大量单只样品鞋，单脚人士却长年买一双扔一只，这种错位说明了什么？
  - 为什么把寄鞋数量增加到四至六只？为什么把皮鞋换成防滑运动鞋？
  - 当2025年寄送量减少到三十只时，有人觉得可以结束了，团队为什么坚持开下去？
  - 组织义卖手工艺品和开发生活助手，给受助者带来了哪些送鞋之外的改变？
  baseline_diagnostic: 初步感受：大学生很有爱心，善于利用身边的资源做好事。（如果只讲爱心和奉献，就容易落入套话，忽略了这件事情里最见功力的观察与调整。）
  viewpoints:
  - id: v1
    claim: 常规市场往往只考虑大多数人的通用规则，公益首先要看见被忽略的少数人。
    evidence: 鞋企按双售卖并销毁单只样品鞋，单脚群体买一双扔一只；团队将两端对接，让闲置资源对准了真实困难。
    explanation: 问题的根源往往不是物资绝对短缺，而是通行的交易规则难以照顾到特殊的少数需求。
  - id: v2
    claim: 真正的帮助不仅在于心意，更在于给得合用。
    evidence: 受助者在农村要下地劳作，皮鞋不仅容易摔倒还不耐磨，换成防滑耐磨运动鞋才能真正解决生活难题。
    explanation: 关切他人的处境不能只停留在纸面上的主观设想，只有深入了解对方具体的生活场景，帮助才能真正起作用。
  - id: v3
    claim: 年帮扶数量的下降反映了社会保障的改善，而公益的坚守在于不让剩下的少数人掉队。
    evidence: 假肢普及让2025年单只鞋需求降至三十只；团队坚持“只要还有一个人需要就做下去”。
    explanation: 需求减少反映了假肢技术与保障水平的提升，但不能把数字变小当成放弃留守的理由。
  - id: v4
    claim: 组织参与劳动与义卖，能为受助者带来被需要的参与感与自立的信心。
    evidence: 团队组织残障人士制作永生花和手工艺品，十六岁女孩通过义卖劳动第一次获得几十元报酬。
    explanation: 除了接受物资馈赠，通过自己的双手付出劳动并获得社会认可，能让人感受到实实在在的成就感与生活信心。
  - id: v5
    claim: 把青年学生的专业所长融入日常帮扶，能让善意走得更远、更扎实。
    evidence: 电气与计算机专业学生尝试将编程、在线平台和语音助手应用到日常帮扶中。
    explanation: 志愿服务不仅靠一时的热情，更需要用专业知识解决具体问题。
  reasoning_lessons:
  - title: 怎么想到的：从两处细节看善意的分寸
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: 读这则材料，最打动人的不是单纯“送了多少只鞋”，而是团队顺着受助者的生活处境完成的两次细致调整。第一次是根据损耗速度调整数量：起初按常态寄送一两只，回访得知单脚着力磨损极快、三个月就会穿坏，于是将配额提高到四至六只；第二次是根据生活场景调整鞋型：得知受助者在乡下下地劳作，皮鞋不仅容易打滑且极不耐磨，团队便特意在分拣时挑选防滑耐磨的运动鞋。把这两处细节放在一起看，就能推导出一个朴素的道理：帮助他人不能只停留在“把东西送出去”的初衷，而必须深入到对方的具体日子里。只有看清受助者真实的行走场景与损耗规律，善意才能真正合脚、管用。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: “单脚鞋银行”之所以打动人心，不仅在于帮单脚人士找到了鞋，更在于九年来，志愿者始终顺着受助者的真实生活去调整办法。落到实处的善意，既要打破常规看见被忽略的痛点，更要在具体日子里懂得体贴与合用。
  body:
  - id: b1
    claim: 首先，发现痛点需要打破思维惯性，看见少数人的真实难处。
    paragraphs:
    - 常规市场上鞋子成双出售，单脚人士买一双扔一只；而在温州，鞋企每年却有数十万只单只样品鞋被销毁。大学生们没有视而不见，而是主动搭桥，把闲置样品与特殊需求连在一起。帮助别人的第一步，往往就是打破大多数人的交易惯性，看清那些被遗忘的日常困境。
  - id: b2
    claim: 其次，真正的善意要在具体生活场景中不断调整，给得合用。
    paragraphs:
    - 送鞋听起来简单，做起来全在细节。起初团队寄送一两只，回访得知单脚着力磨损极快，便增加到四至六只；得知受助者在农村要下地劳作，皮鞋容易打滑磨损，志愿者又特意挑出防滑耐磨的运动鞋。这说明，关切他人不能停留在送出手，更要看对方用得顺不顺手。顺着对方的处境调整，善意才能真正成为生活的支撑。
  closing: 从最初的“找鞋”到后来的“换鞋”，“单脚鞋银行”告诉我们：做好一件好事，不仅需要出发时的热情，更需要把他人放在心上的细致、尊重与长久耐心。
teaching:
  spine: 开头（明确总观点：不仅看见痛点，更顺着真实生活不断调整）→ 主体一（打破常规，看见被忽略的少数人难处）→ 主体二（贴近处境，在生活细节中把善意给得合用）→ 结尾（收束到做好事的细致与耐心）。
  deconstruction:
  - target: 【开头确立统领】
    instruction: 用清晰两句话立住总判断，直接点明这件事情的两个关键侧面——既看见被忽略的痛点，又顺着具体生活调整方法，为后文两个主体段搭建稳固骨架。
  - target: 【主体一段：破除惯性】
    instruction: 首句亮出分论点，抓住“市场上成双卖”与“鞋企销毁单只鞋”的强烈对比展开，有力论证为什么发现痛点首先需要打破交易惯性。
  - target: 【主体二段：因果递进】
    instruction: 推进到行动纵深，从小观点“给得合用”切入，用下地干活换运动鞋、单脚磨损增配鞋量两处扎实事实支持，讲透善意如何避免悬空、落地生根。
  - target: 【结尾收束归纳】
    instruction: 用提炼性的“找鞋与换鞋”收拢前后两段论证，将思考升华为对细致、尊重与长久耐心的认同，完成两分钟口语表达闭环。
  editor_notes: 本稿已按 Reviewer 审阅清单精修：彻底剔除“凭直觉/只图体面”等臆测性措辞；深入推导供需错位与生活合用两层因果关系；统计口径精确为正文汉字数 428 汉字、总字符数 478 字符（朗读时长约 1.8 - 2 分钟）。
