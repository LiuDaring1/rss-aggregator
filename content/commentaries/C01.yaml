schema_version: '1.0'
id: C01
retelling_ref: R01
packet_ref: pkt-legacy-r01
title: “想被夸夸”：大方求赞，真诚给赞
learning:
  recap_facts:
  - 亳州美食街，幼童从三楼阳台外坠落，楚亮在买饭途中跑上前伸手接住，孩子滑落地面，楚亮多处疼痛；
  - 事后他在网上发帖，请大家给自己“点点赞、夸一夸”；
  - 帖子收获超过九万人次点赞，网友提出寄家乡特产，他的行为也获得了公益奖励；面对孩子家长的感谢，他表示照顾好孩子最重要。
  questions:
  - 楚亮伸手救人后在网上大方求夸，这种“求点赞”的心态该如何理解？
  - 面对赶来致谢的孩子家人，他嘱咐“照顾好孩子最重要”，这种态度说明了什么？
  - 为什么说做好事坦率表达被认可的愿望，与传统美德并不冲突？
  - 超过九万人次点赞、寄送特产以及公益奖励，这些回应给行善者带来了什么？
  baseline_diagnostic: 初步感受：救人很勇敢，发帖求赞很可爱。（不能只停留在“很可爱”的表面印象，要讲清楚大方求赞为何合情合理，以及社会给予真诚回应为何重要。）
  viewpoints:
  - id: v1
    claim: 挺身救人之后大方求赞，是坦率表达被认可愿望的正常心理，不会让善行贬值。
    evidence: 楚亮伸手接住坠楼幼童并承受多处疼痛，事后发帖请大家夸一夸自己。
    explanation: 行善本身需要勇气与付出，希望自己的辛苦被社会看见和肯定，是合情合理的人之常情。
  - id: v2
    claim: 公众真诚给赞与肯定，能够让行善者的付出得到温暖的回响。
    evidence: 帖子获得超过九万人次点赞，网友热情留言并提出寄送家乡特产。
    explanation: 及时的善意反馈能够让施救者感受到被尊重与珍惜，形成良性互动的社会氛围。
  - id: v3
    claim: 体谅受助家庭的难处，体现了不给对方增添心理负担的体贴。
    evidence: 面对赶来感谢的孩子家人，他嘱咐“照顾好孩子最重要”，把注意力放在孩子安危上。
    explanation: 救人之后不把恩情变成对方的心理包袱，是对受助者处境的细致体恤。
  - id: v4
    claim: 社会公益奖励与舆论正面支持，共同构成了对普通人见义勇为的切实鼓励。
    evidence: 楚亮的行为不仅收获了网友的大量点赞，也获得了公益机构颁发的专项奖励。
    explanation: 对见义勇为的呵护，既需要大众的情感共鸣，也需要社会机制给予实质性的肯定与托底。
  reasoning_lessons:
  - title: 怎么想到的：在双向互动中看善意流转
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: 读这则材料，很容易把目光全部落在楚亮发帖求赞上。我们要看到这背后双向的善意流转：一边是楚亮冒着受伤风险伸手接住孩子，事后坦率表达希望被大家夸夸的愿望；另一边是超过九万人次的点赞与热情回应，大家毫不吝啬赞美，甚至想寄特产表达心意。做好事希望得到肯定，是人之常情；看到勇敢的行为给予真诚喝彩，是社会的温度。把求赞与给赞放在一起看，就能明白：健康的社会风尚不苛求道德无瑕，而是让付出者敢于表达，让围观者乐于回馈，让善意在双向奔赴中传递开来。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 救人之后，楚亮在网上坦然发帖求赞，这份坦率同样让人感到温暖。做好事的人可以大方求赞，看到好事的人也不妨真诚给赞。善意走出了一步，也理应得到社会的真诚回响。
  body:
  - id: b1
    claim: 首先，大方求赞不会让善举本身的价值打折。
    paragraphs:
    - 楚亮冲上前伸出双手接住坠落的幼童，自己身上多处负伤。事后一句“请大家夸夸我”，并没有改变勇敢救人的事实。一个人承受疼痛做成了一件好事，希望自己的付出被看见、被肯定，是完全正常的心愿。做好事不留名固然崇高，但坦率表达被认可的期待同样光明磊落，并不比默默奉献低一等。
  - id: b2
    claim: 其次，真诚给赞能够让行善者的付出得到温暖的回响。
    paragraphs:
    - 面对楚亮的帖子，超过九万人次点赞互动，大家没有冷嘲热讽，而是热情留言鼓励，甚至想寄特产表达心意。这样的良性互动，不仅让救人者感到付出没有被辜负，也让所有人看到了善意的回音。生活中，无论是热心引路的人，还是顺手帮忙的朋友，及时的肯定都能让善意走得更加踏实。
  closing: 愿意求赞的人不必难为情，愿意给赞的人也不必吝惜掌声。当每一次勇敢都能得到真诚的回应，善良才会在人与人之间传递得更久、更远。
teaching:
  spine: 开头（大方求赞与真诚给赞并立）→ 主体一（求赞是正常心愿，不让善举打折）→ 主体二（给赞是良性互动，让付出得到温暖回响）→ 结尾（总结呼吁：善意需要真诚回音）。
  deconstruction:
  - target: 【开头破题】
    instruction: 开门见山亮明核心观点，将“求赞”与“给赞”双方放在同一视野下，确立双向良性互动的论述主线。
  - target: 【主体一立论】
    instruction: 立足救人事实与承受伤痛的付出，剖析行善者希望被认可的合理心理，引导听众建立宽容健康的道德认知。
  - target: 【主体二推进】
    instruction: 转向社会大众的正面回应，以九万人次点赞与善意互动为例，论述真诚回馈对于守护良好风气的积极意义。
  - target: 【结尾收拢】
    instruction: 扣紧开头确立的双向关系，将个案提炼为人际相处中的普遍道理，完成两分钟口语表达闭环。
  editor_notes: 本稿已按 Reviewer 审阅清单补正：纠正“九万人”为“九万人次”；消除净化动机与苛责，承认被认可的正常需要；整合重叠观点并补充公益托底方向；规范字数至约375字。
legacy_unreviewed: false
