schema_version: '1.0'
id: C01
retelling_ref: R01
packet_ref: pkt-legacy-r01
title: “想被夸夸”：大方求赞，真诚给赞
learning:
  recap_facts:
  - 亳州美食街，幼童从三楼阳台外坠落，楚亮在买饭途中跑上前伸手接住，孩子滑落地面，楚亮多处疼痛；
  - 事后他在网上发帖，请大家给自己“点点赞、夸一夸”；
  - 帖子收获超过九万人次点赞，网友提出寄家乡特产，他的行为也获得了公益奖励；面对孩子家长的感谢，他表示照顾好孩子最重要。
  questions:
  - 楚亮伸手救人后在网上大方求夸，这种“求点赞”的心态该如何理解？
  - 面对赶来致谢的孩子家人，他嘱咐“照顾好孩子最重要”，这种态度说明了什么？
  - 为什么说做好事坦率表达被认可的愿望，与传统美德并不冲突？
  - 超过九万人次点赞、寄送特产以及公益奖励，这些回应给行善者带来了什么？
  baseline_diagnostic: 初步感受：救人很勇敢，发帖求赞很可爱。（不能只停留在“很可爱”的表面印象，要讲清楚大方求赞为何合情合理，以及社会给予真诚回应为何重要。）
  viewpoints:
  - id: v1
    claim: 挺身救人之后大方求赞，是坦率表达被认可愿望的正常心理，不会让善行贬值。
    evidence: 楚亮伸手接住坠楼幼童并承受多处疼痛，事后发帖请大家夸一夸自己。
    explanation: 行善本身需要勇气与付出，希望自己的辛苦被社会看见和肯定，是合情合理的人之常情。
  - id: v2
    claim: 公众真诚给赞与肯定，能够让行善者的付出得到温暖的回响。
    evidence: 帖子获得超过九万人次点赞，网友热情留言并提出寄送家乡特产。
    explanation: 及时的善意反馈能够让施救者感受到被尊重与珍惜，形成良性互动的社会氛围。
  - id: v3
    claim: 体谅受助家庭的难处，体现了不给对方增添心理负担的体贴。
    evidence: 面对赶来感谢的孩子家人，他嘱咐“照顾好孩子最重要”，把注意力放在孩子安危上。
    explanation: 救人之后不把恩情变成对方的心理包袱，是对受助者处境的细致体恤。
  - id: v4
    claim: 社会公益奖励与舆论正面支持，共同构成了对普通人见义勇为的切实鼓励。
    evidence: 楚亮的行为不仅收获了网友的大量点赞，也获得了公益机构颁发的专项奖励。
    explanation: 对见义勇为的呵护，既需要大众的情感共鸣，也需要社会机制给予实质性的肯定与托底。
  reasoning_lessons:
  - title: 怎么想到的：在双向互动中看善意流转
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: 读这则材料，最关键的是把楚亮的行动与心理放在时间先后顺序中审视。第一阶段是突发危险中的生死一瞬：跑上前伸出双手接住孩子，自己承受多处疼痛，救人的事实与付出的代价在瞬间已经实实在在地成立；第二阶段是脱离危险后的情感表达：发帖请大家夸夸我。把这两个阶段厘清，逻辑一目了然：事后求夸丝毫不会改变先前舍身救人的英勇；面对巨大的惊险与伤痛，渴望被看见、被肯定，是坦荡光明的人之常情，绝不能用脱离人性的道德洁癖去贬低。再看外部回应，既有九万人次点赞的情感温度，又有公益机构专项奖励的机制托底。两者结合，就清晰勾勒出了善意良性循环的完整闭环。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 救人之后，楚亮在网上发帖大方求夸，这份坦率同样让人感到温暖。做好事的人可以光明磊落求赞，看到好事的人也不妨真诚给赞。善意走出了一步，理应得到社会温暖而坚定的回响。
  body:
  - id: b1
    claim: 首先，大方求夸丝毫不会让舍身救人的价值打折。
    paragraphs:
    - 在危急时刻，楚亮跑上前伸出双手接住幼童，自己承受了多处疼痛，救人的事实与付出的代价在瞬间已经实实在在地成立。面对巨大的风险与伤痛，希望自己的付出被看见、被肯定，是合情合理的人之常情。我们不该用苛刻的道德条框要求行善者只能默默奉献，坦荡表达对认可的期待，同样光明磊落，值得被真诚尊重。
  - id: b2
    claim: 其次，社会的真诚回馈让行善者的付出有了温暖的回音。
    paragraphs:
    - 面对楚亮的求赞帖，网友们没有挑剔审判，而是用超过九万人次真诚的点赞与留言给予肯定；公益机构也及时送上了专项奖励。这种回响，既有公众舆论的情感温度，也有社会机制的实质托底。它让行善者感到付出被深深珍惜，也向全社会表明：每一次挺身而出，都绝不会被冷落与辜负。
  closing: 愿意求赞的人不必难为情，愿意给赞的人也不必吝惜掌声。当真实的勇敢总能迎来温暖的回应，善良才会在人与人之间传递得更踏实、更长远。
teaching:
  spine: 开头（大方求赞与真诚给赞并立）→ 主体一（救人事实成立，求赞不让善行贬值）→ 主体二（情感肯定与机制托底让善意长青）→ 结尾（总结呼吁：良性互动守护勇敢）。
  deconstruction:
  - target: 【开头破题】
    instruction: 开门见山亮明核心判断，把求赞与给赞放在平等平视的双重视角下，迅速搭建互促共赢的立论框架。
  - target: 【主体一段：因果拆解】
    instruction: 先立足瞬间救人的实锤代价，再推导事后求赞的合理心理，有力破除‘做好事只能默默无闻’的虚妄苛求。
  - target: 【主体二段：双维深化】
    instruction: 区分大众九万人次点赞（情感温度）与公益机构奖励（机制托底）两个维度，拓宽论证格局与深度。
  - target: 【结尾收束归纳】
    instruction: 自然收拢到人际交往与社会心理层面，指出唯有回应温厚，勇敢方能长存，完成两分钟口语闭环。
  editor_notes: 本稿已按 Reviewer 审阅清单精修：厘清行动代价与心理期待的时间顺序；深入论证两层回应机制（情感温度与制度托底）；字数精确核定为正文汉字数 420 汉字、总字符数 459 字符。
legacy_unreviewed: false
