schema_version: '1.0'
id: C01
retelling_ref: R01
packet_ref: pkt-legacy-r01
title: “想被夸夸”：大方求赞，真诚给赞
learning:
  recap_facts:
  - 亳州美食街，幼童从三楼阳台外坠落，楚亮在买饭途中跑上前伸手接住，孩子滑落地面，楚亮多处疼痛；
  - 事后他在网上发帖，请大家给自己“点点赞、夸一夸”；
  - 帖子收获超过九万人次点赞，网友提出寄家乡特产，他的行为也获得了公益机构发放的专项奖励；面对孩子家长的感谢，他表示照顾好孩子最重要。
  questions:
  - 楚亮在买饭途中跑上前伸手接住坠楼幼童，自己也多处受伤，救人的事实和代价已经成立，为什么事后发帖求夸会引发广泛关注？
  - 一个人承受了惊险和伤痛之后，希望得到大家的认可与鼓励，这种心情该怎么理解？
  - 网友给出九万人次点赞，公益机构也送来奖励，这种积极回应对于挺身而出的人意味着什么？
  baseline_diagnostic: 救了人还上网发帖求大家夸夸，让人觉得挺意外，但也挺真实的。
  viewpoints:
  - id: v1
    claim: 救人之后大方求夸，并不会削弱先前舍身救人的事实与价值。
    evidence: 楚亮在危急瞬间冲上前伸手接住孩子，自己多处受伤；救人的事实和付出的代价已经实实在在地成立。
    explanation: 伸手救人冒了极大的受伤风险，避免了孩子坠地的悲剧；事后希望得到社会的肯定，是付出代价后真实正常的情感期待。
  - id: v2
    claim: 公众的热情点赞，让救人者的付出得到了温暖而真诚的反馈。
    evidence: 求夸网帖获得了超过九万人次点赞，网友热情留言鼓励，还有人想寄家乡特产。
    explanation: 大家没有用苛刻的标准挑刺，而是真诚回馈赞赏，让救人者感到自己的冒险被大家看见和珍惜。
  - id: v3
    claim: 公益机构给予的专项奖励，为民间的见义勇为提供了实实在在的鼓励。
    evidence: 楚亮的行为不仅得到网友关注，也获得了公益机构发放的奖励。
    explanation: 除了舆论的赞美，实打实的荣誉与奖励能够为自发的善行提供物质上的肯定与支持。
  - id: v4
    claim: 面对家属致谢嘱咐“照顾好孩子最重要”，展现了救人者不给受助家庭增加负担的体谅。
    evidence: 面对赶来感谢的孩子家人，楚亮最关心的是孩子的安全与恢复。
    explanation: 行善后不以恩人自居，而是设身处地为对方着想，展现了质朴善良的处事分寸。
  reasoning_lessons:
  - title: 怎么想到的：为什么求夸不影响救人的价值
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: 读这则材料，很多人第一反应是觉得楚亮“求夸”很新鲜。怎样把这个有意思的细节想深一步？先看事实：孩子悬在三楼，楚亮冲上前伸出双手接住，自己被砸得身上多处疼痛。在危急的一瞬间，救人的事实已经发生，付出的身体代价也已经实实在在地承担了。再看求夸：脱离危险之后，他在网上希望大家夸夸自己。有人可能会嘀咕“做好事怎么还主动要表扬”。但仔细想：冒着受伤风险去救一个素不相识的孩子，事后希望听到一句肯定，这是人很真实、也很朴素的心情。只要动机光明正大，希望自己的辛苦被看见，丝毫不会抵消先前勇敢行动的分量。看清了这一点，再看网友的九万人次点赞和公益机构的奖励，就能理解：宽厚真诚的社会，懂得珍惜每一份真实的善良。
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 救人之后，楚亮在网上发帖请大家夸夸自己，这份坦率同样让人感到温暖。做好事的人可以大方求夸，看到好事的人也乐于真诚给赞。当善意走出一步，理应得到社会温暖而有分寸的回响。
  body:
  - id: b1
    claim: 首先，大方求夸丝毫不会削弱舍身救人的事实与价值。
    paragraphs:
    - 在危急时刻，楚亮跑上前伸出双手接住幼童，自己承受了多处疼痛，救人的事实与付出的代价在瞬间已经实实在在地成立。面对巨大的风险与伤痛，事后希望得到社会的看见与肯定，是人之常情。我们不该用苛求无私的道德条框去要求行善者只能默默承受，坦然表达对认可的期待，同样光明磊落，值得被真诚尊重。
  - id: b2
    claim: 其次，社会的真诚回馈让施救者的付出得到了切实的珍惜。
    paragraphs:
    - 面对楚亮的求赞帖，网友们没有挑剔审判，而是用超过九万人次真诚的点赞与留言表达敬意，公益机构也及时送上了专项奖励。这份回响，既有公众的情感温度，也有实实在在的物质鼓励。这一次，他的挺身而出没有被冷落，真诚的回馈让勇敢得到了实实在在的回应；也希望这份温暖的互动，能让下一次挺身而出更有底气。
  closing: 愿意求赞的人不必难为情，愿意给赞的人也不必吝惜掌声。当真实的勇敢总能迎来温暖的回应，善良才会在人与人之间传递得更踏实、更长远。
teaching:
  spine: 开头（大方求赞与真诚给赞并立）→ 主体一（救人代价已成立，求赞不削弱善举价值）→ 主体二（公众点赞与专项奖励给予切实鼓励）→ 结尾（总结呼吁：真诚回应守护勇敢）。
  deconstruction:
  - target: 【开头破题】
    instruction: 开门见山亮明判断，把“求赞”与“给赞”平视放在一起，立住双向互动的骨架。
  - target: 【主体一段：因果说理】
    instruction: 首句提出分论点；第2句用接住孩子和多处疼痛的事实说明代价已经成立；第3-4句解释为什么希望被肯定合情合理，破除道德苛责。
  - target: 【主体二段：双重回响】
    instruction: 首句提出回响意义；第2句列举九万人次点赞（情感）与专项奖励（实际鼓励）；第3句从本次回应延伸到对下一次勇敢的期待。
  - target: 【结尾收拢】
    instruction: 前半句归纳求赞与给赞双方的心态，后半句落脚到善意长远传递的愿望，完成口语表达闭环。
  editor_notes: 备课参考：学生初读可能觉得“求夸”有点滑稽，备课时重点引导学生看清因果：伸手接住孩子承受多处疼痛，救人的事实和身体代价在瞬间已经成立；事后希望听到一句夸奖是人之常情，丝毫不会减损善举的价值。教学时着重让学生体会这次公众点赞与实际奖励带来的温暖，不用抽象大词，讲出人之常情即可。正文汉字数约439字。
legacy_unreviewed: false
