schema_version: "1.0"
id: C01
retelling_ref: R01
packet_ref: pkt-legacy-r01
title: “想被夸夸”：大方求赞，真诚给赞
learning:
  recap_facts:
    - 亳州美食街，幼童从三楼阳台外坠落，楚亮伸手接住、多处疼痛；
    - 他当晚发帖请大家“点点赞、夸夸我”；
    - 帖子收获超九万人次点赞，网友提出寄家乡特产，他婉拒家属谢礼并获得公益奖励。
  questions:
    - 把楚亮的动作按顺序说出来：他先听到什么、看见什么、做了什么、结果如何？
    - 他婉拒孩子家长的谢礼，却在网上发帖请网友“夸夸我”，两件事放在一起怎么理解？
    - “做好事不留名”是我们从小听熟的传统。楚亮的做法与这句话有什么相通和不同？
    - 九万多次点赞和网友要寄的特产，这些回应给救人者和大家带来了什么？
  baseline_diagnostic: 初步感受：坦率，可爱。（评述不能只停留在“很可爱、很有趣”，要解释清楚为什么求赞不会让善行贬值，以及为什么真诚回应同样重要。）
  viewpoints:
    - id: v1
      claim: 大方求赞，不会让善举本身的价值打折。
      evidence: 伸手救人已经完成并承受了伤痛，事后希望付出被肯定，是完全合情合理的坦率心愿。
      explanation: 帮助他人的事实不会因为当事人表达了被认可的愿望而改变。
    - id: v2
      claim: 真诚给赞，要让付出者真切感受到自己的善意被看见、被尊重。
      evidence: 九万多名网友点赞、留言夸奖甚至要寄特产，把感谢具体落实到了行动者身上。
      explanation: 社会的良性互动需要及时的正向反馈，让行善者知道善意得到了郑重珍惜。
    - id: v3
      claim: 不收家属当面重谢却向陌生网友求夸，展现了不图利益、只愿善意被回应的分寸感。
      evidence: 他宽慰孩子母亲“照顾好孩子最重要，别有心理负担”，婉拒物质报酬，只在网上求精神夸赞。
      explanation: 这说明他伸手救人不是为了交换现实利益，而是珍惜社会整体的温暖连接。
    - id: v4
      claim: “做好事不留名”是高尚的美德，但不必把它变成评价所有善举的唯一门槛。
      evidence: 传统叙事往往偏好默默奉献，但坦然说出付出的辛苦同样真实可敬。
      explanation: 宽容、多元的公益文化应该接纳不同性格的行善者，不必苛求道德完美主义。
  reasoning_lessons:
    - title: 怎么想到的：抓对比看分寸
      target_viewpoint_ids:
        - v1
        - v3
      deduction_text: 材料里有两处细节值得放在一起看：一处是他当晚发帖请网友“点点赞、夸夸我”；另一处是他对赶来致谢的孩子母亲说“照顾好孩子最重要，你不要有心理负担”，婉拒了谢礼。乍一看，做了好事主动求夸似乎有些张扬；但结合他不收私利的做法，就能看清他的分寸所在——他不是借机索取报酬，而是希望这份冒着危险的付出得到精神上的认同。把这两处放在一起，就能明白：大方求赞不是功利交换，而是渴望善意被看见的真实心愿。
speech:
  selected_viewpoint_ids:
    - v1
    - v2
  main_claim: 救人之后，楚亮在网上坦然求赞，这份坦率同样值得尊重。做好事的人可以大方求赞，看到好事的人也不妨真诚给赞。善意走出了一步，也理应得到温暖的回应。
  body:
    - id: b1
      claim: 首先，大方求赞不会让善举打折。
      paragraphs:
        - 楚亮冲上前伸出双手接住坠落的幼童，自己身上多处负伤。事后一句“请大家夸夸我”，并没有改变勇敢救人的事实。一个人拼尽全力做成了一件好事，希望自己的付出被看见、被认可，是人之常情。做好事不留名固然崇高，但坦率表达心愿同样光明磊落，绝不比默默离开低一等。
    - id: b2
      claim: 其次，真诚给赞是让善意持续发光的最好方式。
      paragraphs:
        - 面对楚亮的帖子，九万多名网友没有冷嘲热讽，而是热情点赞、留言鼓励，甚至想寄特产表达谢意。这样的良性互动，不仅温暖了救人者，也让所有人看到了善意的回响。生活里，无论是热心引路的人，还是默默帮忙的同学，具体的感谢都能让他们感到付出没有被当成理所当然。
  closing: 愿意求赞的人不必难为情，愿意给赞的人也不必吝啬掌声。当每一次勇敢都能得到真诚的回应，善良才会在人群中传递得更久、更远。
teaching:
  spine: 开头（大方求赞与真诚给赞并立）→ 主体一（求赞不会让善举打折）→ 主体二（给赞让善意得到具体回响）→ 结尾（总结呼吁：善意需要回应）。
  deconstruction:
    - target: 【开头与抓手】
      instruction: 开门见山亮明核心观点，将“求赞”与“给赞”两方摆在一起，确立双向奔赴的论述主线。
    - target: 【主体段推进】
      instruction: 主体一立足救人事实，扫除传统刻板印象，论证求赞的合理性；主体二转向公众回应，论证真诚反馈对良性社会氛围的价值，逻辑层次分明。
    - target: 【结尾收拢】
      instruction: 扣紧开头设定的求赞与给赞两个抓手，将个案提炼为普遍的社会交往道理，干净利落完成表达。
  editor_notes: S2 阶段重构，观点池由 2 条扩展为 4 条，纠正字数并重写清晰主线。
legacy_unreviewed: false
