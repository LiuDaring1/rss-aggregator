schema_version: '1.0'
id: C12
retelling_ref: R17
title: 村口大榕树下的39年：把重视教育写进村规的生命力
learning:
  recap_facts:
  - 柳州龙美村自1987年起由村民覃记安提议，全村众筹集资设立奖学金；
  - 奖学金在村口大榕树下发放，不论年龄，只要取得好成绩或有奖状人人有奖；
  - 连续坚守39年，今年奖励200多人，曾经偏僻的小山村走出了上百名大学生。
  questions:
  - 全村自发筹资哪怕几元钱也奖励给好学孩子，这种朴素做法为何能有这么大的力量？
  - 连幼儿园拿到“好孩子”奖状的娃娃也能登台领奖，这种制度设计体现了怎样的教育智慧？
  - 一项由村民自发定下的规矩为什么能延续整整39年，改变几代人的命运？
  baseline_diagnostic: 学生容易把奖学金只看作金钱数字，忽略了大榕树下的仪式感与全村共同体给予每个孩子的庄严认同。
  viewpoints:
  - id: v1
    claim: 不论年龄皆有嘉奖的包容设计，保护并点燃了每一个孩子对求知的渴望。
    evidence: 从幼儿园的“好孩子”到考取大学的优秀学子，全村都在大榕树下一视同仁地给予肯定。
    explanation: 荣誉不只属于尖子生，早期对努力的普遍认可，让每个孩子都能在掌声中体会到读书的尊严与快乐。
  - id: v2
    claim: 由全村村民众筹集资的朴素参与，让重视教育真正沉淀为共同体的集体共识。
    evidence: 39年前由老农覃记安提议，村民无论贫富自愿出资，几十年从未中断。
    explanation: 当奖金来自左邻右舍省吃俭用的支持，孩子背负的就不仅是一份零花钱，更是一份来自整个村庄的殷切期许。
  - id: v3
    claim: 长达39年的接力坚守，把一纸民间乡约淬炼成了不可磨灭的文化基因。
    evidence: 从第一代组织者到今天的年轻村干，奖学会走出上百名大学生，新一代学子又主动反哺家乡。
    explanation: 制度的生命力在于持之以恒，长期的坚守才能抵抗功利思想的侵蚀，真正重塑乡村的精神气质。
  - id: v4
    claim: 优秀的乡村治理与文化建设，往往根植于这种源自基层的制度性善意。
    evidence: 村落没有依赖外部庞大投入，仅靠村口一棵大榕树和质朴的村规，便营造出崇文重教的浓厚氛围。
    explanation: 发掘乡土社会的内生动力，用温暖而有规矩的仪式凝聚人心，是乡村振兴最坚实的人文力量。
  reasoning_lessons:
  - title: 怎么想到的：为什么几块钱的奖学金能改变几代人
    target_viewpoint_ids:
    - v1
    - v2
    deduction_text: '读柳州龙美村39年发奖学金的新闻，很多人第一眼看数字：全村才发一万三千多块钱，分到200多个孩子头上，一人可能就几十块钱。有人会问：这么点钱，能有多大用？要讲透这个故事，核心就在于看穿“钱多钱少”背后的深层教育机制。


      先看仪式的力量：每年秋季开学前，在村口的大榕树下，全村男女老少围坐在一起，为读书好的孩子鼓掌。连幼儿园拿到一张“好孩子”奖状的娃娃，也能昂首挺胸走上台。对一个刚懂事的孩子来说，这一刻他在全村人眼里是受尊重的，这种庄严的自豪感，千金难买。


      再看群体的期许：这笔钱不是某个大老板的施舍，而是村里叔叔阿姨、爷爷奶奶几块几毛凑起来的。拿到手里的不仅是奖金，更是一个村庄沉甸甸的托付。三十九年接力下来，村里人都以孩子读书好为光荣，崇尚知识的风气就这样顺理成章地融进了整个村子的血脉。'
speech:
  selected_viewpoint_ids:
  - v1
  - v2
  main_claim: 柳州龙美村村民自发集资，39年在大榕树下给好学孩子发奖学金。这个偏远小村的坚守启示我们：改变命运的不仅是金钱的多寡，更是共同体持之以恒的精神托举。把重视教育写进村规，乡村就能生发出无穷的希望。
  body:
  - id: b1
    claim: 首先，不论年龄皆有鼓励的包容设计，让每个孩子都能体会到求知的自豪与尊严。
    paragraphs:
    - 在大榕树下，不仅考上大学的青年受表彰，连幼儿园拿到好孩子奖状的娃娃也能登台领奖。奖金虽然不多，但在全村父老乡亲注视下的掌声，却无比珍贵。这份一视同仁的普遍认可，在孩子幼小的心灵里种下了尊重知识的种子，让求学读书成为一件堂堂正正、人人向往的光荣之事。
  - id: b2
    claim: 其次，长达39年的全员集资坚守，把朴素的乡约沉淀为了生生不息的文化基因。
    paragraphs:
    - 这项规矩由普通村民发起，三十九年来不论收成好坏，全村老小自愿出资从未间断。当奖励来自邻里乡亲省吃俭用的支持，孩子们感受到的便不仅是一笔钱，更是整个村落温暖的期盼。正是这份几十年如一日的坚持，让一个偏远小村走出了上百名大学生，彻底改写了村庄的命运。
  closing: 一棵大榕树，三十九载岁月，见证了乡村崇文重教的质朴信仰。只要重视教育的信念代代相传，乡村的未来就永远充满光明。
teaching:
  spine: 开头（破题立意：改变命运的是精神托举而非金钱多寡）→ 主体一（讲透仪式感与一视同仁的教育激励）→ 主体二（论述三十九年长期坚守重塑乡村文化）→ 结尾（升华乡土文化与教育信仰）。
  deconstruction:
  - target: 开头亮明宏旨
    instruction: 直接切中“精神托举”的核心，指出大榕树下制度的真正生命力。
  - target: 主体一阐述心理激励
    instruction: 用“幼儿园好孩子也能领奖”的生动细节，阐明普遍认可对孩子自信心的重塑。
  - target: 主体二分析长期主义
    instruction: 抓住“39年不间断”与“村民众筹”，论述质朴乡约如何转变为群体的文化血脉。
  editor_notes: 参考南国今报 2026-08-31 报道，聚焦乡村教育与文化建设，语言优美舒展，富有感染力。
