[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-pipeline"
version = "1.0.0"
description = "口语素材周刊 · 模块化内容出版管线"
authors = [{ name = "Antigravity Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "pymupdf>=1.24.0"
]

[project.scripts]
weekly-pipeline = "weekly_pipeline.cli:main"
