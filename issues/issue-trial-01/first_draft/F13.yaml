schema_version: '1.0'
id: F13
topic: 科技与人文 · 适老化与公共底线
source_name: 浙江在线·浙江宣传《适老化不能成“坑老化”》（节选）2026-09-17
source_date: '2026-09-17'
source_url: https://zjnews.zjol.com.cn/yc/qmt/202609/t20260917_31914387.shtml
context: 2026年9月中旬，针对手机应用“老年模式”频繁出现弹窗广告连环跳转、甚至诱导付费的“坑老”乱象，浙江宣传发表评论，从商业利益与公共产品底线两个维度深入辨析适老化的技术向善原则。
quote_paragraphs:
- 数字技术的进步，终究要落到对人的关怀上。数字产品的研发，也要向老人主动靠拢。适老化改造，不能做表面功夫，而要慢下来，真正去感受老人真实的需求，让数字产品去“适配”老人，而不是让老人反过来“适配”产品。
- 进入数字化时代，搭建普惠的适老化服务，本就是一项应当抓实抓细的工作。相关部门不妨形成这样的共识：虽然互联网适老化产品由企业开发运营，但它却自带公共服务的属性，应当以公共产品的标准来打造。这并非否定商业逻辑，而是为行业划定底线，督促企业兼顾盈利目标与老年群体的使用安全、使用便利，不让适老化改造仅仅停留在放大字体等表层。
analyze: 作者在剖析适老化乱象时，提出了极具思辩价值的核心判断：“让数字产品去适配老人，而不是让老人反过来适配产品”。文段没有陷入单纯指责商业盈利的道德批判，而是清晰划定了“商业开发”与“公共产品属性”的边界，指出适老化产品因其普惠性而天然承载着公共底线。这种既承认商业逻辑、又强调公共责任的辩证框架，是阐述科技伦理与公共治理关系的典范。
memorize: “适老化改造，不能做表面功夫，而要慢下来，真正去感受老人真实的需求，让数字产品去‘适配’老人，而不是让老人反过来‘适配’产品。”
method: 属性归位与底线辨析——将企业研发的产品置于“公共服务属性”的维度审视，既承认商业规律，又划定社会责任底线，提升说理的公允度与穿透力。
demo_title: 示范｜换个话题，可以这样说
demo_text: 换个话题，可以这样说：谈到我们身边共享单车停放混乱的治理，其实也是同理。很多平台把车投向街头后，就寄希望于市民自发摆正，这是让公众去“适配”管理，而不是管理来“适配”城市。我们必须认识到：共享出行虽然是商业行为，但它占用的是公共道路，天然带有公共设施的属性，就必须按照公共产品的标准去精细化运营。这绝不是否定企业的商业诉求，而是给行业划定秩序底线，要求企业在追求投放规模的同时，必须兼顾公共空间的整洁与行人的通行便利。
demo_is_hypothetical: true
