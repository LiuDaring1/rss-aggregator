title: 山东大二女生赵敏连续两年进山：给乡村女童开设专属生理科普课
date_label: 事发 2026 年 7~8 月 · 湖南娄底
source_label: 来源：三湘都市报 2026-09-06 / 天天正能量 2026-09-06
material_paragraphs:
- 2026 年暑期，山东师范大学大二学生赵敏以支教队队长身份，带着打磨成熟的青春期生理科普课程，再次走进湖南娄底山区。这是赵敏连续第二年进山支教，源于自己年少时对生理知识的匮乏与困惑，她从大一开始便在社团中发起女童生理课倡议，并自主联系公益组织筹措卫生巾物资。为了照顾乡村女孩的自尊心，团队用温和摸底、私下沟通和妥帖包装的方式发放物资，把这门自己小时候缺失的必修课补给大山里的孩子。
- 赵敏团队设计的课程涵盖三大模块：第一堂讲基础生理知识与卫生防护，第二堂聚焦防性侵与自我保护，第三堂引导孩子们理解女性力量。在课堂上，赵敏用温柔开放的氛围打破谈“性”色变的羞耻感，纠正了贴身衣物混洗等健康误区；在黑板的“成长树”上，孩子们用粉笔郑重写下“变胖也没关系”“女性不必只有一种答案”，课后互动的“藏宝袋”里更塞满了孩子们写给她的感谢信。9 月 6 日，阿里公益联合三湘都市报为赵敏颁发了小微公益专项奖。
