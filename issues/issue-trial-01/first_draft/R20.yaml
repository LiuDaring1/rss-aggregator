title: 张家界志愿者张安林与何元华5年走访500次：成50名困境儿童“爱心爸妈”
date_label: 事发 2021~2026 年 · 湖南张家界
source_label: 来源：三湘都市报 2026-09-02 / 天天正能量 2026-09-03
material_paragraphs:
- 过去五年间，在湖南张家界武陵源区的群山之中，武陵源区景军义工服务队“小兵快跑”助学组的志愿者张安林与何元华，带领 15 人团队走遍全区 6 个乡镇街道、22 个村社区，累计崎岖山路徒步走访 500 余次，筹集助学金 60 万元并全部直达监护人账户，捐赠学习生活物资 10 万余元，一对一精准结对帮扶 50 名留守与困境儿童。由于山路狭窄车辆难通，两人常年肩扛手提物资进村叩门，被孩子们亲切地唤作“张爸爸”和“何妈妈”。
- 相比物质资助，团队更注重情感陪伴与心理抚慰。何元华随身携带一本详尽的冷暖台账，逐户记录孩子们的测验名次、日常心事甚至被窝抹泪的琐事；在帮扶因父亲病故、母亲离家而自卑孤僻的女孩许念时，两人坚持上门陪伴两年多，从最初的默不作声，到女孩主动塞糖果、发语音汇报考试成绩，再到如今阳光开朗地在院里剥苞谷、递自种橘子。9 月 2 日，阿里公益天天正能量联合三湘都市报，为张安林与何元华颁发小微公益专项奖。
