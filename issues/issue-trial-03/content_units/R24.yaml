ref_retelling: 云南孟连边境村寨的少年岩新，在高考前夕遭遇父亲和奶奶相继离世的沉重打击。面对困境，他坚韧自强，以班级第一的成绩考入四川师范大学。暑假里，他穿着满身泥巴的校服帮家里种咖啡攒学费，还用自学的书法为任课老师们手写祝福卡。这是他第一次走出偏远县城，全填师范志愿的他坚定表示：“离开大山是为了回到大山，未来要回边境当老师。”这场寒门少年的奋进，生动展现了在逆境中挺立脊梁、心怀感恩回馈乡土的真挚情怀。
