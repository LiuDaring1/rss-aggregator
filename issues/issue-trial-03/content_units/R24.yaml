title: 云南边境少年考上川师大：穿沾泥校服种咖啡，“离开大山是为了回到大山”
date_label: 暑期劳动 2026 年 7~8 月 · 开学赴校 2026 年 9 月 · 云南普洱孟连 / 四川成都
source_label: '来源：四川日报·四川手机报 2026-09-16 / 天天正能量 2026-09-16（来源ID: ttzl-45358）'
material_paragraphs:
- 云南省普洱市孟连县南雅村班丁组，靠近中缅边境仅40公里。村寨少年岩新家境困难，住着简陋木板房，山路崎岖难行。高考前夕，岩新的父亲与奶奶在数月内相继离世，家庭遭遇重大重创。面对接踵而至的家庭变故，岩新没有消沉绝望，而是默默承受生活的重压，发奋图强刻苦求学。在今年高考中，岩新以班级第一名的优异成绩，顺利被四川师范大学外国语学院英语专业录取。
- 整个暑假期间，岩新身穿沾满泥巴的旧校服，顶着烈日在田间帮家里种咖啡、收咖啡豆赚钱补贴学费。岩新从未上过补习班，在艰苦环境中自学瘦金体书法，字迹苍劲工整，并在毕业前用毛笔为自己的任课老师们手写祝福卡片。这趟前往成都上大学，是他人生第一次走出读书的县城。面对社会的爱心资助，岩新所有的高考志愿全部填报了师范类专业，他坚定表示：“走出大山，是为了更好地回到大山，未来毕业后要回边境家乡当老师，帮助更多大山里的孩子。”
