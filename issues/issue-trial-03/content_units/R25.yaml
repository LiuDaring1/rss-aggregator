ref_retelling: 江西工业工程职业技术学院学生黄志强与同学黄松涛，暑期带上一本大一考取的低压电工证和一个工具包，开着车穿梭在抚州乐安乡村，免费为留守老人修理家电。针对农村老人因舍不得花钱而忍受吊扇、电饭煲损坏的现实困境，两人顶着酷暑主动敲门排查隐患，在二十多天里为100多户老人修好了故障电器，并普及用电安全知识。老人们切开西瓜热情感谢，乡亲们由衷称赞他们的实在与担当。他们用一把小小的螺丝刀，把所学技能运用在最需要的地方，诠释了知行合一的青春作风。
