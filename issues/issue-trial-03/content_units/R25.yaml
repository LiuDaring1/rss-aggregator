category: 正向社会生活
title: 两名大二职校生暑期走村免费修家电：一本电工证、一个工具包，服务百户乡村老人
date_label: 暑期下乡 2026 年 7~8 月 · 报道表彰 2026 年 8 月 17 日 · 江西抚州乐安
source_label: '来源：江南都市报 2026-08-17 / 天天正能量 2026-08-17（来源ID: ttzl-45327）'
material_paragraphs:
- 江西工业工程职业技术学院机电工程学院学子黄志强，来自抚州市乐安县的一个建档立卡户家庭，求学路上深受国家和社会的帮扶。今年5月，还在读大一的黄志强利用专业知识考取了低压电工证。放暑假回村后，他没有选择宅家休闲，而是敏锐注意到乡村留守老人们面对故障家电的现实难题：吊扇不转了、电饭煲不热了、电水壶跳闸了，很多坏掉的家电老人们舍不得扔，也舍不得花钱找人修，只能在炎夏中默默将就。
- 心怀感恩的黄志强叫上同专业同学黄松涛，两人带上一本低压电工证和一个工具包，顶着酷暑开着车穿梭在周边村庄，挨家挨户敲开留守老人的门，主动免费为老人排查线路、修理故障家电。很多时候，他们爬上高处换个空气开关、蹲在地上拧紧松动的螺丝，风扇就重新转动，老人们的脸上也露出了舒心的笑容。从7月20日开始的二十多天里，他们累计为100多户村民免费修好了小家电，还耐心教老人安全用电常识。村民们热情送来切好的西瓜表达感谢，纷纷赞叹两名年轻人的实在与热心。
