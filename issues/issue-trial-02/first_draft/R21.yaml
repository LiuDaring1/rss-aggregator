category: 正向社会生活
title: 杭州女教师为长江源生态发求助：上百名工程师业余接单开发AI工具
date_label: 事发 2026 年 8~9 月 · 青海唐古拉山镇 / 浙江杭州
source_label: 来源：潮新闻·钱江晚报 2026-09-15 / 天天正能量 2026-09-15
material_paragraphs:
- 2026 年夏天，杭州云谷学校初中科学教师于淼淼前往青海唐古拉山镇，在海拔 4500 米的长江源水生态环境保护站担任生态志愿者。在高原巡护期间，她发现志愿者们白天在荒野捡拾垃圾、观测野生动物，晚上却要花费数小时在弱网环境下把上百组监测数据手工录入
  Excel 表格，繁重的机械统计占用了大量野外保护精力。于淼淼回到杭州后，在技术圈发起倡议，希望用 AI 技术为长江源生态一线减负。
- 求助发出后，近百名科技企业工程师与程序员自发组成极客志愿队，利用业余时间开启了一场跨越近三千公里的技术接力。针对高原高寒、弱网乃至无网的严苛条件，工程师们研发出适配移动端的轻量化离线
  AI 助手，实现了红外相机野生动物照片的自动识别分拣与垃圾分类智能统计，并将录入效率提升数倍。2026 年 9 月 15 日，阿里公益天天正能量为于淼淼及技术志愿群体颁发特别奖。
