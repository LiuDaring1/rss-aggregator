ref_retelling: 2026年9月8日中午，宁波北仑街头一名近两岁男童因异物卡喉窒息，嘴唇发紫瘫软在老人怀中。路旁汽修店老板赵小秋听见呼救立即冲上前接过孩子。他沉着运用平时在手机视频里学到的海姆立克急救法，单膝跪在水泥地上连续按压施救约两分钟，最终使孩子成功吐出异物、放声啼哭，顺利脱离生命危险。普通人的挺身而出与掌握关键急救技能，在生死关头筑起了一道坚固的生命防线。
