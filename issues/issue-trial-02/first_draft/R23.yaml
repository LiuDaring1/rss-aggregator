title: 两岁男童异物卡喉命悬一线：汽修店老板跪地两分钟海姆立克急救成功
date_label: 事发 2026 年 9 月 8 日 · 浙江宁波北仑
source_label: 来源：宁波晚报 2026-09-14 / 天天正能量 2026-09-14
material_paragraphs:
- 2026 年 9 月 8 日中午 12 点不到，宁波市北仑区戚家山街道街头突发惊险一幕：一位老人抱着年幼的孩子沿街慌乱奔跑呼救。原来，孩子在吃东西时不慎被异物卡住气道引发严重窒息。沿街开店已有
  10 年的汽修店老板赵小秋听到呼喊立刻冲出店门，从老人手中接过男童。当时孩子面色铁青、嘴唇发紫、全身瘫软，已失去哭声，生命危在旦夕。
- 面对突如其来的紧急险情，赵小秋没有慌乱。他迅速回忆起平时在手机科普视频中看过的急救知识，单膝跪在坚硬的水泥路面上，将孩子面向前方抱于怀中，双臂环抱其腹部，果断采用海姆立克急救法连续向上快速冲击。经过近两分钟不间断的施救，孩子终于呛出卡在气管内的异物，“哇”地一声大哭出来，面色随之转为红润。看到孩子转危为安，赵小秋才长舒一口气，将孩子交还给泣不成声的家属。
