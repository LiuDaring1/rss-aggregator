category: 正向社会生活
title: 杭州女教师为长江源生态发求助：上百名工程师业余接单开发AI工具
date_label: 志愿服务 2026 年 7 月 · 方案路演 2026 年 9 月 13 日 · 青海格尔木 / 浙江杭州
source_label: '来源：潮新闻·钱江晚报 2026-09-15 / 天天正能量 2026-09-15（来源ID: ttzl-45351）'
material_paragraphs:
- 2026 年夏天，杭州云谷学校教师于淼淼前往青海格尔木唐古拉山镇，在海拔 4540 米的长江源水生态环境保护站担任生态志愿者。在高原巡护期间，她发现志愿者们白天奔波野外记录环境与野生动物，夜间却要在高寒弱网环境下，花费两至三个小时把上百组观测数据手工逐条录入 Excel 表格，繁重的机械统计占用了大量野外精力。于淼淼回到杭州后发出求助，希望用技术为一线守护者减负。
- 求助引发强烈反响，上百名科技企业工程师自发组成极客志愿队，利用业余时间开启了一场跨越数千公里的技术接力。针对高原弱网甚至断网的严苛环境，工程师们开发出轻量化离线工具与生态监测原型。2026 年 9 月 13 日，31 个方案完成路演评审，正将各组亮点融合为离线可用、人机协同的一体化生态监测平台，后续将辅助物种识别与报表生成。9 月 15 日，阿里公益天天正能量为于淼淼及技术志愿群体颁发特别奖。
