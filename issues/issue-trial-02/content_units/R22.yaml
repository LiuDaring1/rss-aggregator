title: 萧山17岁女生脱校服垫地为老人止血：路人暖心喊话“我给你洗衣服”
date_label: 事发 2026 年 9 月 3 日 · 浙江杭州萧山
source_label: 来源：潮新闻·钱江晚报 / 杭州萧山融媒 2026-09-11
material_paragraphs:
- 2026 年 9 月 3 日清晨 7 点左右，杭州市萧山区育才路学士桥附近，一位白发老太太在晨练途中不慎仰面摔倒，后脑着地流血不止。正值早高峰，就在路过群众面露迟疑的瞬间，17
  岁的萧山技师学院自动化专业高二女生周子歆快步冲上前去。面对血流不止的老人，她没有丝毫犹豫，迅速脱下自己洁白的校服外套叠成软垫，紧紧按压在老人的后脑伤口上止血，并冷静拨打
  120 电话求助。
- 周子歆蹲在冰冷的地面上轻声安抚老人，一直守护到急救车抵达。老人的鲜血染红了大半件校服，路过的一位阿姨被女孩的果敢与赤诚深深打动，主动走上前对她说：“姑娘好样的，别担心，把衣服给我，我拿回家给你洗干净！”经医院及时抢救，老人顺利脱离危险并康复出院。周子歆洗净校服后平静回到学校上课，面对赞誉她表示“当时只想着救人，换成谁都会这么做”。
