ref_retelling: 2026年9月8日中午，宁波北仑戚家山街头一名不到两岁的男童因进食卡喉窒息，嘴唇发紫瘫软在老人怀中。开店10年的汽修店老板赵小秋听到呼救立刻接过孩子。由于老人没带手机，赵小秋一边招呼周边群众拨打120，一边沉着运用在手机视频学到的海姆立克急救法展开救助。持续施救约两至三分钟后，孩子喉咙发出声音、眼睛睁开并出现吞咽动作。随后急救车赶到将孩子送医，次日奶奶专程登门致谢并告知孩子已脱险。普通人的挺身而出与日常急救知识的储备，在危急时刻筑牢了生命防线。
