title: 幼童异物卡喉命悬一线：汽修店老板运用海姆立克急救法施救
date_label: 事发 2026 年 9 月 8 日 · 浙江宁波北仑
source_label: '来源：宁波晚报 2026-09-14 / 人民日报 2026-09-18（来源ID: ttzl-45352）'
material_paragraphs:
- 2026 年 9 月 8 日中午 12 点不到，宁波市北仑区戚家山街道街头发生惊险一幕：一位老人抱着年幼的孩子沿街奔跑呼救。孩子因进食不慎被异物卡住气道引发窒息。路旁开店 10 年的 43 岁汽修店老板赵小秋闻声立刻上前，从老人手中接过孩子。小男孩看起来还不到 2 岁，当时嘴唇发紫、翻白眼、流口水、全身软绵绵瘫软，情况十分危急。
- 由于老人没带手机且急得方寸大乱，赵小秋一边招呼周边群众帮忙拨打 120 报警，一边运用平时在手机科普视频中自学的海姆立克急救法对男童展开紧急施救。救援持续约两至三分钟，渐渐地，孩子喉咙里发出“嗯嗯”的声音，眼睛睁开，并出现了吞咽动作。随后赶到的 120 急救车将孩子送往医院救治。次日一早，孩子奶奶专程赶到汽修店道谢，告知因施救及时孩子身体已无大碍。
